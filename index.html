  function renderDashboard() {
    const now = new Date();
    const today = dateKeyInZone(now);
    const nextWeek = toISODate(addDays(localDateFromKey(today), 7));
    const stats = dayStats(today);
    const videosToday = (state.videos || []).filter(v => v.timestamp && dateKeyInZone(v.timestamp) === today).reduce((sum,v) => sum + Number(v.count || 0), 0);
    const open = state.followups.filter(followupIsOpen).slice().sort((a,b) => followupDateTime(a) - followupDateTime(b) || followupPriorityRank(a.priority) - followupPriorityRank(b.priority));
    const overdue = open.filter(f => f.date < today);
    const dueToday = open.filter(f => f.date === today);
    const due = open.filter(f => f.date <= today);
    const upcoming = open.filter(f => f.date > today && f.date <= nextWeek);
    const active = state.merchants.filter(m => !m.archived);
    const activeIds = new Set(active.map(m => String(m.uid)));
    const contactedIds = new Set(active.filter(m=>merchantContactedThisMonth(m,now)).map(m=>String(m.uid)));
    const coverage = active.length ? Math.round(contactedIds.size / active.length * 100) : 0;
    const openCases = (state.cases || []).filter(record => !["Solved","Closed"].includes(record.status));
    const selectedFilter = ["due","overdue","today","upcoming"].includes(state.ui.cleanTodayFilter) ? state.ui.cleanTodayFilter : "due";
    const collections = { due, overdue, today:dueToday, upcoming };
    const rows = collections[selectedFilter];
    const filters = [["due","Due",due.length],["overdue","Overdue",overdue.length],["today","Today",dueToday.length],["upcoming","Next 7 days",upcoming.length]];
    const metric = (label, value, note) => `<div class="crm-stat"><span>${esc(label)}</span><strong>${esc(String(value))}</strong><small>${esc(note)}</small></div>`;
    return `<div class="crm-page">
      <header class="crm-page-head"><div><h1>Today</h1><p>${esc(formatDate(now,{weekday:"long",month:"long",day:"numeric"}))} · ${due.length} follow-up${due.length === 1 ? "" : "s"} due</p></div><div class="crm-actions"><button class="btn ghost" type="button" data-nav="workhub">Merchants</button><button class="btn primary" type="button" data-crm-new-followup>New follow-up</button></div></header>

        ${metric("Credited today",mmss(stats.creditedSec),`${stats.attempts} call attempts · ${mmss(stats.realSec)} talk time`)}
        ${metric("Monthly coverage",`${coverage}%`,`${contactedIds.size} / ${active.length} merchants attempted`)}
        ${metric("Photos today",stats.photosAdded,`${openCases.length} cases open`)}

      <section class="crm-section" aria-labelledby="crmFollowupHeading"><div class="crm-section-head"><div><h2 id="crmFollowupHeading">Follow-ups</h2><p>Keep the next action and its deadline together.</p></div><button class="btn small ghost" type="button" data-nav="followups">All follow-ups</button></div><div class="crm-tabs" role="group" aria-label="Follow-up dates">${filters.map(([value,label,count]) => `<button type="button" aria-pressed="${selectedFilter === value}" class="${selectedFilter === value ? "active" : ""}" data-crm-today-filter="${value}">${label}<span>${count}</span></button>`).join("")}</div>${cleanFollowupTable(rows,selectedFilter === "due" ? "You have no overdue or due-today follow-ups." : "No follow-ups in this period.")}</section>
      ${!state.merchants.length ? `<div class="crm-empty"><strong>Add your merchant portfolio</strong><p>Import your merchants, then import your Outreach call CSV to update coverage and minutes.</p><button type="button" class="btn ghost" data-nav="import">Open Import Center</button></div>` : ""}
      ${state.unmatchedCalls?.length ? `<div class="crm-inline-notice"><span>${state.unmatchedCalls.length} imported call${state.unmatchedCalls.length === 1 ? " needs" : "s need"} a merchant match.</span><button type="button" class="btn small ghost" data-crm-review-unmatched>Review calls</button></div>` : ""}
    </div>`;
  }

ord.id)}">Open link</a>` : ""}</div></td></tr>`;

  function renderGlobalCases() {
    const filters = { q:"", status:"open", ...(state.ui.cleanCaseFilters || {}) };
    const query = normalizeText(filters.q);
    const records = (state.cases || []).slice().sort((a,b) => {
      const aReview = cleanCaseReview(a);
      const bReview = cleanCaseReview(b);
      if (aReview && bReview) return followupDateTime(aReview) - followupDateTime(bReview);
      if (aReview || bReview) return aReview ? -1 : 1;
      return String(b.updatedAt || b.createdAt || "").localeCompare(String(a.updatedAt || a.createdAt || ""));
    });
    const active = records.filter(record => !["Solved","Closed"].includes(record.status));
    const filtered = records.filter(record => {
      if (query && !caseSearchText(record).includes(query) && !normalizeText(getMerchant(record.uid)?.store_name || "").includes(query)) return false;
      if (filters.status === "open" && ["Solved","Closed"].includes(record.status)) return false;
      if (filters.status !== "all" && filters.status !== "open" && record.status !== filters.status) return false;
      return true;
    });
    return `<div class="crm-page"><header class="crm-page-head"><div><h1>Cases</h1><p>${active.length} open across your portfolio · ${records.length} total</p></div><button type="button" class="btn primary" data-crm-new-case ${state.merchants.some(m => !m.archived) ? "" : "disabled"}>New case</button></header><div class="crm-toolbar"><div class="field"><label for="crmCasesSearch">Search</label><input id="crmCasesSearch" type="search" value="${attr(filters.q)}" placeholder="Case number, merchant, category or notes" /></div><div class="field"><label for="crmCasesStatusFilter">Status</label><select id="crmCasesStatusFilter"><option value="open" ${filters.status === "open" ? "selected" : ""}>All open cases</option><option value="all" ${filters.status === "all" ? "selected" : ""}>All statuses</option>${CASE_STATUSES.map(status => `<option value="${attr(status)}" ${filters.status === status ? "selected" : ""}>${esc(status)}</option>`).join("")}</select></div><span class="crm-result-count">${filtered.length} case${filtered.length === 1 ? "" : "s"}</span></div><section class="crm-section" aria-label="Portfolio cases">${cleanCaseTable(filtered)}</section><p class="crm-muted">Schedule a review to add the case to your follow-ups and Today queue.</p></div>`;

        const existing = cleanCaseReview(record);
        if (existing) { openFollowupEditorModal(existing.id); return; }
        const reference = record.externalCaseNumber || record.displayId || record.id;
        openFollowupEditorModal("", { uid:merchant.uid, date:dateKeyInZone(new Date()), time:"10:00", reason:"General Follow-up" });
        const values = {
          followupSummary:`Review case ${reference}`,
          followupContext:[`Case: ${reference}`, caseTypeLabel(record.caseType), record.caseUrl, record.internalNotes].filter(Boolean).join("\n"),
          followupNextAction:"Check the case status and record the next step.",
          followupTags:`case:${record.id}`
        };
        Object.entries(values).forEach(([fieldId,value]) => { const input = document.getElementById(fieldId); if (input) input.value = value; });
        return;
      }
      if (event.target.closest("[data-crm-new-case]")) {
        const merchants = state.merchants.filter(m => !m.archived).slice().sort((a,b) => String(a.store_name || "").localeCompare(String(b.store_name || "")));
        if (!merchants.length) return toast("Import merchants before creating a case");
        openModal("New case", "Choose the merchant for this case.", `<div class="field"><label for="crmNewCaseMerchant">Merchant</label><select id="crmNewCaseMerchant"><option value="">Select a merchant</option>${merchants.map(m => `<option value="${attr(m.uid)}" ${String(state.selectedUid) === String(m.uid) ? "selected" : ""}>${esc(m.store_name)}${m.store_id ? ` · ${esc(m.store_id)}` : ""}</option>`).join("")}</select></div><div class="case-modal-actions"><button type="button" class="btn ghost" data-action="cancelCaseEditor">Cancel</button><button type="button" class="btn primary" data-crm-create-case>Continue</button></div>`);
        return;
      }
      if (event.target.closest("[data-crm-create-case]")) {
        const merchant = getMerchant(document.getElementById("crmNewCaseMerchant")?.value);
        if (!merchant) return toast("Select a merchant");
        state.selectedUid = merchant.uid;
        scheduleSave();
        closeModal();
        openCaseEditor();
      }
    });
  }

  function deleteAllFollowups() {
    const count = state.followups.length;
    if (!count) return;
    const accepted = confirm(`¿Borrar los ${count} follow-ups de todos los merchants y fechas, incluidos los completados y los que no aparecen con los filtros actuales? Esta acción no se puede deshacer.`);
    if (!accepted) return;
    state.followups = [];
    state.ui.selectedFollowupId = "";
    state.ui.followupDraftDate = "";
    state.ui.followupDraftTime = "";
    followupEditorChecklistDraft = [];
    closeModal();
    scheduleSave();
    renderApp();
    toast(`${count} follow-ups eliminados`);
  }

  <script id="dashworkBentoControls">
  (() => {
    "use strict";
    document.getElementById("bentoNotificationButton")?.addEventListener("click", () => {
      try {
        const today = dateKeyInZone(new Date());
        const pending = state.followups.filter(item => followupIsOpen(item) && item.date <= today).length;
        if (pending > 0) {
          setView("followups");
          toast(`${pending} follow-up${pending === 1 ? " requires" : "s require"} attention.`);
        } else {
          toast("No pending follow-ups. Your action queue is clear.");
        }
      } catch {
        document.querySelector('[data-nav="followups"]')?.click();
      }
    });
    document.getElementById("bentoUserChip")?.addEventListener("click", () => {
      try { setView("settings"); } catch { document.querySelector('[data-nav="settings"]')?.click(); }
    });
  })();
  </script>


  






<script id="dashworkDeviceModeController">(() => {
  "use strict";
  const root = document.documentElement, body = document.body;
  const media = window.matchMedia?.("(max-width: 1080px)");
  try {
    localStorage.removeItem("dashwork_device_mode_v1");
    localStorage.removeItem("dashwork_density_x");
  } catch {}
  function updateLayout() {
    const mode = media?.matches ? "mobile" : "pc";
    const previous = root.dataset.deviceMode;
    root.dataset.deviceMode = mode;
    body.dataset.deviceMode = mode;
    body.classList.toggle("device-pc", mode === "pc");
    body.classList.toggle("device-mobile", mode === "mobile");
    if (previous !== mode) {
      body.classList.remove("nova-sidebar-open");
      document.getElementById("novaMobileMenu")?.setAttribute("aria-expanded", "false");
    }
    root.dispatchEvent(new CustomEvent("dashwork:device-mode", { detail: { mode } }));
  }
  updateLayout();
  if (media?.addEventListener) media.addEventListener("change", updateLayout);
  else if (media?.addListener) media.addListener(updateLayout);
})();
</script>
