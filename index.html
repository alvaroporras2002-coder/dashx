  function renderProfileSparkline(values, labels = []) {
    const series = Array.isArray(values) ? values.map(value => Math.max(0, Number(value) || 0)) : [];
    if (!series.length || !series.some(value => value > 0)) {
      return `<div class="profile-chart-empty"><span aria-hidden="true">⌁</span><strong>No activity trend yet</strong><small>Calls, photos, sales, credits and follow-ups will build this chart.</small></div>`;
    }
    const width = 520, height = 230, padLeft = 38, padRight = 18, padTop = 18, padBottom = 36;
    const rawMax = Math.max(...series);
    const max = rawMax <= 4 ? 4 : Math.ceil(rawMax / 5) * 5;
    const plotWidth = width - padLeft - padRight;
    const plotHeight = height - padTop - padBottom;
    const step = plotWidth / Math.max(1, series.length - 1);
    const points = series.map((value, index) => {
      const x = padLeft + index * step;
      const y = padTop + plotHeight - (value / max) * plotHeight;
      return [x, y, value];
    });
    const line = points.map(([x, y]) => `${x},${y}`).join(" ");
    const area = `${padLeft},${padTop + plotHeight} ${line} ${padLeft + plotWidth},${padTop + plotHeight}`;
    const gridValues = [max, Math.round(max / 2), 0];
    return `<svg class="sparkline-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-label="Seven-day merchant activity trend">
      <defs><linearGradient id="profileTrendArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--bento-primary)" stop-opacity=".22"/><stop offset="100%" stop-color="var(--bento-primary)" stop-opacity="0"/></linearGradient></defs>
      ${gridValues.map(value => { const y = padTop + plotHeight - (value / max) * plotHeight; return `<line class="sparkline-grid" x1="${padLeft}" y1="${y}" x2="${padLeft + plotWidth}" y2="${y}"/><text class="sparkline-axis-label" x="${padLeft - 10}" y="${y + 3}" text-anchor="end">${value}</text>`; }).join("")}
      <polygon class="sparkline-area" points="${area}"/>
      <polyline class="sparkline-line" points="${line}"/>
      ${points.map(([x, y, value], index) => `<circle class="sparkline-dot" cx="${x}" cy="${y}" r="4"><title>${esc(labels[index] || `Day ${index + 1}`)}: ${value} event${value === 1 ? "" : "s"}</title></circle><text class="sparkline-day-label" x="${x}" y="${height - 10}" text-anchor="middle">${esc(labels[index] || String(index + 1))}</text>`).join("")}
    </svg>`;
  }

  function kvCard(label, value) {
    return `<div class="kv-card"><span>${esc(label)}</span><strong>${esc(value == null || value === "" ? "—" : value)}</strong></div>`;
  }

  function coverageCard(label, value) {
    const n = value == null ? 0 : Number(value);
    const cls = value == null ? "" : n >= 80 ? "green" : n >= 50 ? "orange" : "red";
    return `<div class="coverage-card"><strong>${pct(value)}</strong><span>${esc(label)}</span><div class="progress ${cls}"><span style="width:${clamp(n,0,100)}%"></span></div></div>`;
  }

  function merchantTimeline(uidValue) {

    return [
      ...callsFor(uidValue).map(x=>({icon:"☎",title:x.disposition||x.state,detail:`Real ${mmss(x.durationSec)} · Credited ${mmss(x.creditedSec)}${x.note?` · ${x.note}`:""}`,timestamp:x.completedAt})),
      ...photosFor(uidValue).map(x=>({icon:"▧",title:`${x.photosAdded} photos added`,detail:`${x.status} · Coverage ${pct(x.coverageAfter)}${x.note?` · ${x.note}`:""}`,timestamp:x.timestamp})),
      ...followupsFor(uidValue).map(x=>({icon:"◫",title:`Follow-up ${x.status}`,detail:`${x.reason} · ${x.date} ${x.time||""}`,timestamp:x.updatedAt||x.createdAt})),
      ...salesFor(uidValue).map(x=>({icon:"◎",title:`Sales: ${x.type}`,detail:`${x.status} · ${x.campaign||"No campaign"}`,timestamp:x.timestamp})),
      ...creditsFor(uidValue).map(x=>({icon:"$",title:`Credit ${money2(x.amount)}`,detail:`${x.type} · ${x.status}`,timestamp:x.timestamp})),
      ...casesFor(uidValue).map(x=>({icon:"#",title:`${caseTypeLabel(x.caseType)} · ${x.status}`,detail:`${x.displayId || x.externalCaseNumber || "Case"}${x.am?.category ? ` · ${x.am.category}` : ""}`,timestamp:x.updatedAt || x.createdAt}))
    ].sort((a,b)=>String(b.timestamp).localeCompare(String(a.timestamp)));
  }

  const FOLLOWUP_STATUS_OPTIONS_EXT = [
    { value:"Pending", label:"Pending" },
    { value:"In Progress", label:"In progress" },
    { value:"Waiting on Merchant", label:"Waiting on merchant" },
    { value:"Completed", label:"Completed" },
    { value:"Cancelled", label:"Cancelled" }
  ];

  const FOLLOWUP_OUTCOME_OPTIONS = [
    { value:"Not contacted", label:"Not contacted yet" },
    { value:"No answer", label:"No answer" },
    { value:"Spoke", label:"Conversation completed" },
    { value:"Interested", label:"Interested / receptive" },
    { value:"Waiting on Merchant", label:"Waiting on merchant" },
    { value:"Internal action", label:"Internal action pending" },
    { value:"Declined", label:"Declined / not interested" },
    { value:"Resolved", label:"Resolved" }
  ];

  const FOLLOWUP_REMINDER_OPTIONS = [
    { value:0, label:"No reminder" },
    { value:15, label:"15 minutes before" },
    { value:30, label:"30 minutes before" },
    { value:60, label:"1 hour before" },
    { value:240, label:"4 hours before" },
    { value:1440, label:"1 day before" }
  ];

  const FOLLOWUP_NOTE_TEMPLATES = {
    no_answer:{
      label:"No answer",
      summary:"Retry contact with the merchant",
      context:"The merchant did not answer the most recent contact attempt.",
      nextAction:"Call again and send a short email explaining the reason for the follow-up.",
      outcome:"No answer",
      tags:["no answer","retry"]
    },
    ads_budget:{
      label:"Clarify budget",
      summary:"Clarify the Ads & Promotions budget and recommendation",
      context:"The merchant needs a simpler explanation of budget allocation, options and expected return.",
      nextAction:"Send two clear investment scenarios and confirm which option should be reviewed on the next call.",
      outcome:"Spoke",
      tags:["ads","budget"]
    },
    photos:{
      label:"Photos pending",
      summary:"Complete the missing menu photos",
      context:"Images are still missing and the menu photo coverage is incomplete.",
      nextAction:"Confirm the remaining count, request the files and verify the upload before closing the follow-up.",
      outcome:"Waiting on Merchant",
      tags:["photos","content"]
    },
    data_review:{
      label:"Data review",
      summary:"Validate information and correct discrepancies",
      context:"A difference was found between the merchant information and the data currently recorded.",
      nextAction:"Verify the source, document the correction and share confirmation with the merchant.",
      outcome:"Internal action",
      tags:["data","validation"]
    },
    relationship:{
      label:"Relationship touch",
      summary:"Complete a relationship touch and confirm current priorities",
      context:"Preventive follow-up to review satisfaction, opportunities and possible blockers.",
      nextAction:"Call the merchant, capture current priorities and record one concrete next step.",
      outcome:"Not contacted",
      tags:["relationship","touch"]
    }
  };

  function followupNormalizeStatus(value) {
    const text = normalizeText(value);
    if (["completed","complete","done","resolved"].includes(text)) return "Completed";
    if (["cancelled","canceled"].includes(text)) return "Cancelled";
    if (["in progress","progress"].includes(text)) return "In Progress";
    if (["waiting","waiting on merchant","waiting merchant"].includes(text)) return "Waiting on Merchant";
    return "Pending";
  }

  function followupNormalizePriority(value) {
    const text = normalizeText(value);
    if (["critical","critica","critico"].includes(text)) return "Critical";
    if (["high","alta","alto"].includes(text)) return "High";
    if (["low","baja","bajo"].includes(text)) return "Low";
    return "Medium";
  }

  function normalizeFollowupRecord(source = {}) {
    const record = source && typeof source === "object" ? { ...source } : {};
    const now = new Date().toISOString();
    const createdAt = record.createdAt || record.timestamp || now;
    const context = String(record.context ?? record.notes ?? "").trim();
    const summary = String(record.summary ?? record.objective ?? "").trim() || (context ? context.split(/\n+/)[0].slice(0,180) : String(record.reason || "General Follow-up"));
    const status = followupNormalizeStatus(record.status);
    const tags = Array.isArray(record.tags)
      ? record.tags.map(value=>String(value).trim()).filter(Boolean)
      : String(record.tags || "").split(",").map(value=>value.trim()).filter(Boolean);
    const checklist = Array.isArray(record.checklist)
      ? record.checklist.map(item=>({ id:String(item?.id || uid("followup_check")), text:String(item?.text || "").trim(), done:!!item?.done })).filter(item=>item.text)
      : [];
    const history = Array.isArray(record.history) && record.history.length
      ? record.history.map(item=>({
          id:String(item?.id || uid("followup_history")),
          type:String(item?.type || "note"),
          text:String(item?.text || "").trim(),
          at:item?.at || item?.timestamp || createdAt,
          author:String(item?.author || state?.profile?.username || "Workspace user")
        })).filter(item=>item.text)
      : [{ id:uid("followup_history"), type:"created", text:"Follow-up created", at:createdAt, author:state?.profile?.username || "Workspace user" }];
    return {
      ...record,
      uid:String(record.uid || record.merchantId || ""),
      date:/^\d{4}-\d{2}-\d{2}$/.test(String(record.date || "")) ? String(record.date) : dateKeyInZone(new Date()),
      time:/^\d{2}:\d{2}/.test(String(record.time || "")) ? String(record.time).slice(0,5) : "10:00",
      reason:FOLLOWUP_REASONS.includes(record.reason) ? record.reason : "General Follow-up",
      priority:followupNormalizePriority(record.priority),
      status,
      summary,
      context,
      notes:context,
      nextAction:String(record.nextAction || record.next_step || "").trim(),
      outcome:String(record.outcome || (status === "Completed" ? "Resolved" : "Not contacted")),
      tags,
      checklist,
      history,
      reminderMinutes:Number.isFinite(Number(record.reminderMinutes)) ? Math.max(0,Number(record.reminderMinutes)) : 30,
      contact:String(record.contact || "").trim(),
      createdAt,
      updatedAt:record.updatedAt || createdAt,
      completedAt:status === "Completed" ? (record.completedAt || record.updatedAt || now) : ""
    };
  }

  function followupIsOpen(followup) {
    return !!followup && !["Completed","Cancelled"].includes(followupNormalizeStatus(followup.status));
  }

  function followupDateTime(followup) {
    const date = localDateFromKey(followup?.date || dateKeyInZone(new Date()));
    const [hoursRaw,minutesRaw] = String(followup?.time || "10:00").split(":").map(Number);
    date.setHours(Number.isFinite(hoursRaw)?hoursRaw:10,Number.isFinite(minutesRaw)?minutesRaw:0,0,0);
    return date;
  }

  function followupIsOverdue(followup) {
    return followupIsOpen(followup) && followupDateTime(followup).getTime() < Date.now();
  }

  function followupPriorityRank(priority) {
    return ({ Critical:0, High:1, Medium:2, Low:3 })[followupNormalizePriority(priority)] ?? 2;
  }

  function followupStatusLabel(status) {
    return FOLLOWUP_STATUS_OPTIONS_EXT.find(item=>item.value===followupNormalizeStatus(status))?.label || "Pending";
  }

  function followupOutcomeLabel(outcome) {
    return FOLLOWUP_OUTCOME_OPTIONS.find(item=>normalizeText(item.value)===normalizeText(outcome))?.label || outcome || "Not contacted yet";
  }

  function followupInitials(name) {
    return String(name || "M").split(/\s+/).filter(Boolean).slice(0,2).map(part=>part[0]).join("").toUpperCase();
  }

  function followupHistoryAdd(followup,type,text) {
    if (!followup || !String(text || "").trim()) return;
    followup.history = Array.isArray(followup.history) ? followup.history : [];
    followup.history.unshift({
      id:uid("followup_history"),
      type:type || "note",
      text:String(text).trim(),
      at:new Date().toISOString(),
      author:state.profile.username || "Workspace user"
    });
  }

  function followupFilterItems() {
    const filter = state.ui.followupFilters || {};
    const query = normalizeText(filter.q || "");
    const today = dateKeyInZone(new Date());
    const next7 = toISODate(addDays(localDateFromKey(today),7));
    const filtered = state.followups.map(normalizeFollowupRecord).filter(followup=>{
      const merchant = getMerchant(followup.uid);
      const haystack = normalizeText([
        merchant?.store_name,merchant?.business_name,merchant?.market_name,merchant?.submarket_name,
        merchant?.dm_name,merchant?.dm_email,merchant?.dm_phone,
        followup.summary,followup.context,followup.nextAction,followup.reason,followup.outcome,followup.tags.join(" ")
      ].join(" "));
      if (query && !haystack.includes(query)) return false;
      if (filter.merchant && filter.merchant !== "all" && followup.uid !== filter.merchant) return false;
      if (filter.reason && filter.reason !== "all" && followup.reason !== filter.reason) return false;
      if (filter.priority && filter.priority !== "all" && followup.priority !== filter.priority) return false;
      if (filter.status === "open" && !followupIsOpen(followup)) return false;
      if (filter.status && !["all","open"].includes(filter.status) && followup.status !== filter.status) return false;
      if (filter.quick === "today" && followup.date !== today) return false;
      if (filter.quick === "overdue" && !followupIsOverdue(followup)) return false;
      if (filter.quick === "next7" && (!followupIsOpen(followup) || followup.date < today || followup.date > next7)) return false;
      if (filter.quick === "high" && !["High","Critical"].includes(followup.priority)) return false;
      if (filter.quick === "noNotes" && (followup.context || followup.nextAction)) return false;
      return true;
    });
    return followupSortItems(filtered);
  }

  function followupSortItems(items) {
    const mode = state.ui.followupFilters?.sort || "smart";
    return [...items].sort((a,b)=>{
      if (mode === "merchant") {
        const merchantDelta = String(getMerchant(a.uid)?.store_name || "").localeCompare(String(getMerchant(b.uid)?.store_name || ""));
        return merchantDelta || followupDateTime(a) - followupDateTime(b);
      }
      if (mode === "date") return followupDateTime(a) - followupDateTime(b);
      const closedDelta = Number(!followupIsOpen(a)) - Number(!followupIsOpen(b));
      if (closedDelta) return closedDelta;
      const overdueDelta = Number(followupIsOverdue(b)) - Number(followupIsOverdue(a));
      if (overdueDelta) return overdueDelta;
      const dateDelta = followupDateTime(a) - followupDateTime(b);
      if (dateDelta) return dateDelta;
      return followupPriorityRank(a.priority) - followupPriorityRank(b.priority);
    });
  }

  function followupStats() {
    const now = new Date();
    const today = dateKeyInZone(now);
    const next7 = toISODate(addDays(localDateFromKey(today),7));
    const weekStart = toISODate(startOfWeek(now));
    const weekEnd = toISODate(addDays(startOfWeek(now),6));
    const normalized = state.followups.map(normalizeFollowupRecord);
    const open = normalized.filter(followupIsOpen);
    return {
      overdue:open.filter(followupIsOverdue).length,
      today:open.filter(item=>item.date===today).length,
      next7:open.filter(item=>item.date>=today && item.date<=next7).length,
      completedWeek:normalized.filter(item=>item.status==="Completed" && dateKeyInZone(item.completedAt || item.updatedAt || item.date)>=weekStart && dateKeyInZone(item.completedAt || item.updatedAt || item.date)<=weekEnd).length,
      open:open.length,
      completed:normalized.filter(item=>item.status==="Completed").length
    };
  }

  function formatFollowupRange(anchor,view) {
    if (view === "day") return formatDate(anchor,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
    if (view === "week") {
      const start = startOfWeek(anchor), end = addDays(start,6);
      return `${formatDate(start,{month:"short",day:"numeric"})} – ${formatDate(end,{month:"short",day:"numeric",year:"numeric"})}`;
    }
    if (view === "month") return new Intl.DateTimeFormat("en-US",{month:"long",year:"numeric"}).format(anchor);
    return "All follow-ups";
  }

  function formatTime12(value) {
    const [hoursRaw,minutesRaw] = String(value || "10:00").split(":").map(Number);
    const hours = Number.isFinite(hoursRaw) ? hoursRaw : 10;
    const minutes = Number.isFinite(minutesRaw) ? minutesRaw : 0;
    return `${hours % 12 || 12}:${String(minutes).padStart(2,"0")} ${hours>=12?"PM":"AM"}`;
  }

  function renderLegacyFollowups() {
    const view = ["day","week","month","list"].includes(state.ui.followupView) ? state.ui.followupView : "week";
    state.ui.followupView = view;
    const anchor = new Date(state.ui.followupAnchor || new Date());
    const filtered = followupFilterItems();
    const selected = state.followups.find(item=>String(item.id)===String(state.ui.selectedFollowupId || "")) || null;
    const stats = followupStats();
    return `<div class="fu-nova">
      <section class="fu-nova-surface fu-nova-hero">
        <div class="fu-nova-hero-copy">
          <div class="fu-nova-eyebrow">Follow-up command center</div>
          <h2>Make the next step visible.</h2>
          <p>Plan calls, agreements, notes and reminders in one workspace. Drag cards to reschedule them and use structured notes so every merchant conversation keeps its context.</p>
        </div>
        <div class="fu-nova-hero-actions">
          ${view!=="list"?`<button class="btn square ghost" type="button" data-followup-nav="prev" aria-label="Previous">←</button><button class="btn blue" type="button" data-followup-nav="today">Today</button><button class="btn square ghost" type="button" data-followup-nav="next" aria-label="Next">→</button>`:""}
          <div class="fu-nova-range"><span>${view==="list"?"Work queue":"Visible period"}</span><strong>${esc(formatFollowupRange(anchor,view))}</strong></div>
          <button class="btn primary" type="button" data-action="newFollowup">＋ New follow-up</button>
        </div>
      </section>
      ${renderFollowupMetrics(stats)}
      ${renderFollowupToolbar(filtered.length)}
      <section class="fu-nova-main">
        <div class="fu-nova-surface fu-nova-calendar">${renderFollowupCalendarPanel(anchor,view,filtered)}</div>
        <aside class="fu-nova-surface fu-nova-focus">${renderFollowupFocusPanel(selected)}</aside>
      </section>
    </div>`;
  }

  function renderFollowupMetrics(stats) {
    const metrics = [
      { id:"overdue",tone:"red",label:"Overdue",value:stats.overdue,note:stats.overdue?"Require a decision today":"Everything is current" },
      { id:"today",tone:"orange",label:"Due today",value:stats.today,note:"Actions scheduled for today" },
      { id:"next7",tone:"",label:"Next 7 days",value:stats.next7,note:"Near-term workload" },
      { id:"completed",tone:"green",label:"Completed this week",value:stats.completedWeek,note:"Follow-ups closed" }
    ];
    return `<section class="fu-nova-metrics">${metrics.map(metric=>`<button class="fu-nova-metric ${metric.tone}" type="button" data-fu-metric="${metric.id}"><span class="fu-nova-metric-head"><span>${metric.label}</span><span>↗</span></span><strong>${metric.value}</strong><small>${metric.note}</small></button>`).join("")}</section>`;
  }

  function renderFollowupToolbar(filteredCount) {
    const filter = state.ui.followupFilters || {};
    const merchants = state.merchants.filter(item=>!item.archived).sort((a,b)=>String(a.store_name).localeCompare(String(b.store_name)));
    const view = state.ui.followupView;
    return `<section class="fu-nova-surface fu-nova-toolbar">
      <div class="fu-nova-toolbar-top">
        <div class="fu-nova-segmented" aria-label="Follow-up view">
          ${[["day","Day"],["week","Week"],["month","Month"],["list","List"]].map(([id,label])=>`<button class="${view===id?"active":""}" type="button" data-followup-view="${id}">${label}</button>`).join("")}
        </div>
        <div class="fu-nova-result-count"><strong>${filteredCount}</strong> visible results · <button class="btn small ghost" type="button" data-fu-clear-filters>Clear filters</button> <button class="btn small ghost" type="button" data-fu-export-csv>Export CSV</button></div>
      </div>
      <div class="fu-nova-filter-grid">
        <div class="field"><label>Search notes</label><input id="followupSearch" value="${attr(filter.q || "")}" placeholder="Merchant, objective, next step or tag…" /></div>
        <div class="field"><label>Merchant</label><select id="followupFilterMerchant"><option value="all">All merchants</option>${merchants.map(item=>`<option value="${attr(item.uid)}" ${filter.merchant===item.uid?"selected":""}>${esc(item.store_name)}</option>`).join("")}</select></div>
        <div class="field"><label>Type</label><select id="followupFilterReason"><option value="all">All types</option>${FOLLOWUP_REASONS.map(reason=>`<option value="${attr(reason)}" ${filter.reason===reason?"selected":""}>${esc(reason)}</option>`).join("")}</select></div>
        <div class="field"><label>Priority</label><select id="followupFilterPriority"><option value="all">All priorities</option>${["Low","Medium","High","Critical"].map(priority=>`<option ${filter.priority===priority?"selected":""}>${priority}</option>`).join("")}</select></div>
        <div class="field"><label>Status</label><select id="followupFilterStatus"><option value="open" ${filter.status==="open"?"selected":""}>Open</option><option value="all" ${filter.status==="all"?"selected":""}>All</option>${FOLLOWUP_STATUS_OPTIONS_EXT.map(item=>`<option value="${attr(item.value)}" ${filter.status===item.value?"selected":""}>${esc(item.label)}</option>`).join("")}</select></div>
        <div class="field"><label>Sort</label><select id="followupFilterSort"><option value="smart" ${filter.sort==="smart"?"selected":""}>Smart priority</option><option value="date" ${filter.sort==="date"?"selected":""}>Date and time</option><option value="merchant" ${filter.sort==="merchant"?"selected":""}>Merchant</option></select></div>
      </div>
      <div class="fu-nova-quick-row">${[["all","All"],["today","Today"],["overdue","Overdue"],["next7","Next 7 days"],["high","High priority"],["noNotes","Missing notes"]].map(([id,label])=>`<button class="fu-nova-quick ${filter.quick===id?"active":""}" type="button" data-fu-quick="${id}">${label}</button>`).join("")}</div>
    </section>`;
  }

  function renderFollowupCalendarPanel(anchor,view,items) {
    const names = { day:"Daily agenda",week:"Weekly plan",month:"Monthly calendar",list:"Follow-up work queue" };
    const hints = { day:"Drag a card to another hour to reschedule it.",week:"Review the full workload and each merchant's next step.",month:"See the entire month and jump into any day.",list:"Work through follow-ups grouped by urgency and state." };
    const content = view==="day"?renderFollowupDay(anchor,items):view==="week"?renderFollowupWeek(anchor,items):view==="month"?renderFollowupMonth(anchor,items):renderFollowupList(items);
    return `<div class="fu-nova-panel-head"><div><span>${view==="list"?"Work queue":"Interactive calendar"}</span><h3>${names[view]}</h3><p>${hints[view]}</p></div><div class="fu-nova-calendar-actions"><button class="btn small primary" type="button" data-new-followup-date="${attr(toISODate(anchor))}">＋ Add</button><button class="btn small red" type="button" data-delete-all-followups ${state.followups.length?"":"disabled"} title="Delete every follow-up, including completed and filtered records">Borrar todos los follow-ups</button></div></div><div class="fu-nova-calendar-body">${content}</div>`;
  }

  function renderFollowupEventCard(followup,context="week") {
    const record = normalizeFollowupRecord(followup);
    const merchant = getMerchant(record.uid);
    const selected = String(state.ui.selectedFollowupId || "") === String(record.id);
    const classes = ["fu-nova-event",`priority-${record.priority.toLowerCase()}`,selected?"selected":"",followupIsOverdue(record)?"overdue":"",record.status==="Completed"?"completed":"",record.status==="Cancelled"?"cancelled":""].filter(Boolean).join(" ");
    const status = followupIsOverdue(record)?"Overdue":followupStatusLabel(record.status);
    if (context === "day") {
      return `<div class="${classes}" draggable="true" data-followup-drag="${attr(record.id)}"><button type="button" data-select-followup="${attr(record.id)}"><span class="fu-nova-event-time">${esc(formatTime12(record.time))}</span><span><h4>${esc(merchant?.store_name || "Unassigned merchant")}</h4><p>${esc(record.summary || record.reason)}</p></span><span class="fu-nova-badge ${followupIsOverdue(record)?"red":record.status==="Completed"?"green":"blue"}">${esc(status)}</span></button></div>`;
    }
    return `<div class="${classes}" draggable="true" data-followup-drag="${attr(record.id)}"><button type="button" data-select-followup="${attr(record.id)}"><span class="fu-nova-event-top"><span class="fu-nova-event-time">${esc(formatTime12(record.time))}</span><i class="fu-nova-event-dot" title="${esc(record.priority)} priority"></i></span><h4>${esc(merchant?.store_name || "Unassigned merchant")}</h4><p>${esc(record.summary || record.reason)}</p><span class="fu-nova-event-foot"><span>${esc(record.reason)}</span>${context==="month"?"":`<span>${esc(status)}</span>`}</span></button></div>`;
  }

  function renderFollowupDay(anchor,items) {
    const key = toISODate(anchor);
    const dayItems = followupSortItems(items.filter(item=>item.date===key));
    const hours = Array.from({length:15},(_,index)=>index+7);
    const assigned = new Set();
    const rows = hours.map(hour=>{
      const hourItems = dayItems.filter(item=>Number(String(item.time || "10:00").split(":")[0])===hour);
      hourItems.forEach(item=>assigned.add(item.id));
      const time = `${String(hour).padStart(2,"0")}:00`;
      return `<div class="fu-nova-time-row"><div class="fu-nova-time-label">${formatTime12(time)}</div><div class="fu-nova-time-slot" data-drop-date="${key}" data-drop-time="${time}"><button class="fu-nova-slot-add" type="button" data-new-followup-date="${key}" data-new-followup-time="${time}" title="Add at ${formatTime12(time)}">＋</button><div class="fu-nova-time-events">${hourItems.length?hourItems.map(item=>renderFollowupEventCard(item,"day")).join(""):`<span class="fu-nova-slot-empty">Available</span>`}</div></div></div>`;
    }).join("");
    const other = dayItems.filter(item=>!assigned.has(item.id));
    const open = dayItems.filter(followupIsOpen).length;
    const high = dayItems.filter(item=>followupIsOpen(item)&&["High","Critical"].includes(item.priority)).length;
    const completed = dayItems.filter(item=>item.status==="Completed").length;
    if (!dayItems.length) return renderFollowupEmpty("No follow-ups on this day","Create one from any time slot or move a card here.",key);
    return `<div class="fu-nova-day"><div class="fu-nova-day-summary"><div class="fu-nova-day-stat"><span>Open</span><strong>${open}</strong></div><div class="fu-nova-day-stat"><span>High priority</span><strong>${high}</strong></div><div class="fu-nova-day-stat"><span>Completed</span><strong>${completed}</strong></div></div>${rows}${other.length?`<div class="fu-nova-time-row"><div class="fu-nova-time-label">Other</div><div class="fu-nova-time-slot" data-drop-date="${key}"><div class="fu-nova-time-events">${other.map(item=>renderFollowupEventCard(item,"day")).join("")}</div></div></div>`:""}</div>`;
  }

  function renderFollowupWeek(anchor,items) {
    const start = startOfWeek(anchor);
    const days = Array.from({length:7},(_,index)=>addDays(start,index));
    return `<div class="fu-nova-week">${days.map(date=>{
      const key = toISODate(date);
      const dayItems = followupSortItems(items.filter(item=>item.date===key));
      const completed = dayItems.filter(item=>item.status==="Completed").length;
      const pct = dayItems.length?Math.round(completed/dayItems.length*100):0;
      return `<section class="fu-nova-week-day ${key===dateKeyInZone(new Date())?"today":""}" data-drop-date="${key}"><div class="fu-nova-week-head"><button type="button" data-fu-go-day="${key}"><span>${formatDate(date,{weekday:"short"})}</span><strong>${formatDate(date,{month:"short",day:"numeric"})}</strong></button><button class="fu-nova-week-add" type="button" data-new-followup-date="${key}">＋</button></div><div class="fu-nova-week-progress"><i style="width:${pct}%"></i></div><div class="fu-nova-week-list">${dayItems.length?dayItems.map(item=>renderFollowupEventCard(item,"week")).join(""):`<div class="fu-nova-week-empty"><strong>Open day</strong><span>No follow-ups</span></div>`}</div></section>`;
    }).join("")}</div>`;
  }

  function renderFollowupMonth(anchor,items) {
    const first = new Date(anchor.getFullYear(),anchor.getMonth(),1,12);
    let start = new Date(first);
    while (start.getDay()!==1) start=addDays(start,-1);
    const dates = Array.from({length:42},(_,index)=>addDays(start,index));
    const weekdays = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    return `<div class="fu-nova-month">${weekdays.map(day=>`<div class="fu-nova-month-weekday">${day}</div>`).join("")}${dates.map(date=>{
      const key = toISODate(date);
      const dayItems = followupSortItems(items.filter(item=>item.date===key));
      return `<div class="fu-nova-month-cell ${date.getMonth()!==anchor.getMonth()?"other":""} ${key===dateKeyInZone(new Date())?"today":""}" data-drop-date="${key}"><div class="fu-nova-month-head"><button class="fu-nova-month-date" type="button" data-fu-go-day="${key}">${date.getDate()}</button><button class="fu-nova-month-add" type="button" data-new-followup-date="${key}">＋</button></div><div class="fu-nova-month-events">${dayItems.slice(0,4).map(item=>renderFollowupEventCard(item,"month")).join("")}${dayItems.length>4?`<button class="fu-nova-more" type="button" data-fu-go-day="${key}">＋${dayItems.length-4} more</button>`:""}</div></div>`;
    }).join("")}</div>`;
  }

  function followupListGroup(item) {
    const today = dateKeyInZone(new Date());
    if (followupIsOverdue(item)) return "Overdue";
    if (item.date===today && followupIsOpen(item)) return "Today";
    if (item.status==="Completed") return "Completed";
    if (item.status==="Cancelled") return "Cancelled";
    return "Upcoming";
  }

  function renderFollowupList(items) {
    if (!items.length) return renderFollowupEmpty("No follow-ups match these filters","Clear filters or create a new follow-up.",dateKeyInZone(new Date()));
    const order = ["Overdue","Today","Upcoming","Completed","Cancelled"];
    const groups = new Map(order.map(key=>[key,[]]));
    items.forEach(item=>groups.get(followupListGroup(item))?.push(item));
    return `<div class="fu-nova-list">${order.filter(key=>groups.get(key).length).map(key=>`<section class="fu-nova-list-group"><div class="fu-nova-list-head"><strong>${key}</strong><span>${groups.get(key).length} follow-up${groups.get(key).length===1?"":"s"}</span></div><div class="fu-nova-list-rows">${groups.get(key).map(renderFollowupListRow).join("")}</div></section>`).join("")}</div>`;
  }

  function renderFollowupListRow(item) {
    const record = normalizeFollowupRecord(item);
    const merchant = getMerchant(record.uid);
    const selected = String(state.ui.selectedFollowupId || "")===String(record.id);
    return `<div class="fu-nova-list-row ${selected?"selected":""}" data-select-followup="${attr(record.id)}"><div class="fu-nova-list-date"><strong>${esc(formatDate(localDateFromKey(record.date),{month:"short",day:"numeric"}))}</strong><span>${esc(formatTime12(record.time))}</span></div><div class="fu-nova-list-merchant"><strong>${esc(merchant?.store_name || "Unassigned")}</strong><span>${esc(merchant?.market_name || merchant?.submarket_name || "")}</span></div><div class="fu-nova-list-objective"><strong>${esc(record.summary || record.reason)}</strong><span>${esc(record.nextAction || record.context || "No next step recorded")}</span></div><div class="fu-nova-list-type"><span class="fu-nova-badge blue">${esc(record.reason)}</span></div><div class="fu-nova-list-status"><span class="fu-nova-badge ${followupIsOverdue(record)?"red":record.status==="Completed"?"green":"blue"}">${esc(followupIsOverdue(record)?"Overdue":followupStatusLabel(record.status))}</span></div><div class="fu-nova-list-actions"><button class="btn small ghost" type="button" data-edit-followup="${attr(record.id)}">Edit</button>${followupIsOpen(record)?`<button class="btn small green" type="button" data-complete-followup="${attr(record.id)}">Done</button>`:""}</div></div>`;
  }

  function renderFollowupEmpty(title,text,date) {
    return `<div class="fu-nova-empty"><div class="fu-nova-empty-icon">◫</div><strong>${esc(title)}</strong><p>${esc(text)}</p><button class="btn primary" type="button" data-new-followup-date="${attr(date || dateKeyInZone(new Date()))}">Create follow-up</button></div>`;
  }

      <section class="fu-nova-focus-section"><div class="fu-nova-focus-section-head"><strong>Structured notes</strong><span>Updated ${esc(followup.updatedAt?new Intl.DateTimeFormat("en-CA",{dateStyle:"medium"}).format(new Date(followup.updatedAt)):"—")}</span></div><div class="fu-nova-note"><label>Objective</label><strong>${esc(followup.summary || "No objective recorded")}</strong></div><div class="fu-nova-note"><label>Context</label><p>${esc(followup.context || "No context recorded")}</p></div><div class="fu-nova-note next"><label>Next action</label><p>${esc(followup.nextAction || "No next action recorded")}</p></div><div class="fu-nova-note"><label>Last outcome</label><strong>${esc(followupOutcomeLabel(followup.outcome))}</strong></div>${followup.tags.length?`<div class="fu-nova-tags" style="margin-top:8px">${followup.tags.map(tag=>`<span class="fu-nova-tag">#${esc(tag)}</span>`).join("")}</div>`:""}</section>
      <section class="fu-nova-focus-section"><div class="fu-nova-focus-section-head"><strong>Internal checklist</strong><span>${checked}/${followup.checklist.length} completed</span></div>${followup.checklist.length?`<div class="fu-nova-checklist">${followup.checklist.map(item=>`<label class="fu-nova-check ${item.done?"done":""}"><input type="checkbox" ${item.done?"checked":""} data-fu-check-toggle="${attr(followup.id)}" data-check-id="${attr(item.id)}"/><span>${esc(item.text)}</span></label>`).join("")}</div>`:`<div class="fu-nova-note"><p>No checklist items yet.</p></div>`}</section>
      <section class="fu-nova-focus-section"><div class="fu-nova-focus-section-head"><strong>Quick note</strong><span>Add to history</span></div><div class="fu-nova-quick-note"><textarea id="fuQuickNote" placeholder="What happened during the latest contact?"></textarea><div class="fu-nova-quick-note-actions"><select id="fuQuickNoteType"><option value="note">Internal note</option><option value="call">Call result</option><option value="email">Email sent</option><option value="merchant">Merchant update</option></select><button class="btn small primary" type="button" data-fu-add-note="${attr(followup.id)}">Add note</button></div></div></section>
      <section class="fu-nova-focus-section"><div class="fu-nova-focus-section-head"><strong>History</strong><span>${followup.history.length} entries</span></div><div class="fu-nova-timeline">${timeline.length?timeline.map(renderFollowupTimelineItem).join(""):`<div class="fu-nova-note"><p>No history entries.</p></div>`}</div></section>
      <div class="fu-nova-focus-actions"><button class="btn primary" type="button" data-edit-followup="${attr(followup.id)}">Edit details</button>${followupIsOpen(followup)?`<button class="btn green" type="button" data-complete-followup="${attr(followup.id)}">Complete</button>`:`<button class="btn blue" type="button" data-fu-reopen="${attr(followup.id)}">Reopen</button>`}<button class="btn ghost" type="button" data-fu-snooze="${attr(followup.id)}" data-days="1">Move to tomorrow</button><button class="btn ghost" type="button" data-fu-snooze="${attr(followup.id)}" data-days="7">Move one week</button><button class="btn ghost" type="button" data-fu-duplicate="${attr(followup.id)}">Duplicate</button><button class="btn purple" type="button" data-action="goToFollowupMerchantProfile" data-followup-id="${attr(followup.id)}">Open merchant</button><button class="btn red" type="button" data-delete-followup="${attr(followup.id)}">Delete</button></div>
    </div>`;
  }

  function renderFollowupTimelineItem(item) {
    const iconMap = { created:"＋",updated:"✎",completed:"✓",reopened:"↺",moved:"→",call:"☎",email:"✉",merchant:"◎",note:"•",duplicated:"⧉" };
    return `<div class="fu-nova-timeline-item"><div class="fu-nova-timeline-mark">${iconMap[item.type] || "•"}</div><div class="fu-nova-timeline-copy"><strong>${esc(item.author || "Workspace user")}</strong><p>${esc(item.text || "")}</p><time>${esc(item.at?new Intl.DateTimeFormat("en-CA",{dateStyle:"medium",timeStyle:"short"}).format(new Date(item.at)):"—")}</time></div></div>`;
  }

    const existing = id ? state.followups.find(item=>String(item.id)===String(id)) : null;
    const currentMerchant = selectedMerchant();
    const anchorDate = toISODate(new Date(state.ui.followupAnchor || new Date()));
    const draft = normalizeFollowupRecord(existing || {
      id:"",
      uid:preset.uid || currentMerchant?.uid || state.selectedUid || "",
      date:preset.date || state.ui.followupDraftDate || anchorDate,
      time:preset.time || state.ui.followupDraftTime || "10:00",
      reason:preset.reason || "Relationship Touch",
      priority:preset.priority || "Medium",
      status:"Pending",
      summary:"",
      context:"",
      nextAction:"",
      outcome:"Not contacted",
      tags:[],
      checklist:[],
      history:[],
      reminderMinutes:30,
      contact:""
    });
    followupEditorChecklistDraft = draft.checklist.map(item=>({...item}));
    const merchants = state.merchants.filter(item=>!item.archived).sort((a,b)=>String(a.store_name).localeCompare(String(b.store_name)));

        <div class="field c6"><label>Merchant</label><select id="followupMerchant"><option value="">Select a merchant</option>${merchants.map(item=>`<option value="${attr(item.uid)}" ${draft.uid===item.uid?"selected":""}>${esc(item.store_name)}</option>`).join("")}</select></div>
        <div class="field c3"><label>Date</label><input id="followupDate" type="date" value="${attr(draft.date)}" /></div>
        <div class="field c3"><label>Time</label><input id="followupTime" type="time" value="${attr(draft.time)}" /></div>
        <div class="field c4"><label>Type</label><select id="followupReason">${FOLLOWUP_REASONS.map(reason=>`<option ${draft.reason===reason?"selected":""}>${esc(reason)}</option>`).join("")}</select></div>
        <div class="field c4"><label>Status</label><select id="followupStatus">${FOLLOWUP_STATUS_OPTIONS_EXT.map(item=>`<option value="${attr(item.value)}" ${draft.status===item.value?"selected":""}>${esc(item.label)}</option>`).join("")}</select></div>
        <div class="field c4"><label>Reminder</label><select id="followupReminder">${FOLLOWUP_REMINDER_OPTIONS.map(item=>`<option value="${item.value}" ${Number(draft.reminderMinutes)===Number(item.value)?"selected":""}>${esc(item.label)}</option>`).join("")}</select></div>
        <div class="field c12"><label>Contact / owner note</label><input id="followupContact" value="${attr(draft.contact || "")}" placeholder="Primary contact, owner or internal handoff" /></div>
      </div><div style="margin-top:12px"><label style="display:block;margin-bottom:7px;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em">Priority</label><div class="fu-editor-priority">${["Low","Medium","High","Critical"].map(priority=>`<div class="${priority.toLowerCase()}"><input id="fuPriority${priority}" name="followupPriority" type="radio" value="${priority}" ${draft.priority===priority?"checked":""}/><label for="fuPriority${priority}"><i></i><strong>${priority}</strong></label></div>`).join("")}</div></div></section>
      <section class="fu-editor-section"><div class="fu-editor-section-head"><div><span>Structured notes</span><h3>Keep the conversation actionable</h3><p>Use a template or write the objective, context and next action directly.</p></div></div><div class="fu-editor-templates">${Object.entries(FOLLOWUP_NOTE_TEMPLATES).map(([key,item])=>`<button class="fu-editor-template" type="button" data-fu-template="${key}">${esc(item.label)}</button>`).join("")}</div><div class="form-grid">
        <div class="field c12"><label>Objective</label><input id="followupSummary" value="${attr(draft.summary || "")}" placeholder="What outcome should this follow-up produce?" /></div>
        <div class="field c12"><label>Context</label><textarea id="followupContext" placeholder="What happened, what matters, and what should not be forgotten?">${esc(draft.context || "")}</textarea></div>
        <div class="field c12"><label>Next action</label><textarea id="followupNextAction" placeholder="Write the concrete next step, owner and expected result.">${esc(draft.nextAction || "")}</textarea></div>
        <div class="field c6"><label>Latest outcome</label><select id="followupOutcome">${FOLLOWUP_OUTCOME_OPTIONS.map(item=>`<option value="${attr(item.value)}" ${normalizeText(draft.outcome)===normalizeText(item.value)?"selected":""}>${esc(item.label)}</option>`).join("")}</select></div>
        <div class="field c6"><label>Tags</label><input id="followupTags" value="${attr(draft.tags.join(", "))}" placeholder="ads, budget, photos, renewal" /></div>
      </div></section>
      <section class="fu-editor-section"><div class="fu-editor-section-head"><div><span>Internal checklist</span><h3>Break the next step into tasks</h3><p>Checklist items stay attached to this merchant follow-up.</p></div><button class="btn small ghost" type="button" data-fu-add-check-item>＋ Add item</button></div><div class="fu-editor-checklist" id="followupChecklistEditor">${renderFollowupChecklistEditorRows()}</div></section>
      <div class="fu-editor-footer"><div>${existing?`<button class="btn red" type="button" data-delete-followup="${attr(existing.id)}">Delete</button>`:""}</div><div><button class="btn ghost" type="button" data-action="closeFollowupModal">Cancel</button><button class="btn blue" type="button" data-action="saveFollowupAndAnother">Save & create another</button><button class="btn primary" type="button" data-action="saveFollowup">${existing?"Save changes":"Create follow-up"}</button></div></div>`);
    document.getElementById("modal")?.classList.add("followup-editor-modal");

  function renderFollowupChecklistEditorRows() {
    if (!followupEditorChecklistDraft.length) return `<div class="fu-nova-note"><p>No checklist items. Add one when the follow-up requires multiple internal steps.</p></div>`;
    return followupEditorChecklistDraft.map(item=>`<div class="fu-editor-check-row" data-fu-editor-check-row="${attr(item.id)}"><input type="checkbox" ${item.done?"checked":""}/><input type="text" value="${attr(item.text)}" placeholder="Checklist item"/><button class="fu-editor-remove-check" type="button" data-fu-remove-check-item="${attr(item.id)}" aria-label="Remove">×</button></div>`).join("");
  }

  function syncFollowupChecklistEditor() {
    document.querySelectorAll("[data-fu-editor-check-row]").forEach(row=>{
      const id = row.dataset.fuEditorCheckRow;
      const item = followupEditorChecklistDraft.find(entry=>entry.id===id);
      if (!item) return;
      item.done = !!row.querySelector('input[type="checkbox"]')?.checked;
      item.text = String(row.querySelector('input[type="text"]')?.value || "").trim();
    });
    followupEditorChecklistDraft = followupEditorChecklistDraft.filter(item=>item.text || document.querySelector(`[data-fu-editor-check-row="${CSS.escape(item.id)}"]`));
  }

  function refreshFollowupChecklistEditor() {
    const host = document.getElementById("followupChecklistEditor");
    if (host) host.innerHTML = renderFollowupChecklistEditorRows();
  }

  function applyFollowupNoteTemplate(templateId) {
    const template = FOLLOWUP_NOTE_TEMPLATES[templateId];
    if (!template) return;
    const summary = document.getElementById("followupSummary");
    const context = document.getElementById("followupContext");
    const nextAction = document.getElementById("followupNextAction");
    const outcome = document.getElementById("followupOutcome");
    const tags = document.getElementById("followupTags");
    if (summary) summary.value = template.summary;
    if (context) context.value = template.context;
    if (nextAction) nextAction.value = template.nextAction;
    if (outcome) outcome.value = template.outcome;
    if (tags) {
      const current = tags.value.split(",").map(value=>value.trim()).filter(Boolean);
      tags.value = [...new Set([...current,...template.tags])].join(", ");
    }
    toast(`${template.label} template applied`);
  }

  function renderActivity() {
    const anchor = new Date(state.ui.activityAnchor || new Date());
    const selectedKey = state.ui.selectedActivityDate || dateKeyInZone(new Date());
    const selectedDate = localDateFromKey(selectedKey);
    const day = dayStats(selectedKey);
    const week = rangeStats(startOfWeek(selectedDate),7);
    const weekAgg = aggregateStats(week);
    const monthStart = new Date(anchor.getFullYear(),anchor.getMonth(),1,12);
    const monthEnd = new Date(anchor.getFullYear(),anchor.getMonth()+1,0,12);
    const monthItems = [];
    for (let d = new Date(monthStart); d <= monthEnd; d = addDays(d,1)) monthItems.push(dayStats(toISODate(d)));
    const monthAgg = aggregateStats(monthItems);
    const minuteGoal = Math.max(1, Number(state.settings.callGoal || 70));
    const photoGoal = Math.max(1, Number(state.settings.photoGoal || DEFAULT_PHOTO_GOAL));
    const callAttemptGoal = Math.max(1, Number(state.settings.callAttemptGoal || DEFAULT_CALL_ATTEMPT_GOAL));
    const dayRecords = activityTimelineForDate(selectedKey);
    const dayRecordPageSize = 7;
    const dayRecordTotalPages = Math.max(1, Math.ceil(dayRecords.length / dayRecordPageSize));
    const dayRecordPage = clamp(Math.floor(Number(state.ui.activityRecordPage || 1)), 1, dayRecordTotalPages);
    state.ui.activityRecordPage = dayRecordPage;
    const dayRecordStart = (dayRecordPage - 1) * dayRecordPageSize;
    const visibleDayRecords = dayRecords.slice(dayRecordStart, dayRecordStart + dayRecordPageSize);

    return `<section class="panel">
      <div class="card-head"><div><div class="card-kicker">Activity calendar</div><h2>${new Intl.DateTimeFormat("en-US",{month:"long",year:"numeric"}).format(anchor)}</h2></div><div class="button-row"><button class="btn ghost" type="button" data-activity-nav="prev">Previous</button><button class="btn blue" type="button" data-activity-nav="today">Focus today</button><button class="btn ghost" type="button" data-activity-nav="next">Next</button><button class="btn purple" type="button" data-action="downloadMonthlyActivity">Download month CSV</button></div></div>
      <div class="activity-goal-legend" aria-label="Daily activity goals">
        <span class="activity-goal-item"><i class="activity-goal-dot minutes"></i><span><strong>Call minutes</strong><small>${minuteGoal} credited minutes per day</small></span></span>
        <span class="activity-goal-item"><i class="activity-goal-dot photos"></i><span><strong>Photo goal</strong><small>${photoGoal} photos per day</small></span></span>
        <span class="activity-goal-item"><i class="activity-goal-dot calls"></i><span><strong>Call goal</strong><small>${callAttemptGoal} attempts per day</small></span></span>
      </div>
      <div class="calendar-scroll">${renderActivityCalendar(anchor,selectedKey)}</div>
    </section>
    <div class="bento-grid">
      <section class="bento-card span-6">
        <div class="card-head"><div><div class="card-kicker">Selected day</div><h3>${formatDate(selectedDate,{weekday:"long"})}</h3></div><div class="button-row"><button class="btn small blue" type="button" data-action="downloadDayTxt">TXT</button><button class="btn small purple" type="button" data-action="downloadDayCsv">CSV</button></div></div>
        <div class="bento-grid">
          ${miniMetric("Credited",mmss(day.creditedSec),"span-3")}${miniMetric("Real",mmss(day.realSec),"span-3")}${miniMetric("Calls",day.attempts,"span-3")}${miniMetric("Photos",day.photosAdded,"span-3")}
          ${miniMetric("Stores touched",day.touched,"span-4")}${miniMetric("Follow-ups created",day.createdFollowups.length,"span-4")}${miniMetric("GMV touched",money(day.gmvTouched),"span-4")}
        </div>
        <div class="divider"></div>
        <section class="activity-day-records" aria-label="Selected-day activity record">
          <div class="activity-records-heading"><div><span>Daily record</span><strong>${dayRecords.length} entr${dayRecords.length === 1 ? "y" : "ies"}</strong></div><span class="quiet-chip">7 per page</span></div>
          <div class="timeline activity-records-list">${dayRecords.length ? visibleDayRecords.map(t=>`<div class="timeline-item"><div class="timeline-icon">${t.icon}</div><div><strong>${esc(t.title)}</strong><span>${esc(t.detail)}</span></div></div>`).join("") : `<div class="empty-state"><strong>No activity</strong><span>No calls, photos, sales, credits or follow-ups were recorded for this day.</span></div>`}</div>
          ${renderActivityRecordPagination(dayRecordPage, dayRecordTotalPages, dayRecords.length, dayRecordStart)}
        </section>
      </section>
      <section class="bento-card span-6">
        <div class="card-head"><div><div class="card-kicker">Weekly report</div><h3>${formatDate(startOfWeek(selectedDate),{month:"short",day:"numeric",year:undefined})} – ${formatDate(addDays(startOfWeek(selectedDate),6),{month:"short",day:"numeric",year:"numeric"})}</h3></div><button class="btn small green" type="button" data-action="downloadWeekCsv">Download CSV</button></div>
        <div class="bento-grid">${miniMetric("Credited",minutesLabel(weekAgg.creditedSec),"span-4")}${miniMetric("Attempts",weekAgg.calls,"span-4")}${miniMetric("Photos",weekAgg.photos,"span-4")}${miniMetric("Follow-ups",weekAgg.followups,"span-4")}${miniMetric("Completed",weekAgg.completedFollowups,"span-4")}${miniMetric("GMV touched",money(weekAgg.gmv),"span-4")}</div>
        <div class="divider"></div>
        <div class="table-wrap" style="max-height:300px"><table><thead><tr><th>Date</th><th>Credited</th><th>Real</th><th>Calls</th><th>Photos</th><th>Stores</th></tr></thead><tbody>${week.map(x=>`<tr><td>${esc(x.dateKey)}</td><td>${mmss(x.creditedSec)}</td><td>${mmss(x.realSec)}</td><td>${x.attempts}</td><td>${x.photosAdded}</td><td>${x.touched}</td></tr>`).join("")}</tbody></table></div>
      </section>
      <section class="bento-card span-12">

  function miniMetric(label,value,span="span-3") {

  function renderActivityRecordPagination(currentPage, totalPages, totalItems, startIndex) {
    if (!totalItems) return "";
    const tokens = workHubPageTokens(currentPage, totalPages);
    const disabledPrev = currentPage <= 1 ? "disabled" : "";
    const disabledNext = currentPage >= totalPages ? "disabled" : "";
    const firstVisible = startIndex + 1;
    const lastVisible = Math.min(totalItems, startIndex + 7);
    return `<footer class="queue-pagination activity-record-pagination" aria-label="Daily record pagination">
      <span class="queue-page-meta">Showing ${firstVisible}–${lastVisible} of ${totalItems} · Page ${currentPage} of ${totalPages}</span>
      <div class="queue-page-controls">
        <button class="queue-page-btn" type="button" data-activity-record-page="1" ${disabledPrev} aria-label="First record page" title="First page">«</button>
        <button class="queue-page-btn" type="button" data-activity-record-page="${Math.max(1, currentPage - 1)}" ${disabledPrev} aria-label="Previous record page" title="Previous page">‹</button>
        ${tokens.map(token => token === "ellipsis"
          ? `<span class="queue-page-ellipsis" aria-hidden="true">…</span>`
          : `<button class="queue-page-btn ${token === currentPage ? "active" : ""}" type="button" data-activity-record-page="${token}" ${token === currentPage ? 'aria-current="page"' : ""}>${token}</button>`).join("")}
        <button class="queue-page-btn" type="button" data-activity-record-page="${Math.min(totalPages, currentPage + 1)}" ${disabledNext} aria-label="Next record page" title="Next page">›</button>
        <button class="queue-page-btn" type="button" data-activity-record-page="${totalPages}" ${disabledNext} aria-label="Last record page" title="Last page">»</button>
      </div>
    </footer>`;
  }

  function renderActivityCalendar(anchor,selectedKey) {
    const first = new Date(anchor.getFullYear(),anchor.getMonth(),1,12);
    const last = new Date(anchor.getFullYear(),anchor.getMonth()+1,0,12);
    let start = new Date(first); while (start.getDay()!==1) start=addDays(start,-1);
    let end = new Date(last); while (end.getDay()!==5) end=addDays(end,1);
    const dates=[]; for(let d=new Date(start);d<=end;d=addDays(d,1)) if(WORK_DAYS.includes(d.getDay())) dates.push(new Date(d));
    const minuteGoal = Math.max(1, Number(state.settings.callGoal || 70));
    const photoGoal = Math.max(1, Number(state.settings.photoGoal || DEFAULT_PHOTO_GOAL));
    const callAttemptGoal = Math.max(1, Number(state.settings.callAttemptGoal || DEFAULT_CALL_ATTEMPT_GOAL));
    return `<div class="activity-calendar">${["Mon","Tue","Wed","Thu","Fri"].map(x=>`<div class="calendar-day-name">${x}</div>`).join("")}${dates.map(date=>{
      const key=toISODate(date), s=dayStats(key), other=date.getMonth()!==anchor.getMonth();
      const callMinutes = Math.round(s.creditedSec / 60);
      const minutePct = clamp(callMinutes / minuteGoal * 100, 0, 100);
      const photoPct = clamp(s.photosAdded / photoGoal * 100, 0, 100);
      const callPct = clamp(s.attempts / callAttemptGoal * 100, 0, 100);
      return `<button class="activity-cell ${key===selectedKey?"selected":""}" style="opacity:${other ? .45 : 1}" type="button" data-activity-date="${key}" title="${callMinutes}/${minuteGoal} call minutes · ${s.photosAdded}/${photoGoal} photos · ${s.attempts}/${callAttemptGoal} calls"><strong>${date.getDate()}</strong><div class="activity-bars"><div class="tiny-bar minutes" aria-label="Call minutes"><span style="width:${minutePct}%"></span></div><div class="tiny-bar photos" aria-label="Photo goal"><span style="width:${photoPct}%"></span></div><div class="tiny-bar calls" aria-label="Call goal"><span style="width:${callPct}%"></span></div></div><small>${callMinutes} min · ${s.photosAdded} photos · ${s.attempts} calls</small></button>`;
    }).join("")}</div>`;
  }

  function activityTimelineForDate(key) {
    const items=[];
    state.calls.filter(c=>dateKeyInZone(c.completedAt)===key).forEach(c=>items.push({icon:"☎",title:`${getMerchant(c.uid)?.store_name||c.prospectCompany||"Unmatched call"}`,detail:`${c.disposition} · Real ${mmss(c.durationSec)} · Credited ${mmss(c.creditedSec)}`,timestamp:c.completedAt}));
    state.photos.filter(p=>dateKeyInZone(p.timestamp)===key).forEach(p=>items.push({icon:"▧",title:`${getMerchant(p.uid)?.store_name||"Merchant"}`,detail:`${p.photosAdded} photos · ${p.status}`,timestamp:p.timestamp}));
    state.sales.filter(x=>dateKeyInZone(x.timestamp)===key).forEach(x=>items.push({icon:"◎",title:`${getMerchant(x.uid)?.store_name||"Merchant"}`,detail:`Sales record · ${x.type} · ${x.status}`,timestamp:x.timestamp}));
    state.credits.filter(x=>dateKeyInZone(x.timestamp)===key).forEach(x=>items.push({icon:"$",title:`${getMerchant(x.uid)?.store_name||"Merchant"}`,detail:`Credit ${money2(x.amount)} · ${x.status}`,timestamp:x.timestamp}));
    (state.cases || []).filter(x=>dateKeyInZone(x.updatedAt || x.createdAt)===key).forEach(x=>items.push({icon:"#",title:`${getMerchant(x.uid)?.store_name||x.merchant?.name||"Merchant"}`,detail:`${caseTypeLabel(x.caseType)} · ${x.status}`,timestamp:x.updatedAt || x.createdAt}));
    state.followups.filter(f=>dateKeyInZone(f.createdAt)===key).forEach(f=>items.push({icon:"◫",title:`${getMerchant(f.uid)?.store_name||"Merchant"}`,detail:`Follow-up created · ${f.reason}`,timestamp:f.createdAt}));
    state.followups.filter(f=>f.completedAt&&dateKeyInZone(f.completedAt)===key).forEach(f=>items.push({icon:"✓",title:`${getMerchant(f.uid)?.store_name||"Merchant"}`,detail:`Follow-up completed · ${f.reason}`,timestamp:f.completedAt}));

  function renderLegacyLinks() {
    const filter = state.ui.linkFilters || { q:"", category:"all", sort:"favorites" };

  function workspaceHealth() {
    const active=state.merchants.filter(m=>!m.archived);
    const missingIds=active.filter(m=>!m.store_id).length;
    const missingTz=active.filter(m=>!m.timezone).length;
    const missingContacts=active.filter(m=>!splitMulti(m.dm_email).length&&!splitMulti(m.dm_phone).length).length;
    const duplicates=active.length-new Set(active.map(m=>m.store_id||m.uid)).size;
    return { active:active.length, missingIds, missingTz, missingContacts, duplicates, unmatched:state.unmatchedCalls.length };
  }

  function bindViewSpecific() {
    const onInput = (id, fn, eventName="input") => {
      const el=document.getElementById(id); if(el) el.addEventListener(eventName,fn);
    };

    onInput("workHubSearch",e=>{state.ui.workHubPage=1;state.ui.workHubFilters={...(state.ui.workHubFilters||{}),q:e.target.value};debouncedRender();});
    ["workHubView","workHubSort","workHubMarket","workHubVideoFilter","workHubPhotoFilter","workHubContactFilter","workHubPhoneTypeFilter","workHubRecallFilter","workHubLocalTimeFilter","workHubPhotoCoverageFilter","workHubLastInteractionFilter"].forEach(id=>onInput(id,()=>{state.ui.workHubPage=1;state.ui.workHubFilters=readWorkHubFilters();scheduleSave();renderApp();},"change"));

    onInput("caseSearch", e => { state.ui.caseFilters = { ...(state.ui.caseFilters || {}), q:e.target.value }; debouncedRender(); });
    ["caseTypeFilter","caseStatusFilter","caseCategoryFilter"].forEach(id => onInput(id, () => { state.ui.caseFilters = readCaseFilters(); scheduleSave(); renderApp(); }, "change"));

    onInput("merchantHasPhotos",e=>{const merchant=selectedMerchant();if(!merchant)return;setMerchantState(merchant.uid,{hasPhotos:e.target.checked});renderApp();},"change");
    onInput("merchantVideoInReview",e=>{const merchant=selectedMerchant();if(!merchant)return;setMerchantState(merchant.uid,{videoInReview:e.target.checked,videoStatus:e.target.checked?"In review":merchantState(merchant.uid).videoStatus});renderApp();},"change");
    onInput("merchantVideoStatus",e=>{const merchant=selectedMerchant();if(!merchant)return;setMerchantState(merchant.uid,{videoStatus:e.target.value,videoInReview:["In progress","In review"].includes(e.target.value)});renderApp();},"change");
    onInput("merchantPhotoReviewStatus",e=>{const merchant=selectedMerchant();if(!merchant)return;setMerchantState(merchant.uid,{photoReviewStatus:e.target.value,hasPhotos:e.target.value==="Approved"||merchantState(merchant.uid).hasPhotos});renderApp();},"change");
    onInput("merchantContactStatus",e=>{const merchant=selectedMerchant();if(!merchant)return;setMerchantState(merchant.uid,{contactStatus:e.target.value});renderApp();},"change");

    onInput("promoType",handlePromoTypeSelection,"change");
    document.querySelectorAll("[data-promo-input]").forEach(el=>{
      el.addEventListener("input",()=>updatePromoCalculator(el.id,false));
      el.addEventListener("change",()=>updatePromoCalculator(el.id,true));

    ["adWeeklyBudget","adWeeklyBudgetRange","adCostPerOrder","adCostPerOrderRange"].forEach(id=>{
      onInput(id,()=>updateAdCalculator(id,false),"input");
      onInput(id,()=>updateAdCalculator(id,true),"change");
    });

    onInput("profileMerchantSelect",e=>selectMerchant(e.target.value),"change");

    onInput("followupSearch",e=>{state.ui.followupFilters={...(state.ui.followupFilters||{}),q:e.target.value};debouncedRender();});
    ["followupFilterMerchant","followupFilterReason","followupFilterPriority","followupFilterStatus","followupFilterSort"].forEach(id=>onInput(id,()=>{
      state.ui.followupFilters={
        ...(state.ui.followupFilters||{}),
        q:document.getElementById("followupSearch")?.value||"",
        merchant:document.getElementById("followupFilterMerchant")?.value||"all",
        reason:document.getElementById("followupFilterReason")?.value||"all",
        priority:document.getElementById("followupFilterPriority")?.value||"all",
        status:document.getElementById("followupFilterStatus")?.value||"open",
        sort:document.getElementById("followupFilterSort")?.value||"smart"
      };
      scheduleSave();renderApp();
    },"change"));

    onInput("resourceSearch",e=>{state.ui.resourceFilters={...(state.ui.resourceFilters||{}),q:e.target.value,type:document.getElementById("resourceType")?.value||"all",sort:document.getElementById("resourceSort")?.value||"favorites"};debouncedRender();});
    ["resourceType","resourceSort"].forEach(id=>onInput(id,()=>{state.ui.resourceFilters={q:document.getElementById("resourceSearch")?.value||"",type:document.getElementById("resourceType")?.value||"all",sort:document.getElementById("resourceSort")?.value||"favorites"};scheduleSave();renderApp();},"change"));

    onInput("linkSearch",e=>{state.ui.linkFilters={...(state.ui.linkFilters||{}),q:e.target.value,category:document.getElementById("linkCategory")?.value||"all",sort:document.getElementById("linkSort")?.value||"favorites"};debouncedRender();});
    ["linkCategory","linkSort"].forEach(id=>onInput(id,()=>{state.ui.linkFilters={q:document.getElementById("linkSearch")?.value||"",category:document.getElementById("linkCategory")?.value||"all",sort:document.getElementById("linkSort")?.value||"favorites"};scheduleSave();renderApp();},"change"));

    document.querySelectorAll("[data-followup-drag]").forEach(el=>el.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",el.dataset.followupDrag);e.dataTransfer.effectAllowed="move";}));

    document.querySelectorAll("[data-merchant-photo-drop]").forEach(el=>{el.addEventListener("dragover",e=>{e.preventDefault();el.classList.add("dragging");});el.addEventListener("dragleave",()=>el.classList.remove("dragging"));el.addEventListener("drop",e=>{e.preventDefault();el.classList.remove("dragging");const uid=el.dataset.merchantPhotoDrop||"";const file=e.dataTransfer.files?.[0];if(file&&uid)processMerchantPhotoFile(file,uid).then(()=>playStompSound()).catch(()=>{});});});
  }

  function debouncedRender() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { scheduleSave(); renderApp({ animate: false, preserveFocus: true }); }, 160);
  }

  document.addEventListener("click", async e => {
    const nav=e.target.closest("[data-nav]");
    if(nav){setView(nav.dataset.nav);return;}
    const outreachCall=e.target.closest("[data-outreach-call]");
    if(outreachCall){e.preventDefault();await openOutreachDialerForNumber(outreachCall.dataset.outreachCall);return;}
    const copy=e.target.closest("[data-copy]");
    if(copy){copyText(copy.dataset.copy);return;}
    const select=e.target.closest("[data-select-merchant]");
    if(select){selectMerchant(select.dataset.selectMerchant,select.dataset.openView||"");return;}
    const photoPick=e.target.closest("[data-merchant-photo-pick]");
    if(photoPick){const uid=photoPick.dataset.merchantPhotoPick||"";if(uid){state.ui.photoTargetUid=uid;selectMerchant(uid,"workhub");document.getElementById("merchantPhotoInput")?.click();}return;}
    const lane=e.target.closest("[data-toggle-lane]");
    if(lane){const key=lane.dataset.toggleLane;state.ui.laneOpen[key]=state.ui.laneOpen[key]===false?true:false;scheduleSave();renderApp();return;}
    const tab=e.target.closest("[data-workhub-tab]");
    if(tab){state.ui.workHubTab=tab.dataset.workhubTab;scheduleSave();renderApp();return;}
    const clearSmart=e.target.closest('[data-action="clearMerchantBoardFilters"]');
    if(clearSmart){
      state.ui.workHubPage=1;
      state.ui.workHubFilters={...(state.ui.workHubFilters||{}),localTimeBand:"all",photoCoverage:"all",lastInteraction:"all"};
      scheduleSave();renderApp();return;
    }
    const hubPage=e.target.closest("[data-workhub-page]");
    if(hubPage&&!hubPage.disabled){state.ui.workHubPage=Math.max(1,Number(hubPage.dataset.workhubPage||1));scheduleSave();renderApp();return;}
    const status=e.target.closest("[data-set-status]");
    if(status){setSelectedStatus(status.dataset.setStatus);return;}
    const adjust=e.target.closest("[data-photo-adjust]");
    if(adjust){const input=document.getElementById("photoCountNow");if(input)input.value=Math.max(0,Number(input.value||0)+Number(adjust.dataset.photoAdjust||0));return;}
    const delCall=e.target.closest("[data-delete-call]"); if(delCall){deleteRecord("calls",delCall.dataset.deleteCall);return;}
    const delPhoto=e.target.closest("[data-delete-photo]"); if(delPhoto){deleteRecord("photos",delPhoto.dataset.deletePhoto);return;}
    const editSale=e.target.closest("[data-edit-sale]"); if(editSale){openSaleRecordInfo(editSale.dataset.editSale);return;}
    const delSale=e.target.closest("[data-delete-sale]"); if(delSale){deleteRecord("sales",delSale.dataset.deleteSale);return;}
    const delCredit=e.target.closest("[data-delete-credit]"); if(delCredit){deleteRecord("credits",delCredit.dataset.deleteCredit);return;}
    const completeFu=e.target.closest("[data-complete-followup]"); if(completeFu){completeFollowup(completeFu.dataset.completeFollowup);return;}
    const deleteAllFu=e.target.closest("[data-delete-all-followups]"); if(deleteAllFu){deleteAllFollowups();return;}
    const deleteFu=e.target.closest("[data-delete-followup]"); if(deleteFu){deleteFollowup(deleteFu.dataset.deleteFollowup);return;}
    const editFu=e.target.closest("[data-edit-followup]"); if(editFu){const id=editFu.dataset.editFollowup;const f=state.followups.find(item=>String(item.id)===String(id));state.currentView="followups";state.ui.selectedFollowupId=id;state.ui.followupDraftDate="";state.ui.followupDraftTime="";if(f)state.ui.followupAnchor=localDateFromKey(f.date).toISOString();scheduleSave();renderApp();requestAnimationFrame(()=>openFollowupEditorModal(id));return;}
    const selectFu=e.target.closest("[data-select-followup]"); if(selectFu){state.ui.selectedFollowupId=selectFu.dataset.selectFollowup;scheduleSave();renderApp();return;}
    const newFuDate=e.target.closest("[data-new-followup-date]"); if(newFuDate){const targetDate=newFuDate.dataset.newFollowupDate;const targetTime=newFuDate.dataset.newFollowupTime||"10:00";state.currentView="followups";state.ui.selectedFollowupId="";state.ui.followupDraftDate=targetDate;state.ui.followupDraftTime=targetTime;state.ui.followupAnchor=localDateFromKey(targetDate).toISOString();scheduleSave();renderApp();requestAnimationFrame(()=>openFollowupEditorModal("",{date:targetDate,time:targetTime}));return;}

  function setSelectedStatus(status) {
    const merchant=selectedMerchant();if(!merchant)return;
    const key=String(merchant.uid);
    const current={...merchantState(key)};
    if(status === "Active") {
      delete current.status;
      delete current.statusDate;
      delete current.callBackDelay;
      current.updatedAt=new Date().toISOString();
      const meaningful=Object.keys(current).filter(k=>k!=="updatedAt");
      if(meaningful.length) state.merchantStates[key]=current;
      else delete state.merchantStates[key];
      scheduleSave();
      renderApp();
      toast("Merchant returned to Active / Auto routing");
      return;
    }
    current.status = status;
    if(status === "Called") {
      current.statusDate = dateKeyInZone(new Date());
      current.callBackDelay = normalizeCallBackDelay(current.callBackDelay || "3d");
    } else {
      delete current.statusDate;
    }
    current.updatedAt = new Date().toISOString();
    state.merchantStates[key] = current;
    scheduleSave();
    renderApp();
    toast(`Status updated: ${status}`);
  }

  function savePhotoLog() {
    const merchant=selectedMerchant();if(!merchant)return;
    const count=Math.max(0,Number(document.getElementById("photoCountNow")?.value||0));
    if(!count)return toast("Enter at least one photo");
    const status=document.getElementById("photoStatus")?.value||"Pending";
    const note=document.getElementById("photoNotes")?.value.trim()||"";
    const before=merchant.photo_coverage;
    const after=before==null?count:clamp(Number(before)+count,0,100);
    merchant.photo_coverage=after;
    const st=merchantState(merchant.uid);
    const remaining=st.photoMissingRemaining==null||st.photoMissingRemaining===""?"":Math.max(0,Number(st.photoMissingRemaining)-count);
    state.photos.unshift({id:uid("photo"),uid:merchant.uid,timestamp:new Date().toISOString(),photosAdded:count,status,source:"Manual",note,user:state.profile.username||"Workspace user",coverageBefore:before,coverageAfter:after});
    setMerchantState(merchant.uid,{photoStatus:status,photoMissingRemaining:remaining,photoDraftCount:1,photoDraftNote:""});
    scheduleSave();renderApp();toast(`${count} photo${count===1?"":"s"} saved`);

  function saveFollowup(createAnother = false) {
    syncFollowupChecklistEditor();
    const requestedId = String(document.getElementById("followupId")?.value || "").trim();
    const uidValue = String(document.getElementById("followupMerchant")?.value || "").trim();
    if (!uidValue) return toast("Select a merchant");
    const date = document.getElementById("followupDate")?.value || dateKeyInZone(new Date());
    const time = document.getElementById("followupTime")?.value || "10:00";
    const reason = document.getElementById("followupReason")?.value || "General Follow-up";
    const priority = document.querySelector('input[name="followupPriority"]:checked')?.value || "Medium";
    const status = followupNormalizeStatus(document.getElementById("followupStatus")?.value || "Pending");
    const context = String(document.getElementById("followupContext")?.value || "").trim();
    const summary = String(document.getElementById("followupSummary")?.value || "").trim() || (context ? context.split(/\n+/)[0].slice(0,180) : reason);
    const nextAction = String(document.getElementById("followupNextAction")?.value || "").trim();
    const outcome = String(document.getElementById("followupOutcome")?.value || "Not contacted").trim();
    const contact = String(document.getElementById("followupContact")?.value || "").trim();
    const tags = String(document.getElementById("followupTags")?.value || "").split(",").map(value=>value.trim()).filter(Boolean);
    const reminderMinutes = Math.max(0,Number(document.getElementById("followupReminder")?.value || 0));
    const existing = requestedId ? state.followups.find(item=>String(item.id)===requestedId) : null;
    const now = new Date().toISOString();
    const previousStatus = existing ? followupNormalizeStatus(existing.status) : "";
    const record = normalizeFollowupRecord({
      ...(existing || {}),
      id:existing?.id || createUniqueFollowupId(),
      uid:uidValue,
      date,
      time,
      reason,
      priority,
      status,
      summary,
      context,
      notes:context,
      nextAction,
      outcome,
      contact,
      tags,
      checklist:followupEditorChecklistDraft.map(item=>({ ...item,text:String(item.text || "").trim() })).filter(item=>item.text),
      reminderMinutes,
      createdAt:existing?.createdAt || now,
      updatedAt:now,
      completedAt:status==="Completed" ? (existing?.completedAt || now) : "",
      history:Array.isArray(existing?.history) ? existing.history.map(item=>({...item})) : []
    });

    if (!existing) {
      followupHistoryAdd(record,"created","Follow-up created");
      state.followups = [...state.followups,record];
    } else {
      if (previousStatus !== status) {
        if (status === "Completed") followupHistoryAdd(record,"completed","Follow-up completed");
        else if (previousStatus === "Completed") followupHistoryAdd(record,"reopened",`Follow-up reopened as ${followupStatusLabel(status)}`);
        else followupHistoryAdd(record,"updated",`Status changed from ${followupStatusLabel(previousStatus)} to ${followupStatusLabel(status)}`);
      } else {
        followupHistoryAdd(record,"updated","Follow-up details updated");
      }
      Object.assign(existing,record);
    }

    state.selectedUid = uidValue;
    state.ui.selectedFollowupId = record.id;
    state.ui.followupDraftDate = date;
    state.ui.followupDraftTime = time;
    state.ui.followupAnchor = localDateFromKey(date).toISOString();
    closeModal();
    scheduleSave();
    renderApp();
    if (status === "Completed" && previousStatus !== "Completed") {
      playFollowupCompleteSound();
      celebrate();
    }
    toast(existing ? "Follow-up updated" : "Follow-up created");
    if (createAnother) requestAnimationFrame(()=>openFollowupEditorModal("",{ uid:uidValue,date,time,reason,priority }));
  }

    const previous = `${followup.date} ${formatTime12(followup.time || "10:00")}`;
    followup.date = date;

  function loadImageFromDataUrl(src) {

    });
  }

  async function optimizeMerchantPhotoSource(file, source) {
    if (!file?.type?.startsWith("image/")) return source;
    if (file.type === "image/gif") return source;
    try {
      const img = await loadImageFromDataUrl(source);
      const maxDim = 1200;
      const scale = Math.min(1, maxDim / Math.max(img.width || maxDim, img.height || maxDim));
      const width = Math.max(1, Math.round((img.width || maxDim) * scale));
      const height = Math.max(1, Math.round((img.height || maxDim) * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      if (!ctx) return source;
      ctx.fillStyle = "#0d1218";
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      return canvas.toDataURL("image/jpeg", 0.86);
    } catch (err) {
      console.warn(err);
      return source;
    }
  }

  function extractPalette(dataUrl){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d",{willReadFrequently:true});canvas.width=48;canvas.height=48;ctx.drawImage(img,0,0,48,48);const data=ctx.getImageData(0,0,48,48).data;const buckets=new Map();for(let i=0;i<data.length;i+=16){const a=data[i+3];if(a<180)continue;let r=data[i],g=data[i+1],b=data[i+2];const lum=.2126*r+.7152*g+.0722*b;if(lum<30||lum>235)continue;r=Math.round(r/32)*32;g=Math.round(g/32)*32;b=Math.round(b/32)*32;const key=`${r},${g},${b}`;buckets.set(key,(buckets.get(key)||0)+1);}const colors=[...buckets.entries()].sort((a,b)=>b[1]-a[1]).map(([k])=>`#${k.split(",").map(n=>clamp(Number(n),0,255).toString(16).padStart(2,"0")).join("")}`);resolve([colors[0]||"#8b5cf6",colors.find(c=>colorDistance(c,colors[0])>90)||colors[1]||"#2563eb"]);};img.onerror=reject;img.src=dataUrl;});}

    });
  }

// Keep these helpers in the same script scope as the existing CRM functions.
// Coverage uses registered attempts, regardless of disposition or connection.
function merchantContactedThisMonth(merchant, now = new Date()) {
  if (!merchant?.uid) return false;
  const month = dateKeyInZone(now).slice(0, 7);
  return callsFor(merchant.uid).some(call => {
    const day = dateKeyInZone(call.completedAt);
    return Boolean(day) && day.slice(0, 7) === month && Date.parse(call.completedAt) <= new Date(now).getTime();
  });
}

// Compatibility names used by the existing table and monthly coverage widgets.
function merchantCalledRecently(merchant, now = new Date()) {
  return merchantContactedThisMonth(merchant, now);
}

function merchantIsUntouched(merchant, now = new Date()) {
  return !merchantContactedThisMonth(merchant, now);
}

function crmParseCallDate(value) {
  const raw = String(value ?? "").trim();
  if (!raw || /^\d+$/.test(raw)) return "";
  const validDay = (year, month, day) => month >= 1 && month <= 12 &&
    day >= 1 && day <= new Date(Date.UTC(year, month, 0)).getUTCDate();
  const isoDay = raw.match(/^(\d{4})-(\d{2})-(\d{2})(?:T|\s|$)/);
  if (isoDay && !validDay(Number(isoDay[1]), Number(isoDay[2]), Number(isoDay[3]))) return "";

  const named = raw.match(/^([A-Za-z]{3})\s+(\d{1,2})\s+(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})\s+(AM|PM)\s+([A-Z]{3})$/i);
  if (named) {
    const months = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
    const offsets = {PST:"-08:00",PDT:"-07:00",MST:"-07:00",MDT:"-06:00",CST:"-06:00",CDT:"-05:00",EST:"-05:00",EDT:"-04:00",AST:"-04:00",ADT:"-03:00",NST:"-03:30",NDT:"-02:30",UTC:"Z",GMT:"Z"};
    const month = months[named[1].toLowerCase()], day = Number(named[2]), year = Number(named[3]);
    let hour = Number(named[4]);
    const minute = Number(named[5]), second = Number(named[6]), offset = offsets[named[8].toUpperCase()];
    if (!validDay(year, month, day) || hour < 1 || hour > 12 || minute > 59 || second > 59 || !offset) return "";
    hour = (hour % 12) + (named[7].toUpperCase() === "PM" ? 12 : 0);
    const timestamp = `${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}T${String(hour).padStart(2,"0")}:${named[5]}:${named[6]}${offset}`;
    const parsed = new Date(timestamp);
    return Number.isNaN(parsed.getTime()) ? "" : parsed.toISOString();
  }

  const parsed = new Date(raw);
  return Number.isNaN(parsed.getTime()) ? "" : parsed.toISOString();
}

// Returns a validated ISO timestamp, or an empty string. Never substitutes today.
// A present but malformed completion date is rejected rather than hidden by creation time.
function crmValidCallRowDate(raw) {
  return crmParseCallDate(raw?.completed_at || raw?.created_at);
}

function crmCallIdentity(raw) {
  const nativeId = String(raw?.id ?? "").trim();
  if (nativeId) return nativeId;
  const normalize = value => String(value ?? "").trim().toLowerCase();
  const phone = value => String(value ?? "").replace(/\D/g, "");
  const created = crmParseCallDate(raw?.created_at) || crmValidCallRowDate(raw);
  const completed = crmValidCallRowDate(raw) || created;
  const target = String(raw?.prospect_id ?? "").trim() ||
    phone(raw?.to || raw?.prospect_work_phone || raw?.prospect_mobile_phone) ||
    normalize(raw?.prospect_email) || normalize(raw?.prospect_company);
  // Canonical text avoids random IDs and hash collisions. Notes, disposition and
  // duration are deliberately absent: editing those fields does not add an attempt.
  return "outreach-fallback:" + encodeURIComponent(JSON.stringify([
    created, completed, normalize(raw?.direction || "outbound"),
    phone(raw?.from), phone(raw?.to), target, String(raw?.user_id ?? "").trim()
  ]));
}
