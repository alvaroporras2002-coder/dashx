<!-- DASHWORK device mode: early boot selection and final responsive overrides -->
<script id="dashworkDeviceModeBoot">(() => {
  "use strict";
  const root = document.documentElement;
  root.dataset.deviceMode = window.matchMedia?.("(max-width: 1080px)").matches ? "mobile" : "pc";
  document.querySelector('meta[name="viewport"]')?.setAttribute("content", "width=device-width, initial-scale=1, viewport-fit=cover");
})();
</script>

/* Follow-up scheduling, activity calendar and the complete follow-up editor. */
.calendar-shell{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start;min-width:0}
.calendar-shell>aside{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow:auto}
.calendar-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.calendar-scroll{min-width:0;overflow:auto}
.calendar-grid,.activity-calendar{display:grid;grid-template-columns:repeat(5,minmax(115px,1fr));gap:1px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--line)}
.calendar-day-name{padding:12px 8px;background:var(--surface-2);color:var(--muted);text-align:center;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.calendar-cell,.activity-cell{min-height:126px;padding:12px;background:var(--surface);border:0;color:var(--text);transition:background .16s ease}
.calendar-cell:hover,.activity-cell:hover{background:var(--surface-2)}
.calendar-cell.drag-over{background:color-mix(in srgb,var(--accent) 8%,var(--surface));box-shadow:inset 0 0 0 2px var(--accent)}
.calendar-cell.other{background:var(--surface-2);opacity:.65}
.calendar-cell.today{box-shadow:inset 0 3px 0 var(--accent)}
.calendar-cell.selected,.activity-cell.selected{background:color-mix(in srgb,var(--accent) 7%,var(--surface));box-shadow:inset 0 0 0 2px var(--accent)}
.calendar-cell-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:9px}
.calendar-cell-head strong,.activity-cell strong{font-size:13px;font-weight:700}
.calendar-cell-head span,.activity-cell small{color:var(--muted);font-size:11px;line-height:1.45}
.activity-cell small{display:block;margin-top:9px}
.activity-bars{display:grid;gap:6px;margin-top:12px}
.tiny-bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden}
.tiny-bar span{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.tiny-bar.green span{background:var(--green)}
.tiny-bar.orange span{background:var(--orange)}
.followup-chip{padding:9px;margin-top:7px;border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line));border-left:3px solid var(--accent);border-radius:9px;background:color-mix(in srgb,var(--accent) 5%,var(--surface));cursor:grab}
.followup-chip.completed{border-left-color:var(--green);background:color-mix(in srgb,var(--green) 5%,var(--surface))}
.followup-chip.overdue{border-left-color:var(--red);background:color-mix(in srgb,var(--red) 5%,var(--surface))}
.followup-chip strong{display:block;font-size:11px;line-height:1.35}
.followup-chip span{display:block;margin-top:4px;color:var(--muted);font-size:10px}
.followup-list{display:grid;gap:10px}
.followup-row{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.followup-row.completed{border-left:3px solid var(--green)}
.followup-row.overdue{border-left:3px solid var(--red)}
.followup-row-top{display:flex;justify-content:space-between;gap:12px}
.followup-row strong{display:block;font-size:14px}
.followup-row span{display:block;margin-top:5px;color:var(--muted);font-size:12px;line-height:1.5}
.followup-row .button-row{margin-top:12px}

.fu-nova{display:grid;gap:20px;min-width:0;font-family:Arial,sans-serif;color:var(--text)}
.fu-nova-surface{min-width:0;border:1px solid var(--line);border-radius:var(--radius,16px);background:var(--surface);box-shadow:0 2px 5px rgba(15,23,42,.025)}
.fu-nova-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:26px;background:var(--surface)}
.fu-nova-eyebrow{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.fu-nova-hero h2{margin:7px 0 0;font-family:'Times New Roman',serif;font-size:36px;line-height:1.12;font-weight:500;letter-spacing:-.025em}
.fu-nova-hero p{max-width:720px;margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.65}
.fu-nova-hero-actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:flex-end;align-items:center;max-width:440px}
.fu-nova-range{min-width:205px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);text-align:left}
.fu-nova-range span{display:block;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.fu-nova-range strong{display:block;margin-top:5px;font-size:13px;line-height:1.4}
.fu-nova-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.fu-nova-metric{position:relative;min-height:126px;padding:21px;border:1px solid var(--line);border-radius:var(--radius,16px);background:var(--surface);color:var(--text);text-align:left;cursor:pointer;transition:border-color .16s ease,box-shadow .16s ease}

.fu-nova-main{display:grid;grid-template-columns:minmax(0,1fr) 365px;gap:20px;align-items:start}
.fu-nova-calendar{min-width:0;overflow:hidden}

.fu-nova-identity{padding:17px;border:1px solid color-mix(in srgb,var(--accent) 20%,var(--line));border-radius:12px;background:color-mix(in srgb,var(--accent) 5%,var(--surface))}

.fu-nova-focus-section{margin-top:19px;padding-top:19px;border-top:1px solid var(--line)}
.fu-nova-focus-section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}

.fu-nova-note{padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}

.fu-nova-timeline{display:grid}
.fu-nova-timeline-item{position:relative;display:grid;grid-template-columns:31px minmax(0,1fr);gap:11px;padding:8px 0}
.fu-nova-timeline-item:not(:last-child)::before{content:'';position:absolute;left:15px;top:38px;bottom:-6px;width:1px;background:var(--line);pointer-events:none}

.fu-nova-focus-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:20px}
.fu-nova-focus-actions .btn{width:100%;white-space:normal}
.fu-nova-event{--fu-color:var(--accent);position:relative;min-width:0;border:1px solid var(--line);border-left:3px solid var(--fu-color);border-radius:9px;background:var(--surface);color:var(--text);overflow:hidden;cursor:grab;transition:box-shadow .15s ease,border-color .15s ease}

.fu-nova-event.cancelled{--fu-color:var(--muted);opacity:.7}
.fu-nova-event>button{display:block;width:100%;padding:10px 11px;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer}
.fu-nova-event-top{display:flex;justify-content:space-between;gap:8px;align-items:center}

.fu-nova-day{min-width:0}

.fu-nova-week-head span{display:block;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}

.fu-nova-month{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:1px;padding:1px;min-width:870px;border:1px solid var(--line);border-radius:12px;background:var(--line);overflow:hidden}

.fu-nova-more{width:100%;padding:7px 8px;border:0;border-radius:7px;background:var(--surface-2);color:var(--accent);font-size:10px;font-weight:700;text-align:left;cursor:pointer}
.fu-nova-list{display:grid;gap:16px;min-width:0}

.fu-nova-list-rows{display:grid}
.fu-nova-list-row{display:grid;grid-template-columns:76px minmax(110px,1fr) minmax(150px,1.3fr) 100px 85px auto;gap:12px;align-items:center;min-height:78px;padding:15px 16px;border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer;transition:background .15s ease}
.fu-nova-list-row:last-child{border-bottom:0}

#modal.followup-editor-modal{width:min(970px,calc(100vw - 32px));max-height:92vh}

.fu-editor-section{padding:21px;border:1px solid var(--line);border-radius:13px;background:var(--surface-2)}

.fu-editor-section-head span{display:block;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.fu-editor-section-head h3{margin:5px 0 0;font-family:'Times New Roman',serif;font-size:23px;line-height:1.25}
.fu-editor-section-head p{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
.fu-editor-priority{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fu-editor-priority>div{position:relative}

.fu-editor-priority label{display:grid;align-content:center;gap:8px;min-height:69px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);cursor:pointer;text-transform:none;letter-spacing:0}

function canonicalSalesforceUrl(url) {
  const value = String(url || "").trim();
  if (!value) return "";

  if (/^https:\/\/doordashmx\.lightning\.force\.com\/lightning\/r\/Account\/[^/]+\/view(?:\?|$)/i.test(value)) {

      const wsMatch = decoded.match(/[?&]ws=%2Flightning%2Fr%2FAccount%2F([^%&]+)%2Fview/i) || decoded.match(/[?&]ws=\/lightning\/r\/Account\/([^/&]+)\/view/i);
      if (accountMatch) {
        return buildSalesforceDirectUrl(accountMatch[1], wsMatch?.[1] || accountMatch[1]);
      }
    } catch {}
  }

  // If the value is already a Lightning record URL on another allowed host, normalize it.
  const directMatch = value.match(/\/lightning\/r\/Account\/([^/]+)\/view(?:\?|$)/i);
  if (directMatch) {
    const accountId = directMatch[1];
    const wsMatch = value.match(/[?&]ws=%2Flightning%2Fr%2FAccount%2F([^%&]+)%2Fview/i) || value.match(/[?&]ws=\/lightning\/r\/Account\/([^/&]+)\/view/i);

  function openDatabase() {
    return new Promise(resolve => {
      let request, completed = false;
      const finish = value => { if (completed) { if(value)try{value.close();}catch{} return; } completed=true; clearTimeout(timer); resolve(value); };
      const timer=setTimeout(()=>finish(null),1200);
      try {
        const api=window.indexedDB;
        if(!api){finish(null);return;}
        request=api.open(DB_NAME,1);
        request.onupgradeneeded=()=>{const database=request.result;if(!database.objectStoreNames.contains(DB_STORE))database.createObjectStore(DB_STORE);};
        request.onsuccess=()=>finish(request.result);
        request.onerror=()=>finish(null);
        request.onblocked=()=>finish(null);
      } catch { finish(null); }
    });
  }

  function dbRead(key) {
    return new Promise(resolve => {
      const local=()=>{try{return JSON.parse(localStorage.getItem(key)||"null");}catch{return null;}};
      if(!db){resolve(local());return;}
      let completed=false;const connection=db;
      const finish=(value,failed=false)=>{if(completed)return;completed=true;clearTimeout(timer);if(failed){if(db===connection)db=null;try{connection.close();}catch{}}resolve(value??local());};
      const timer=setTimeout(()=>finish(null,true),1200);
      try{const transaction=connection.transaction(DB_STORE,"readonly"),request=transaction.objectStore(DB_STORE).get(key);request.onsuccess=()=>finish(request.result);request.onerror=()=>finish(null,true);transaction.onabort=()=>finish(null,true);}catch{finish(null,true);}
    });
  }

  function dbWrite(key,value) {
    return new Promise(resolve => {
      let localSaved=false;
      try{localStorage.setItem(key,JSON.stringify(value));localSaved=true;}catch{}
      if(!db){if(!localSaved)console.warn("Local storage unavailable; export JSON to keep a copy.");resolve();return;}
      let completed=false,transaction;const connection=db;
      const finish=failed=>{if(completed)return;completed=true;clearTimeout(timer);if(failed){if(db===connection)db=null;try{transaction?.abort();}catch{}try{connection.close();}catch{}}resolve();};
      const timer=setTimeout(()=>finish(true),1200);
      try{transaction=connection.transaction(DB_STORE,"readwrite");transaction.objectStore(DB_STORE).put(value,key);transaction.oncomplete=()=>finish(false);transaction.onerror=()=>finish(true);transaction.onabort=()=>finish(true);}catch{finish(true);}
    });
  }

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]));
  }

  function attr(value) { return esc(value).replace(/`/g, "&#096;"); }
  function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }
  function normalizeText(value) {
    return String(value ?? "")
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")

  function numberValue(value) {

  function percentValue(value) {
    const n = numberValue(value);

  function money2(value) {

  function mmss(seconds) {
    const sec = Math.max(0, Math.round(Number(seconds) || 0));
    const m = Math.floor(sec / 60);

  }
  function toISODate(date = new Date()) {
    const d = new Date(date);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }
  function dateKeyInZone(date, timeZone = state.settings.userTz) {
    const d = new Date(date);

    const parts = new Intl.DateTimeFormat("en-CA", { timeZone, year:"numeric", month:"2-digit", day:"2-digit" }).formatToParts(d);
    const get = type => parts.find(x => x.type === type)?.value || "";
    return `${get("year")}-${get("month")}-${get("day")}`;
  }
  function localDateFromKey(key) {

  }
  function formatDate(value, options = {}) {
    const d = value instanceof Date ? value : new Date(value);
    if (Number.isNaN(d.getTime())) return String(value || "—");
    return new Intl.DateTimeFormat("en-US", { month:"short", day:"numeric", year:"numeric", ...options }).format(d);
  }
  function formatDateTime(value) {
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return String(value || "—");

  function isSameDay(a, b) { return toISODate(a) === toISODate(b); }

  function addDays(date, amount) { const d = new Date(date); d.setDate(d.getDate() + amount); return d; }
  function daysBetween(a, b) { return Math.floor((startOfDay(b) - startOfDay(a)) / 86400000); }

  function canonicalTz(value) { return TIMEZONE_ALIASES[value] || value || ""; }

  function parseTimeMinutes(value, fallback = 0) {
    const [h,m] = String(value || "").split(":").map(Number);
    return Number.isFinite(h) && Number.isFinite(m) ? h * 60 + m : fallback;

  function merchantLocalStatus(merchant, now = new Date()) {
    const zone = canonicalTz(merchant?.timezone);
    if (!zone) return { label:"Missing timezone", cls:"orange", time:"—", date:"—", safe:false, zone:"" };
    try {
      const weekday = safeIntl(zone, { weekday:"short" }, now);
      const time24 = safeIntl(zone, { hour:"2-digit", minute:"2-digit", hour12:false }, now);
      const [h,m] = time24.split(":").map(Number);
      const current = h * 60 + m;
      const start = parseTimeMinutes(state.settings.safeStart, 540);
      const end = parseTimeMinutes(state.settings.safeEnd, 1200);
      const weekend = ["Sat","Sun"].includes(weekday);
      const safe = !weekend && current >= start && current <= end;
      return {
        label: weekend ? "Weekend" : safe ? "Safe to call" : current < start ? "Too early" : "Too late",
        cls: safe ? "green" : weekend ? "purple" : "red",
        time: safeIntl(zone, { hour:"numeric", minute:"2-digit", second:"2-digit" }, now),
        date: safeIntl(zone, { weekday:"short", month:"short", day:"numeric" }, now),
        safe,
        zone
      };
    } catch {
      return { label:"Invalid timezone", cls:"red", time:"—", date:"—", safe:false, zone };
    }
  }

  function toast(message, ms = 2600) {
    const el = document.getElementById("toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => el.classList.remove("show"), ms);
  }

  function copyText(text, success = "Copied") {
    const value = String(text || "");
    if (!value) return toast("Nothing to copy");
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(value).then(() => toast(success)).catch(() => fallbackCopy(value, success));
    } else fallbackCopy(value, success);
  }

  function fallbackCopy(value, success) {
    const ta = document.createElement("textarea");
    ta.value = value;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); toast(success); } catch { toast("Copy failed"); }
    ta.remove();
  }

  function downloadFile(filename, content, type = "text/plain") {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function csvEscape(value) {
    const s = String(value ?? "");
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }

  function celebrate() {
    const layer = document.getElementById("confettiLayer");
    layer.innerHTML = "";
    for (let i = 0; i < 36; i++) {
      const piece = document.createElement("i");
      piece.className = "confetti";
      piece.style.setProperty("--h", String((i * 37) % 360));
      piece.style.setProperty("--x", `${(Math.random() - .5) * 520}px`);
      piece.style.setProperty("--y", `${40 + Math.random() * 360}px`);
      piece.style.setProperty("--r", `${Math.random() * 900 - 450}deg`);
      piece.style.animationDelay = `${Math.random() * 120}ms`;
      layer.appendChild(piece);
    }
    setTimeout(() => layer.innerHTML = "", 1200);
  }

  function launchSaleFireworks() {
    const layer = document.getElementById("saleCelebrationLayer");
    if (!layer) return;
    layer.innerHTML = "";
    const bursts = 7;
    const sparksPerBurst = 12;
    const flashes = 2;
    const burstPoints = Array.from({ length: bursts }, () => ({
      x: `${8 + Math.random() * 84}vw`,
      y: `${10 + Math.random() * 64}vh`
    }));
    for (const point of burstPoints) {
      const flash = document.createElement("i");
      flash.className = "sale-flash";
      flash.style.setProperty("--x", point.x);
      flash.style.setProperty("--y", point.y);
      layer.appendChild(flash);

      for (let i = 0; i < sparksPerBurst; i++) {
        const spark = document.createElement("i");
        spark.className = "sale-firework";
        const angle = (Math.PI * 2 * i) / sparksPerBurst + (Math.random() * 0.3);
        const dist = 110 + Math.random() * 260;
        spark.style.setProperty("--x", point.x);
        spark.style.setProperty("--y", point.y);
        spark.style.setProperty("--dx", `${Math.cos(angle) * dist}px`);
        spark.style.setProperty("--dy", `${Math.sin(angle) * dist}px`);
        spark.style.setProperty("--h", String(Math.floor(Math.random() * 360)));
        spark.style.animationDelay = `${Math.random() * 120}ms`;
        if (i % 3 === 0) spark.classList.add("spark");
        spark.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 360}deg)`;
        layer.appendChild(spark);
      }
    }

    for (let i = 0; i < flashes; i++) {
      const flash = document.createElement("i");
      flash.className = "sale-flash";
      flash.style.setProperty("--x", `${50 + (Math.random() - .5) * 18}%`);
      flash.style.setProperty("--y", `${34 + (Math.random() - .5) * 18}%`);
      flash.style.animationDelay = `${i * 120}ms`;
      layer.appendChild(flash);
    }

    setTimeout(() => {
      layer.querySelectorAll(".sale-firework, .sale-flash").forEach(el => el.remove());
    }, 1500);
  }


  function showSaleCats() {
    const layer = document.getElementById("saleCelebrationLayer");
    if (!layer) return;

    layer.querySelectorAll(".sale-cat").forEach(el => el.remove());

    const width = Math.max(window.innerWidth, 320);
    const height = Math.max(window.innerHeight, 320);
    const count = Math.max(8, Math.min(14, Math.round(width / 160)));

    const rand = (min, max) => min + Math.random() * (max - min);
    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
    const makePoint = (size) => ({
      x: clamp(rand(0, width - size), 0, Math.max(0, width - size)),
      y: clamp(rand(0, height - size), 0, Math.max(0, height - size))
    });

    for (let i = 0; i < count; i++) {
      const cat = document.createElement("div");
      cat.className = "sale-cow sale-cat";

      const size = rand(66, 136);
      const points = [makePoint(size), makePoint(size), makePoint(size), makePoint(size), makePoint(size), makePoint(size)];
      const duration = rand(2700, 3600);
      const delay = rand(0, 240);
      const spin = rand(-30, 30);
      const spin2 = rand(-38, 38);

      cat.innerHTML = `<img src="${SALE_CAT_DATA_URL}" alt="Celebration kitten" draggable="false" />`;
      cat.style.position = "absolute";
      cat.style.left = "0px";
      cat.style.top = "0px";
      cat.style.width = `${size}px`;
      cat.style.maxWidth = `${size}px`;
      cat.style.pointerEvents = "none";
      cat.style.opacity = "0";
      cat.style.transform = "translate(0px, 0px)";
      cat.style.animation = "none";
      cat.style.filter = "drop-shadow(0 14px 28px rgba(0,0,0,.40))";

      layer.appendChild(cat);

      const animation = cat.animate([
        { opacity: 0, transform: `translate(${points[0].x}px, ${points[0].y}px) scale(.45) rotate(${spin}deg)` },
        { offset: 0.08, opacity: 1 },
        { offset: 0.16, transform: `translate(${points[1].x}px, ${points[1].y}px) scale(.90) rotate(${spin2}deg)`, opacity: 1 },
        { offset: 0.32, transform: `translate(${points[2].x}px, ${points[2].y}px) scale(1.05) rotate(${spin}deg)`, opacity: 1 },
        { offset: 0.48, transform: `translate(${points[3].x}px, ${points[3].y}px) scale(.95) rotate(${spin2}deg)`, opacity: 1 },
        { offset: 0.66, transform: `translate(${points[4].x}px, ${points[4].y}px) scale(1.02) rotate(${spin}deg)`, opacity: 1 },
        { offset: 0.84, transform: `translate(${points[5].x}px, ${points[5].y}px) scale(.88) rotate(${spin2}deg)`, opacity: 1 },
        { opacity: 0, transform: `translate(${points[5].x}px, ${points[5].y}px) scale(.70) rotate(${spin}deg)` }
      ], {
        duration,
        delay,
        easing: "cubic-bezier(.18,.92,.22,1)",
        fill: "forwards"
      });

      setTimeout(() => {
        try { animation.cancel(); } catch {}
        cat.remove();
      }, duration + delay + 250);
    }
  }

  function celebrateSale() {
    launchSaleFireworks();
    showSaleCats();
  }

  const SALE_SOUND_DATA_URL = "";

  function playSoundDataUrl(dataUrl, volume = 0.7, durationMs = null) {
    try {
      const audio = new Audio(dataUrl);
      audio.volume = volume;
      audio.preload = "auto";
      const playResult = audio.play();
      if (durationMs != null) {
        setTimeout(() => {
          try {
            audio.pause();
            audio.currentTime = 0;
          } catch {}
        }, durationMs);
      }
      if (playResult && typeof playResult.catch === "function") playResult.catch(() => {});
    } catch {}
  }

  function playStompSound() {
    playSoundDataUrl(STOMP_SOUND_DATA_URL, 0.72);
  }

  function playSaleSound() {
    playSoundDataUrl(SALE_SOUND_DATA_URL, 0.80, 4000);
  }

  function parseCSV(text) {
    const rows = [];
    let row = [];
    let cell = "";
    let quoted = false;
    const source = String(text || "").replace(/^\uFEFF/, "");
    for (let i = 0; i < source.length; i++) {
      const ch = source[i];
      if (quoted) {
        if (ch === '"') {
          if (source[i + 1] === '"') { cell += '"'; i++; }
          else quoted = false;
        } else cell += ch;
      } else {
        if (ch === '"') quoted = true;
        else if (ch === ',') { row.push(cell); cell = ""; }
        else if (ch === '\n') { row.push(cell.replace(/\r$/, "")); rows.push(row); row = []; cell = ""; }
        else cell += ch;
      }
    }
    if (cell.length || row.length) { row.push(cell.replace(/\r$/, "")); rows.push(row); }
    return rows.filter(r => r.some(v => String(v).trim() !== ""));
  }

  function rowsToObjects(rows, headerMap) {
    if (!rows.length) return [];
    const headers = rows[0].map(h => headerMap[normalizeHeader(h)] || normalizeHeader(h).replace(/[^a-z0-9]+/g, "_"));
    return rows.slice(1).map(row => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = String(row[i] ?? "").trim());
      return obj;
    });
  }

  function merchantUidFromRaw(raw) {
    const ddmx = String(raw.ddmx_account_id || "").trim();
    const store = cleanStoreId(raw.store_id);
    const business = cleanStoreId(raw.business_id);
    if (ddmx) return `ddmx_${ddmx}`;
    if (store) return `store_${store}`;
    if (business) return `business_${business}`;
    return uid("merchant");
  }

  function normalizeMerchant(raw) {
    const uidValue = merchantUidFromRaw(raw);
    return {
      uid: uidValue,
      account_owner: raw.account_owner || "",
      ultimate_parent_id: raw.ultimate_parent_id || "",
      ultimate_parent_name: raw.ultimate_parent_name || "",
      business_id: cleanStoreId(raw.business_id),
      business_name: raw.business_name || "",
      ddmx_account_id: raw.ddmx_account_id || "",
      store_id: cleanStoreId(raw.store_id),
      store_name: raw.store_name || raw.business_name || raw.ultimate_parent_name || "Unnamed merchant",
      market_name: raw.market_name || "",
      region_name: raw.region_name || "",
      submarket_name: raw.submarket_name || "",
      timezone: raw.timezone || "",
      language: raw.language || "",
      medal_rank: raw.medal_rank || "",
      dm_name: raw.dm_name || "",
      dm_email: raw.dm_email || "",
      dm_phone: raw.dm_phone || "",
      dm_mobile_phone: raw.dm_mobile_phone || "",
      dm_work_phone: raw.dm_work_phone || "",
      dm_phone_type: raw.dm_phone_type || "",
      mx_portal_link: /^https?:\/\//i.test(raw.mx_portal_link || "") ? raw.mx_portal_link : "",
      ddmx_link: /^https?:\/\//i.test(raw.ddmx_link || "") ? raw.ddmx_link : "",
      photo_coverage: percentValue(raw.photo_coverage),
      description_coverage: percentValue(raw.description_coverage),
      uptime: percentValue(raw.uptime),
      gmv: numberValue(raw.gmv),
      touchpoint_count: numberValue(raw.touchpoint_count) || 0,
      promo_opp: Number(numberValue(raw.promo_opp) || 0),
      sl_opp: Number(numberValue(raw.sl_opp) || 0),
      is_new: raw.is_new || "",
      archived: false,
      importedAt: new Date().toISOString()
    };
  }

  function merchantIssues(merchant) {
    const issues = [];
    if (!merchant.store_id) issues.push("Missing Store ID");
    if (!merchant.timezone) issues.push("Missing timezone");
    if (!splitMulti(merchant.dm_email).length && !splitMulti(merchant.dm_phone).length) issues.push("No usable contact");
    if (!merchant.store_name || merchant.store_name === "Unnamed merchant") issues.push("Missing store name");
    if (String(merchant.dm_name || "").toUpperCase().includes("DO NOT USE")) issues.push("DO NOT USE contact");
    return issues;
  }

  function snapshotForUndo() {
    return {
      merchants: structuredClone(state.merchants),
      calls: structuredClone(state.calls),
      unmatchedCalls: structuredClone(state.unmatchedCalls),
      selectedUid: state.selectedUid,
      at: new Date().toISOString()
    };
  }

  function importMerchantsText(text, filename = "Merchants CSV") {
    const rows = parseCSV(text);
    if (rows.length < 2) throw new Error("The merchant CSV does not contain data rows.");
    const rawObjects = rowsToObjects(rows, MERCHANT_HEADER_MAP);
    const incoming = rawObjects.map(normalizeMerchant);
    if (!incoming.length) throw new Error("No merchant records could be parsed.");

    state.lastImportSnapshot = snapshotForUndo();
    const existing = new Map(state.merchants.map(m => [m.uid, m]));
    const incomingIds = new Set(incoming.map(m => m.uid));
    let added = 0, updated = 0, archived = 0;

    const merged = incoming.map(m => {
      const old = existing.get(m.uid);
      if (old) { updated++; return { ...old, ...m, archived: false }; }
      added++;
      return m;
    });

    state.merchants.forEach(old => {
      if (!incomingIds.has(old.uid)) {
        merged.push({ ...old, archived: true });
        archived++;
      }
    });

    state.merchants = merged;
    if (!getMerchant(state.selectedUid) || getMerchant(state.selectedUid)?.archived) {
      state.selectedUid = state.merchants.find(m => !m.archived)?.uid || "";
    }
    const duplicates = incoming.length - new Set(incoming.map(m => m.uid)).size;
    state.importHistory.unshift({ id: uid("import"), type:"Merchants", filename, at:new Date().toISOString(), added, updated, archived, duplicates, total:incoming.length });
    state.importHistory = state.importHistory.slice(0, 20);
    scheduleSave();
    renderApp();
    toast(`${incoming.length} merchants imported · ${added} new · ${updated} updated`);
    return { total: incoming.length, added, updated, archived, duplicates };
  }

  function parseCallDate(value) {
    const raw = String(value || "").trim();
    if (!raw) return new Date().toISOString();
    let d = new Date(raw);
    if (!Number.isNaN(d.getTime())) return d.toISOString();
    const zoneOffsets = { PST:"-08:00", PDT:"-07:00", MST:"-07:00", MDT:"-06:00", CST:"-06:00", CDT:"-05:00", EST:"-05:00", EDT:"-04:00", AST:"-04:00", ADT:"-03:00", NST:"-03:30", NDT:"-02:30" };
    const m = raw.match(/^([A-Za-z]{3})\s+(\d{1,2})\s+(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})\s+(AM|PM)\s+([A-Z]{3})$/);
    if (m) {
      let hour = Number(m[4]);
      if (m[7] === "PM" && hour !== 12) hour += 12;
      if (m[7] === "AM" && hour === 12) hour = 0;
      const month = {Jan:"01",Feb:"02",Mar:"03",Apr:"04",May:"05",Jun:"06",Jul:"07",Aug:"08",Sep:"09",Oct:"10",Nov:"11",Dec:"12"}[m[1]];
      const iso = `${m[3]}-${month}-${String(m[2]).padStart(2,"0")}T${String(hour).padStart(2,"0")}:${m[5]}:${m[6]}${zoneOffsets[m[8]] || "Z"}`;
      d = new Date(iso);
      if (!Number.isNaN(d.getTime())) return d.toISOString();
    }
    return new Date().toISOString();
  }

  function callPhones(raw) {
    return unique([
      raw.prospect_mobile_phone,
      raw.prospect_home_phone,
      raw.prospect_work_phone,
      raw.prospect_voip_phone,
      raw.prospect_other_phone,
      raw.to
    ].map(digits).filter(Boolean));
  }

  function normalizeCall(raw) {
    const duration = Math.max(0, Number(numberValue(raw.duration_seconds) || 0));
    const callState = String(raw.state || "").toLowerCase();
    const timestamp = parseCallDate(raw.completed_at || raw.created_at || new Date().toISOString());
    return {
      id: String(raw.id || uid("call")),
      uid: "",
      state: callState,
      createdAt: parseCallDate(raw.created_at || timestamp),
      completedAt: timestamp,
      durationSec: duration,
      creditedSec: duration + (callState === "completed" ? 60 : 0),
      direction: raw.direction || "outbound",
      from: raw.from || "",
      to: raw.to || "",
      outcome: raw.outcome || raw.disposition || callState || "Call",
      disposition: raw.disposition || raw.outcome || callState || "Call",
      purpose: raw.purpose || "",
      note: raw.note || "",
      prospectId: raw.prospect_id || "",
      prospectName: [raw.prospect_first_name, raw.prospect_last_name].filter(Boolean).join(" "),
      prospectCompany: raw.prospect_company || "",
      prospectEmail: raw.prospect_email || "",
      prospectMobilePhone: raw.prospect_mobile_phone || "",
      prospectWorkPhone: raw.prospect_work_phone || "",
      prospectPhones: callPhones(raw),
      userName: [raw.user_first_name, raw.user_last_name].filter(Boolean).join(" "),
      source: "CSV",
      manual: false,
      importedAt: new Date().toISOString()
    };
  }

  function similarityScore(a, b) {
    const x = normalizeText(a), y = normalizeText(b);
    if (!x || !y) return 0;
    if (x === y) return 100;
    if (x.includes(y) || y.includes(x)) return 82;
    const xs = new Set(x.split(" ").filter(t => t.length > 1));
    const ys = new Set(y.split(" ").filter(t => t.length > 1));
    let overlap = 0;
    xs.forEach(t => { if (ys.has(t)) overlap++; });
    return Math.round((overlap / Math.max(1, Math.max(xs.size, ys.size))) * 75);
  }

  function matchCallToMerchant(call) {
    const active = state.merchants.filter(m => !m.archived);
    const email = normalizeText(call.prospectEmail).replace(/\s/g, "");
    if (email) {
      const matches = active.filter(m => splitMulti(m.dm_email).some(e => normalizeText(e).replace(/\s/g, "") === email));
      if (matches.length === 1) return { uid: matches[0].uid, method:"email", confidence:100 };
      if (matches.length > 1) return { uid:"", method:"multiple email matches", confidence:0, suggestions:matches.slice(0,5).map(m=>m.uid) };
    }

    const phones = call.prospectPhones.map(digits).filter(Boolean);
    if (phones.length) {
      const matches = active.filter(m => {
        const merchantPhones = splitMulti(m.dm_phone).map(digits);
        return merchantPhones.some(mp => phones.some(cp => mp && cp && (mp === cp || mp.endsWith(cp.slice(-10)) || cp.endsWith(mp.slice(-10)))));
      });
      if (matches.length === 1) return { uid: matches[0].uid, method:"phone", confidence:98 };
      if (matches.length > 1) return { uid:"", method:"multiple phone matches", confidence:0, suggestions:matches.slice(0,5).map(m=>m.uid) };
    }

    const company = String(call.prospectCompany || "");
    const storeIdMatch = company.match(/\b(\d{5,})\b/);
    if (storeIdMatch) {
      const matches = active.filter(m => cleanStoreId(m.store_id) === storeIdMatch[1]);
      if (matches.length === 1) return { uid: matches[0].uid, method:"store id", confidence:96 };
    }

    if (company) {
      const scored = active.map(m => ({ m, score: Math.max(similarityScore(company, m.store_name), similarityScore(company, m.business_name), similarityScore(company, m.ultimate_parent_name)) }))
        .filter(x => x.score >= 45).sort((a,b) => b.score - a.score);
      if (scored[0] && (!scored[1] || scored[0].score - scored[1].score >= 12) && scored[0].score >= 68) {
        return { uid: scored[0].m.uid, method:"company", confidence:scored[0].score };
      }
      return { uid:"", method:"company review", confidence:scored[0]?.score || 0, suggestions:scored.slice(0,5).map(x=>x.m.uid) };
    }

    return { uid:"", method:"no match fields", confidence:0, suggestions:[] };
  }

  function importCallsText(text, filename = "Calls CSV") {
    const rows = parseCSV(text);
    if (rows.length < 2) throw new Error("The calls CSV does not contain data rows.");
    const rawObjects = rowsToObjects(rows, CALL_HEADER_MAP);
    const incoming = rawObjects.map((raw, index) => {
      const timestamp = crmValidCallRowDate(raw);
      if (!timestamp) throw new Error(`CSV row ${index + 2}: missing or invalid call date. No calls were imported.`);
      return normalizeCall({...raw, id:crmCallIdentity(raw), completed_at:timestamp, created_at:crmParseCallDate(raw.created_at)||timestamp});
    });
    state.lastImportSnapshot = snapshotForUndo();
    const existingIds = new Set(state.calls.map(c => String(c.id)));
    let imported = 0, duplicates = 0, unmatched = 0, matched = 0;
    let realSec = 0, creditedSec = 0;

    for (const call of incoming) {
      if (existingIds.has(String(call.id))) { duplicates++; continue; }
      const match = matchCallToMerchant(call);
      call.uid = match.uid || "";
      call.matchMethod = match.method;
      call.matchConfidence = match.confidence;
      state.calls.push(call);
      existingIds.add(String(call.id));
      imported++;
      realSec += call.durationSec;
      creditedSec += call.creditedSec;
      if (call.uid) matched++;
      else {
        unmatched++;
        state.unmatchedCalls.push({ id: uid("unmatched"), callId: call.id, suggestions: match.suggestions || [], reason: match.method, createdAt: new Date().toISOString() });
      }
    }

    state.calls.sort((a,b) => String(b.completedAt).localeCompare(String(a.completedAt)));
    state.importHistory.unshift({ id:uid("import"), type:"Calls", filename, at:new Date().toISOString(), imported, duplicates, matched, unmatched, realSec, creditedSec });
    state.importHistory = state.importHistory.slice(0,20);
    scheduleSave();
    renderApp();
    toast(`${imported} calls imported · ${matched} matched · ${unmatched} unmatched`);
    return { imported, duplicates, matched, unmatched, realSec, creditedSec };
  }

  function undoLastImport() {
    const snap = state.lastImportSnapshot;
    if (!snap) return toast("No import snapshot is available");
    state.merchants = snap.merchants || [];
    state.calls = snap.calls || [];
    state.unmatchedCalls = snap.unmatchedCalls || [];
    state.selectedUid = snap.selectedUid || state.merchants[0]?.uid || "";
    state.lastImportSnapshot = null;
    scheduleSave();
    renderApp();
    toast("Last import was undone");
  }

  function callsFor(uidValue) { return state.calls.filter(c => c.uid === uidValue); }
  function photosFor(uidValue) { return state.photos.filter(p => p.uid === uidValue); }
  function followupsFor(uidValue) { return state.followups.filter(f => f.uid === uidValue); }
  function salesFor(uidValue) { return state.sales.filter(x => x.uid === uidValue); }
  function creditsFor(uidValue) { return state.credits.filter(x => x.uid === uidValue); }
  function lastCallFor(uidValue) { return callsFor(uidValue).sort((a,b) => String(b.completedAt).localeCompare(String(a.completedAt)))[0] || null; }
  function latestPendingFollowup(uidValue) {
    return followupsFor(uidValue).filter(f => followupIsOpen(f)).sort((a,b) => followupDateTime(a) - followupDateTime(b))[0] || null;
  }
  function followupDateTime(f) {
    const d = new Date(`${f.date || toISODate()}T${f.time || "09:00"}:00`);
    return Number.isNaN(d.getTime()) ? new Date(0) : d;
  }
  function dueFollowupFor(uidValue, now = new Date()) {
    const today = dateKeyInZone(now);
    return followupsFor(uidValue).filter(f => followupIsOpen(f) && String(f.date) <= today).sort((a,b) => followupDateTime(a) - followupDateTime(b))[0] || null;
  }
  function callIsRecent(call, now = new Date()) {
    if (!call?.completedAt) return false;
    const diff = daysBetween(new Date(call.completedAt), now);
    return diff >= 0 && diff < RECENT_CALL_DAYS;
  }
  function merchantCalledRecently(merchant, now = new Date()) {
    const st = merchantState(merchant.uid);
    if (st.status === "Called" && st.statusDate) {
      const diff = daysBetween(localDateFromKey(st.statusDate), now);
      if (diff >= 0 && diff < RECENT_CALL_DAYS) return true;
    }
    return callsFor(merchant.uid).some(c => callIsRecent(c, now));
  }

  function merchantIsUntouched(merchant, now = new Date()) {
    // "Uncalled" should mean the merchant has not been called recently.
    // Do not hide merchants just because they already have other saved data.
    return !merchantCalledRecently(merchant, now);
  }
  function merchantCalledToday(merchant, now = new Date()) {
    const today = dateKeyInZone(now);
    const st = merchantState(merchant.uid);
    return (st.status === "Called" && st.statusDate === today) || callsFor(merchant.uid).some(c => dateKeyInZone(c.completedAt) === today);
  }

  function deriveMerchant(merchant, now = new Date()) {
    const st = merchantState(merchant.uid);
    const issues = merchantIssues(merchant);
    const due = dueFollowupFor(merchant.uid, now);
    const nextFu = latestPendingFollowup(merchant.uid);
    const calledToday = merchantCalledToday(merchant, now);
    const calledRecently = merchantCalledRecently(merchant, now);
    const local = merchantLocalStatus(merchant, now);
    const gmv = Number(merchant.gmv || 0);
    const photo = merchant.photo_coverage;
    let lane = "To Call";
    let laneClass = "blue";
    let reason = "Ready for outreach";

    if (st.status === "Blocked") { lane = "Blocked / Data Issue"; laneClass = "red"; reason = "Blocked manually"; }
    else if (st.status === "Done") { lane = "Done"; laneClass = "green"; reason = "Completed"; }
    else if (st.status === "Waiting on Merchant") { lane = "Waiting on Merchant"; laneClass = "purple"; reason = "Waiting on merchant"; }
    else if (st.status === "Needs Data Review") { lane = "Needs Data Review"; laneClass = "orange"; reason = issues.join(" · ") || "Manual data review"; }
    else if (st.status === "Relationship / Healthy") { lane = "Relationship / Healthy"; laneClass = "green"; reason = "Healthy relationship"; }
    else if (due) { lane = "Needs Follow-up"; laneClass = due.date < dateKeyInZone(now) ? "red" : "orange"; reason = `${due.date < dateKeyInZone(now) ? "Overdue" : "Due today"}: ${due.reason}`; }
    else if (st.status === "Needs Follow-up") { lane = "Needs Follow-up"; laneClass = "orange"; reason = "Manual follow-up"; }
    else if (calledToday || st.status === "Called") { lane = "Called Today"; laneClass = "green"; reason = lastCallFor(merchant.uid)?.disposition || "Called"; }
    else if (st.status === "No Answer") { lane = "Called Today"; laneClass = "orange"; reason = "No Answer"; }
    else if (st.status === "Spoke") { lane = "Called Today"; laneClass = "green"; reason = "Spoke"; }
    else if (issues.length) { lane = "Needs Data Review"; laneClass = "orange"; reason = issues.join(" · "); }
    else if (photo != null && photo < 50 && gmv >= 5000) { lane = "High GMV + Critical Coverage"; laneClass = "red"; reason = "High GMV and critical photo coverage"; }
    else if (photo != null && photo >= 80 && !merchant.promo_opp && !merchant.sl_opp) { lane = "Relationship / Healthy"; laneClass = "green"; reason = "Healthy coverage"; }

    let score = 0;
    const today = dateKeyInZone(now);
    if (due) {
      const overdueDays = Math.max(0, daysBetween(localDateFromKey(due.date), localDateFromKey(today)));
      score += due.date < today ? 10000 + overdueDays * 80 : 9000;
      score += ({Critical:500,High:300,Medium:150,Low:50}[due.priority] || 0);
    }
    if (st.status === "Needs Follow-up" && !due) score += 8200;
    if (photo != null) score += Math.max(0, 100 - photo) * 22;
    else score += 700;
    score += Math.min(2800, gmv / 3);
    if (merchant.promo_opp) score += 420;
    if (merchant.sl_opp) score += 420;
    if (issues.length) score -= 850;
    if (!local.safe) score -= 550;
    if (calledRecently && !due) score -= 5000;
    if (["Done","Blocked / Data Issue"].includes(lane)) score -= 10000;

    return { merchant, st, issues, due, nextFu, calledToday, calledRecently, local, lane, laneClass, reason, score };
  }

  function sortedPriorityMerchants(now = new Date()) {
    return state.merchants.filter(m => !m.archived).map(m => deriveMerchant(m, now)).sort((a,b) => b.score - a.score);
  }

  function dayStats(dateKey) {
    const calls = state.calls.filter(c => dateKeyInZone(c.completedAt) === dateKey);
    const photos = state.photos.filter(p => dateKeyInZone(p.timestamp) === dateKey);
    const sales = state.sales.filter(p => dateKeyInZone(p.timestamp) === dateKey);
    const credits = state.credits.filter(p => dateKeyInZone(p.timestamp) === dateKey);
    const createdFollowups = state.followups.filter(f => dateKeyInZone(f.createdAt) === dateKey);
    const completedFollowups = state.followups.filter(f => f.completedAt && dateKeyInZone(f.completedAt) === dateKey);
    const touched = unique([...calls.map(x=>x.uid), ...photos.map(x=>x.uid), ...sales.map(x=>x.uid), ...credits.map(x=>x.uid)].filter(Boolean));
    const gmvTouched = touched.reduce((sum, uidValue) => sum + Number(getMerchant(uidValue)?.gmv || 0), 0);
    return {
      dateKey,
      calls,
      photos,
      sales,
      credits,
      createdFollowups,
      completedFollowups,
      realSec: calls.reduce((s,c)=>s+Number(c.durationSec||0),0),
      creditedSec: calls.reduce((s,c)=>s+Number(c.creditedSec||0),0),
      merchantsCalled: unique(calls.map(c=>c.uid).filter(Boolean)).length,
      attempts: calls.length,
      photosAdded: photos.reduce((s,p)=>s+Number(p.photosAdded||0),0),
      touched: touched.length,
      gmvTouched
    };
  }

  function rangeStats(startDate, days) {
    const result = [];
    for (let i = 0; i < days; i++) result.push(dayStats(toISODate(addDays(startDate, i))));
    return result;
  }

  function aggregateStats(items) {
    return items.reduce((acc, d) => {
      acc.realSec += d.realSec;
      acc.creditedSec += d.creditedSec;
      acc.calls += d.attempts;
      acc.merchants += d.merchantsCalled;
      acc.photos += d.photosAdded;
      acc.touched += d.touched;
      acc.gmv += d.gmvTouched;
      acc.followups += d.createdFollowups.length;
      acc.completedFollowups += d.completedFollowups.length;
      return acc;
    }, { realSec:0, creditedSec:0, calls:0, merchants:0, photos:0, touched:0, gmv:0, followups:0, completedFollowups:0 });
  }

  function hexToRgb(hex) {
    const clean = String(hex || "").replace("#", "");
    if (!/^[0-9a-f]{6}$/i.test(clean)) return [139,92,246];
    return [parseInt(clean.slice(0,2),16), parseInt(clean.slice(2,4),16), parseInt(clean.slice(4,6),16)];
  }

  function resolvePaletteKey(key) {
    const normalized = String(key || "").trim().toLowerCase();
    if (!normalized) return "custom";
    if (normalized === "custom") return "custom";
    if (PALETTE_PRESETS[normalized]) return normalized;
    if (PALETTE_PRESET_ALIASES[normalized] && PALETTE_PRESET_ALIASES[normalized] !== "custom") return PALETTE_PRESET_ALIASES[normalized];
    return "custom";
  }

  function detectPalettePreset(profile = state.profile) {
    const keys = ["background", "surface", "card", "text", "muted", "accent", "accent2"];
    const match = Object.entries(PALETTE_PRESETS).find(([, preset]) => keys.every(key => String(profile[key] || "").toLowerCase() === String(preset[key] || "").toLowerCase()));
    if (match) return match[0];
    return resolvePaletteKey(profile.palettePreset);
  }

  function applyPalettePreset(name, options = {}) {
    const presetKey = resolvePaletteKey(name);
    const preset = PALETTE_PRESETS[presetKey];
    if (!preset) return;
    Object.assign(state.profile, {
      palettePreset: presetKey,
      background: preset.background,
      surface: preset.surface,
      card: preset.card,
      text: preset.text,
      muted: preset.muted,
      accent: preset.accent,
      accent2: preset.accent2,
      line: preset.line,
      lineStrong: preset.lineStrong
    });
    scheduleSave();
    if (options.render !== false) renderApp();
    if (!options.silent) toast(`${preset.name} palette applied`);
  }


  function profileGifHistoryCards() {
    const history = Array.isArray(state.profile.avatarHistory) ? state.profile.avatarHistory : [];
    return history.length ? history.map(item => {
      const active = String(state.profile.avatar || "") === String(item.src || "");
      const created = item.createdAt ? formatDateTime(item.createdAt) : "Saved";
      const name = item.name || "Workspace GIF";
      return `<button class="wallpaper-card custom ${active ? "active" : ""}" type="button" data-use-profile-gif="${attr(item.id)}">
        <span class="wallpaper-card-media" style="background-image:url('${attr(item.src)}')"></span>
        <strong>${esc(name)}</strong>
        <small>${esc(created)}</small>
      </button>`;
    }).join("") : `<div class="empty-state"><strong>No GIF history yet</strong><span>Each new workspace GIF you use will stay here so you can switch back instantly.</span></div>`;
  }


  function processProfileGifHistory(src, name) {
    const cleanSrc = String(src || "").trim();
    const label = String(name || "Workspace GIF").trim() || "Workspace GIF";
    if (!cleanSrc || label === "Workspace GIF") return;
    const history = Array.isArray(state.profile.avatarHistory) ? state.profile.avatarHistory : [];
    if (history.some(item => String(item.src || "") === cleanSrc)) return;
    state.profile.avatarHistory = [{
      id: uid("gif"),
      src: cleanSrc,
      name: label,
      createdAt: new Date().toISOString()
    }, ...history].slice(0, 8);
  }

  function applyProfileGifHistory(id) {
    const history = Array.isArray(state.profile.avatarHistory) ? state.profile.avatarHistory : [];
    const item = history.find(x => String(x.id) === String(id));
    if (!item) return;
    if (state.profile.avatar && state.profile.avatar !== item.src) {
      processProfileGifHistory(state.profile.avatar, state.profile.avatarName);
    }
    state.profile.avatar = item.src;
    state.profile.avatarName = item.name || "Workspace GIF";
    scheduleSave();
    renderApp();
    toast(`Workspace GIF applied: ${item.name || "previous GIF"}`);
  }


  function createUniqueFollowupId(extraTaken = null) {
    const taken = new Set(state.followups.map(f => String(f?.id || "")).filter(Boolean));
    if (extraTaken) extraTaken.forEach(id => taken.add(String(id)));
    let candidate = "";
    do {
      candidate = globalThis.crypto?.randomUUID
        ? `followup_${globalThis.crypto.randomUUID()}`
        : uid("followup");
    } while (taken.has(candidate));
    return candidate;
  }

  function repairFollowupIds() {
    const seen = new Set();
    state.followups = state.followups.map(followup => {
      const record = normalizeFollowupRecord(followup);
      let id = String(record.id || "").trim();
      if (!id || seen.has(id)) id = createUniqueFollowupId(seen);
      seen.add(id);
      record.id = id;
      return record;
    });
    if (state.ui.selectedFollowupId && !state.followups.some(f => f.id === state.ui.selectedFollowupId)) {
      state.ui.selectedFollowupId = "";
    }
  }

  function migrateStateV4() {
    const previousVersion = Number(state.version || 0);
    state.version = APP_VERSION;
    if (!VIEW_META[state.currentView]) state.currentView = "dashboard";
    const legacyAurora = previousVersion < 8 &&
      String(state.profile.palettePreset || "").toLowerCase() === "aurora" &&
      String(state.profile.accent || "").toLowerCase() === "#39ff14" &&
      String(state.profile.accent2 || "").toLowerCase() === "#ff007f";
    if (legacyAurora) {
      Object.assign(state.profile, PALETTE_PRESETS.intelligence, {
        palettePreset: "intelligence"
      });
    }
    if (!state.profile.palettePreset) {
      const oldDefault = String(state.profile.accent || "").toLowerCase() === "#8b5cf6" && String(state.profile.background || "").toLowerCase() === "#070a12";
      if (oldDefault) {
        const preset = PALETTE_PRESETS.intelligence;
        Object.assign(state.profile, preset, { palettePreset:"intelligence" });
      } else {
        state.profile.palettePreset = detectPalettePreset(state.profile);
      }
    }
    state.profile.line ||= PALETTE_PRESETS[state.profile.palettePreset]?.line || "rgba(166,175,189,.18)";
    state.profile.lineStrong ||= PALETTE_PRESETS[state.profile.palettePreset]?.lineStrong || "rgba(166,175,189,.30)";
    state.settings.callGoal = Math.max(1, Number(state.settings.callGoal || 70));
    state.settings.photoGoal = Math.max(1, Number(state.settings.photoGoal || DEFAULT_PHOTO_GOAL));

    const [ar,ag,ab] = hexToRgb(p.accent);
    const [br,bg,bb] = hexToRgb(p.accent2);
    root.style.setProperty("--bg", p.background);
    root.style.setProperty("--bg-2", p.background);
    root.style.setProperty("--surface", p.surface);
    root.style.setProperty("--surface-2", p.card);
    root.style.setProperty("--card", p.card);
    root.style.setProperty("--card-2", p.card);
    root.style.setProperty("--text", p.text);
    root.style.setProperty("--muted", p.muted);
    root.style.setProperty("--muted-2", `color-mix(in srgb, ${p.muted} 68%, transparent)`);
    root.style.setProperty("--line", p.line || "rgba(166,175,189,.18)");
    root.style.setProperty("--line-strong", p.lineStrong || "rgba(166,175,189,.30)");
    root.style.setProperty("--accent", p.accent);
    root.style.setProperty("--accent-rgb", `${ar}, ${ag}, ${ab}`);
    root.style.setProperty("--accent-2", p.accent2);
    root.style.setProperty("--accent-2-rgb", `${br}, ${bg}, ${bb}`);
    document.body.dataset.palette = p.palettePreset || "custom";
    document.body.dataset.motion = p.motion || "smooth";
    const [lr,lg,lb] = hexToRgb(p.background);
    const perceivedLightness = .2126 * lr + .7152 * lg + .0722 * lb;
    const lightUi = perceivedLightness > 165;
    document.body.classList.toggle("light-ui", lightUi);
    root.style.colorScheme = lightUi ? "light" : "dark";
    document.body.classList.toggle("sidebar-collapsed", !!state.ui.sidebarCollapsed);

  function copyToClipboardSilently(value) {
    const text = String(value || "");
    if (!text) return Promise.resolve(false);
    const fallbackCopy = () => {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      let copied = false;
      try { copied = document.execCommand("copy"); } catch { copied = false; }
      ta.remove();
      return copied;
    };
    if (navigator.clipboard?.writeText) {
      return navigator.clipboard.writeText(text).then(() => true).catch(fallbackCopy);
    }
    return Promise.resolve(fallbackCopy());
  }

  async function openOutreachDialerForNumber(value) {
    const number = normalizedTelNumber(value);
    if (!number) return toast("No valid phone number was found");

    const width = 520;
    const height = Math.min(900, Math.max(720, window.screen?.availHeight ? window.screen.availHeight - 80 : 860));
    const left = Math.max(0, Math.round((window.screenX || 0) + Math.max(0, window.outerWidth - width - 22)));
    const top = Math.max(0, Math.round((window.screenY || 0) + 38));
    const features = `popup=yes,width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes`;

    let dialerWindow = null;
    try {
      dialerWindow = window.open(getOutreachDialerUrl(), "dashworkOutreachDialer", features);
      dialerWindow?.focus();
    } catch {
      dialerWindow = null;
    }

    const copied = await copyToClipboardSilently(number);
    if (!dialerWindow) {
      toast(copied
        ? `The Outreach popup was blocked. ${number} was copied; open Outreach and paste it into To.`
        : `The Outreach popup was blocked. Open Outreach and enter ${number}.`, 5200);
      return;
    }

    toast(copied
      ? `Outreach opened · ${number} copied. Paste it into the To field.`
      : `Outreach opened. Enter ${number} in the To field.`, 4800);
  }

    if (!value || key === "active" || key === "active / auto") return "active";
    if (key === "called") return "called";
    if (key === "no answer") return "no-answer";

  const CALL_BACK_DELAY_OPTIONS = [
    { value: "1d", label: "1 day", days: 1 },
    { value: "3d", label: "3 days", days: 3 },
    { value: "5d", label: "5 days", days: 5 },
    { value: "1w", label: "1 week", days: 7 },
    { value: "2w", label: "2 weeks", days: 14 }
  ];

  const CALL_BACK_WINDOW_OPTIONS = [
    { value: "all", label: "All recall windows" },
    { value: "overdue", label: "Overdue" },
    { value: "today", label: "Due today" },
    ...CALL_BACK_DELAY_OPTIONS.map(option => ({ value: option.value, label: `Due in ${option.label}` }))
  ];

  function normalizeCallBackDelay(value) {
    const found = CALL_BACK_DELAY_OPTIONS.find(option => option.value === String(value || "").trim());
    return found ? found.value : "3d";
  }

  function callBackDelayLabel(value) {
    const found = CALL_BACK_DELAY_OPTIONS.find(option => option.value === normalizeCallBackDelay(value));
    return found ? found.label : "3 days";
  }

  function callBackDelayDays(value) {
    const found = CALL_BACK_DELAY_OPTIONS.find(option => option.value === normalizeCallBackDelay(value));
    return found ? found.days : 3;
  }

  function callBackDueLabel(statusDate, value) {
    const base = statusDate ? localDateFromKey(statusDate) : new Date();
    return formatDate(addDays(base, callBackDelayDays(value)));
  }

  function merchantCallBackInfo(merchant, now = new Date()) {
    const st = merchantState(merchant?.uid);
    if (!st || st.status !== "Called" || !st.statusDate) return null;
    const delay = normalizeCallBackDelay(st.callBackDelay || "3d");
    const dueDate = addDays(localDateFromKey(st.statusDate), callBackDelayDays(delay));
    const daysRemaining = daysBetween(now, dueDate);
    return {
      delay,
      dueDate,
      dueLabel: formatDate(dueDate),
      dueKey: toISODate(dueDate),
      daysRemaining
    };
  }

  function callBackCountdownLabel(info) {
    if (!info) return "";
    if (info.daysRemaining < 0) {
      const days = Math.abs(info.daysRemaining);
      return `Overdue by ${days} day${days === 1 ? "" : "s"}`;
    }
    if (info.daysRemaining === 0) return "Call today";
    return `${info.daysRemaining} day${info.daysRemaining === 1 ? "" : "s"} left`;
  }

  function recallWindowMatches(info, value) {
    const key = String(value || "all");
    if (key === "all") return true;
    if (!info) return false;
    if (key === "overdue") return info.daysRemaining < 0;
    if (key === "today") return info.daysRemaining === 0;
    return info.daysRemaining === callBackDelayDays(key);
  }

  function priorityTone(priority) {
    const value = String(priority || "Medium").trim().toLowerCase();
    if (value === "critical") return "priority-critical";
    if (value === "high") return "priority-high";
    if (value === "low") return "priority-low";
    return "priority-medium";
  }

  function gmailComposeUrl({ to = "", subject = "", body = "" } = {}) {
    const params = new URLSearchParams();
    params.set("view", "cm");
    params.set("fs", "1");
    if (to) params.set("to", to);
    if (subject) params.set("su", subject);
    if (body) params.set("body", body);
    return `https://mail.google.com/mail/?${params.toString()}`;
  }

  function buildEmailRecapDraft(merchant) {
    const st = merchantState(merchant.uid);
    const dmName = String(merchant.dm_name || merchant.store_name || "there").trim();
    const latestCall = callsFor(merchant.uid).sort((a, b) => String(b.completedAt).localeCompare(String(a.completedAt)))[0];
    const latestFollowup = followupsFor(merchant.uid).filter(f => followupIsOpen(f)).sort((a, b) => String(a.updatedAt || a.createdAt).localeCompare(String(b.updatedAt || b.createdAt))).slice(-1)[0];
    const latestTimeline = merchantTimeline(merchant.uid)[0];
    const subject = st.emailRecapSubject || `DoorDash campaign next steps - ${merchant.store_name}`;
    const body = st.emailRecapBody || [
      `Hi ${dmName},`,
      ``,
      `I wanted to follow up on ${merchant.store_name}.`,
      ``,
      `What I captured:`,
      `- ${st.note || latestTimeline?.detail || latestCall?.note || "We reviewed the next step and timing."}`,
      latestFollowup ? `- Follow-up: ${latestFollowup.reason} on ${latestFollowup.date} at ${formatTime12(latestFollowup.time || "10:00")}.` : `- Next step: Please confirm the next step whenever convenient.`,
      ``,
      `Thank you,`,
      state.profile.username || "Workspace user"
    ].join("\n");
    return {
      to: splitMulti(merchant.dm_email)[0] || "",
      subject,
      body
    };

  function normalizePhoneType(value) {
    const v = normalizeText(value || "");
    if (!v) return "unknown";
    if ((v.includes("mobile") || v.includes("cell") || v.includes("cellular")) && (v.includes("work") || v.includes("office") || v.includes("business"))) return "multiple";
    if (v.includes("mobile") || v.includes("cell") || v.includes("cellular")) return "mobile";
    if (v.includes("work") || v.includes("office") || v.includes("business")) return "work";
    if (v.includes("voip")) return "unknown";
    return "unknown";
  }

  function phonesMatch(a, b) {
    const x = digits(a), y = digits(b);
    return !!x && !!y && (x === y || x.endsWith(y.slice(-10)) || y.endsWith(x.slice(-10)));
  }

  function merchantPhoneType(merchant) {
    if (!merchant) return "unknown";

    const explicitType = normalizePhoneType(merchant.dm_phone_type);
    if (explicitType !== "unknown") return explicitType;

    const mobile = splitMulti(merchant.dm_mobile_phone);
    const work = splitMulti(merchant.dm_work_phone);
    const merchantPhones = splitMulti(merchant.dm_phone);

    if (mobile.length || work.length) {
      const primary = merchantPhones[0] || "";
      const matched = [];
      if (mobile.some(p => !primary || phonesMatch(p, primary))) matched.push("mobile");
      if (work.some(p => !primary || phonesMatch(p, primary))) matched.push("work");
      if (matched.length === 1) return matched[0];
      if (matched.length > 1) return "multiple";
      if (mobile.length && !work.length) return "mobile";
      if (work.length && !mobile.length) return "work";
      return "multiple";
    }

    // Use explicit phone-type columns from matched call records when available.
    const linkedCalls = state.calls
      .filter(c => String(c.uid || "") === String(merchant.uid))
      .sort((a,b) => String(b.completedAt || b.createdAt || "").localeCompare(String(a.completedAt || a.createdAt || "")));

    const evidence = [];
    const candidates = merchantPhones.length ? merchantPhones : [];
    linkedCalls.forEach(call => {
      const callMobile = splitMulti(call.prospectMobilePhone || call.prospect_mobile_phone);
      const callWork = splitMulti(call.prospectWorkPhone || call.prospect_work_phone);
      if (candidates.length) {
        if (callMobile.some(p => candidates.some(mp => phonesMatch(p, mp)))) evidence.push("mobile");
        if (callWork.some(p => candidates.some(mp => phonesMatch(p, mp)))) evidence.push("work");
      } else {
        if (callMobile.length) evidence.push("mobile");
        if (callWork.length) evidence.push("work");
      }
    });

    const uniqueEvidence = unique(evidence);
    if (uniqueEvidence.length === 1) return uniqueEvidence[0];
    if (uniqueEvidence.length > 1) return "multiple";
    return "unknown";
  }

  function merchantPhoneTypeLabel(type) {

  function merchantPhoneTypeShort(type) {

  function buildWeeklyChart(items) {
    const values = items.map(x => x.creditedSec / 60);
    const max = Math.max(10, ...values);
    const w = 620, h = 170, padX = 22, padY = 22;
    const step = (w - padX * 2) / Math.max(1, values.length - 1);
    const points = values.map((v,i) => [padX + i * step, h - padY - (v / max) * (h - padY * 2)]);
    const line = points.map(p => p.join(",")).join(" ");
    const area = `${padX},${h-padY} ${line} ${w-padX},${h-padY}`;
    return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Weekly credited minutes chart">
      <defs><linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent)" stop-opacity=".58"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
      ${[.25,.5,.75,1].map(r => `<line class="chart-grid-line" x1="${padX}" y1="${h-padY-r*(h-padY*2)}" x2="${w-padX}" y2="${h-padY-r*(h-padY*2)}"/>`).join("")}
      <polygon class="chart-area" points="${area}"/>
      <polyline class="chart-line" points="${line}"/>
      ${points.map((p,i)=>`<circle class="chart-dot" cx="${p[0]}" cy="${p[1]}" r="4"/><text class="chart-label" x="${p[0]}" y="${h-5}" text-anchor="middle">${formatDate(localDateFromKey(items[i].dateKey),{weekday:"short",month:undefined,day:undefined,year:undefined})}</text>`).join("")}

  }

  function merchantLocalTimeBand(merchant, now = new Date()) {
    const zone = canonicalTz(merchant?.timezone);
    if (!zone) return "unknown";
    try {
      const time24 = safeIntl(zone, { hour:"2-digit", minute:"2-digit", hour12:false }, now);
      let [h, m] = time24.split(":").map(Number);
      if (h === 24) h = 0;
      if (!Number.isFinite(h) || !Number.isFinite(m)) return "unknown";
      const minutes = h * 60 + m;
      if (minutes < 600) return "before10";
      if (minutes < 720) return "10-12";
      if (minutes < 840) return "12-14";
      if (minutes < 960) return "14-16";
      if (minutes < 1080) return "16-18";
      return "18-plus";
    } catch {
      return "unknown";
    }
  }

  function photoCoverageMatches(merchant, filter) {
    if (filter === "all") return true;
    const raw = merchant?.photo_coverage;
    const hasData = raw !== null && raw !== undefined && raw !== "" && Number.isFinite(Number(raw));
    if (filter === "nodata") return !hasData;
    if (!hasData) return false;
    const coverage = Number(raw);
    if (filter === "under50") return coverage < 50;
    if (filter === "50plus") return coverage >= 50;
    return true;
  }

  function localTimeBandMatches(merchant, filter, now = new Date()) {
    if (filter === "all") return true;
    return merchantLocalTimeBand(merchant, now) === filter;

    return normalized === "voicemail" ||

      normalized.includes("left voice mail") ||
      normalized.includes("voice mail") ||
      normalized.includes("voicemail");

    if (!last) return filter === "none";
    const voicemail = isVoicemailDisposition(last.disposition || last.outcome || last.state);
    if (filter === "voicemail") return voicemail;
    if (filter === "notvoicemail") return !voicemail;
    if (filter === "none") return false;
    return true;
  }

  function workHubPageTokens(currentPage, totalPages) {
    if (totalPages <= 7) return Array.from({ length: totalPages }, (_, index) => index + 1);
    const tokens = [1];
    const start = Math.max(2, currentPage - 2);
    const end = Math.min(totalPages - 1, currentPage + 2);
    if (start > 2) tokens.push("ellipsis");
    for (let page = start; page <= end; page++) tokens.push(page);
    if (end < totalPages - 1) tokens.push("ellipsis");
    tokens.push(totalPages);
    return tokens;
  }

  function renderWorkHubPagination(currentPage, totalPages, totalItems) {
    const tokens = workHubPageTokens(currentPage, totalPages);
    const disabledPrev = currentPage <= 1 ? "disabled" : "";
    const disabledNext = currentPage >= totalPages ? "disabled" : "";
    return `<footer class="queue-pagination" aria-label="Call Board pagination">
      <span class="queue-page-meta">Page ${currentPage} of ${totalPages} · ${totalItems} merchant${totalItems === 1 ? "" : "s"}</span>
      <div class="queue-page-controls">
        <button class="queue-page-btn" type="button" data-workhub-page="1" ${disabledPrev} aria-label="First page" title="First page">«</button>
        <button class="queue-page-btn" type="button" data-workhub-page="${Math.max(1, currentPage - 1)}" ${disabledPrev} aria-label="Previous page" title="Previous page">‹</button>
        ${tokens.map(token => token === "ellipsis"
          ? `<span class="queue-page-ellipsis" aria-hidden="true">…</span>`
          : `<button class="queue-page-btn ${token === currentPage ? "active" : ""}" type="button" data-workhub-page="${token}" ${token === currentPage ? 'aria-current="page"' : ""}>${token}</button>`).join("")}
        <button class="queue-page-btn" type="button" data-workhub-page="${Math.min(totalPages, currentPage + 1)}" ${disabledNext} aria-label="Next page" title="Next page">›</button>
        <button class="queue-page-btn" type="button" data-workhub-page="${totalPages}" ${disabledNext} aria-label="Last page" title="Last page">»</button>
      </div>
    </footer>`;
  }

  function workHubRecommendation(merchant, d = deriveMerchant(merchant)) {
    const st = merchantState(merchant.uid);
    if (d.due) return {
      title: `Complete ${d.due.reason || "the pending follow-up"}`,
      detail: `Due ${d.due.date || "today"}${d.due.time ? ` at ${d.due.time}` : ""}. Review the previous note before contacting the merchant.`,
      tone: "orange"
    };
    if (st.status === "No Answer") return {
      title: "Prepare the next call attempt",
      detail: "Confirm the local call window, review the latest note and use a different contact route when available.",
      tone: "orange"
    };
    if (st.status === "Waiting on Merchant") return {
      title: "Check the merchant commitment",
      detail: "Review what the merchant agreed to send or complete, then schedule a precise follow-up window.",
      tone: "purple"
    };
    if (merchant.photo_coverage == null || Number(merchant.photo_coverage) < 50) return {
      title: "Prioritize photo coverage",
      detail: "Low visual coverage is the clearest conversion opportunity. Confirm permission and identify the highest-impact menu items.",
      tone: "blue"
    };
    if (merchant.promo_opp) return {
      title: "Open a promotion conversation",
      detail: "Use the promo calculator to frame the offer, investment split and expected customer value before the call.",
      tone: "purple"
    };
    if (merchant.sl_opp) return {
      title: "Propose Sponsored Listings",
      detail: "Review budget, cost per order and measurement expectations, then document the next review date.",
      tone: "blue"
    };
    return {
      title: "Strengthen the relationship",
      detail: "Review recent activity, identify one measurable improvement and leave the merchant with a clear next action.",
      tone: "green"
    };
  }

  function renderWorkHub() {
    const activeMerchants = state.merchants.filter(m => !m.archived);

    const markets = unique(activeMerchants.map(m=>m.market_name)).sort();

      const d = deriveMerchant(m, now);
      return { ...d, recall: merchantCallBackInfo(m, now) };
    });
    const q = normalizeText(filters.q);
    const buildQueue = (ignoreView = false) => baseQueue.filter(d => {
      const m = d.merchant;

        (filters.view === "due" && !!d.due) ||
        (filters.view === "photo" && (content.photo === "Approved" || !!st.hasPhotos)) ||
        (filters.view === "noanswer" && st.status === "No Answer") ||
        (filters.view === "spoke" && st.status === "Spoke");
      const recallOk = recallWindowMatches(d.recall, filters.recall);
      const localTimeOk = localTimeBandMatches(m, filters.localTimeBand, now);
      const photoCoverageOk = photoCoverageMatches(m, filters.photoCoverage);
      const lastInteractionOk = lastInteractionFilterMatches(m, filters.lastInteraction);
      return (!q || hay.includes(q)) &&
        (filters.market === "all" || m.market_name === filters.market) &&
        (filters.video === "all" || content.video === filters.video) &&
        (filters.photo === "all" || content.photo === filters.photo) &&
        (filters.contact === "all" || content.contact === filters.contact) &&
        phoneTypeFilterMatches(m, filters.phoneType) &&
        recallOk &&
        localTimeOk &&
        photoCoverageOk &&
        lastInteractionOk &&

    let queue = buildQueue(false)
      .sort((a, b) => {

            ${filters.lastInteraction === "voicemail" ? `<span class="smart-filter-hint">Shows merchants whose most recent call was marked as a voicemail.</span>` : ""}
          </div>
        </div>
        <div class="queue-scroll call-board-page" style="margin-top:10px">${queue.length ? visibleQueue.map(x=>merchantRowHTML(x)).join("") : `<div class="empty-state"><strong>No matches</strong><span>Change the queue filters.</span></div>`}</div>
