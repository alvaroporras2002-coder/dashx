<!-- =========================================================
     DASHWORK — MÓDULO DE MEJORAS UI / UX (Pegar antes de </body>)
     ========================================================= -->
<style id="dashworkUpgradesCSS">
  /* 1. Tipografía moderna y radios unificados */
  :root {
    --radius-sm: 6px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius: var(--radius-lg);
    --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-serif: Georgia, 'Cambria', 'Times New Roman', serif;
  }

  body {
    font-family: var(--font-sans) !important;
    font-size: 13.5px !important;
    line-height: 1.55 !important;
  }

  h1, h2, h3, h4,
  .fu-nova-hero h2,
  .fu-nova-panel-head h3,
  .case-record-title,
  .email-recap-title {
    font-family: var(--font-serif) !important;
  }

  /* 2. Legibilidad: tamaño mínimo de 11px en textos operativos */
  .nav-count,
  .eyebrow,
  .card-kicker,
  .merchant-row-sub,
  .merchant-row-sub-2,
  .local-clock span,
  .brand-copy span,
  .operative-save-status,
  .operative-keycap,
  .x-metric > span,
  .x-metric > small {
    font-size: 11px !important;
    line-height: 1.4 !important;
  }

  /* 3. Contraste corregido en Modo Oscuro para la tarjeta principal */
  body:not(.bento-light) .x-next-action {
    background: linear-gradient(135deg, #3c349e 0%, #262066 100%) !important;
    border: 1px solid rgba(163, 155, 242, 0.35) !important;
    color: #f8fafc !important;
  }
  body:not(.bento-light) .x-next-action .x-command-kicker,
  body:not(.bento-light) .x-next-action p,
  body:not(.bento-light) .x-next-action .x-signal-grid span {
    color: rgba(248, 250, 252, 0.82) !important;
  }
  body:not(.bento-light) .x-next-action .btn.primary {
    background: #f8fafc !important;
    color: #262066 !important;
    border-color: #f8fafc !important;
  }

  /* 4. Unificación de radios y menos scroll horizontal en laptops */
  .panel, .bento-card, .surface-card, .x-metric, .kpi-tile {
    border-radius: var(--radius-lg) !important;
  }
  .btn, .nav-btn, .merchant-row, input, select, textarea {
    border-radius: var(--radius-sm) !important;
  }
  @media (max-width: 1440px) {
    .fu-nova-week {
      min-width: 0 !important;
      grid-template-columns: repeat(7, minmax(110px, 1fr)) !important;
    }
    .fu-nova-month {
      min-width: 0 !important;
      grid-template-columns: repeat(7, minmax(95px, 1fr)) !important;
    }
    table {
      min-width: 600px !important;
    }
  }

  /* 5. Barra de plantillas rápidas de notas (1 clic) */
  .dw-quick-notes {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
  }
  .dw-quick-notes-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    margin-right: 4px;
  }
  .dw-qbtn {
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: background 160ms ease, border-color 160ms ease;
  }
  .dw-qbtn:hover {
    background: var(--soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* 6. Indicador de estado de Backup en el sidebar */
  .dw-backup-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 6px;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    font-size: 11px;
    font-weight: 600;
  }
  .dw-backup-ok {
    background: color-mix(in srgb, var(--green) 12%, var(--surface));
    color: var(--green);
  }
  .dw-backup-warn {
    background: color-mix(in srgb, var(--orange) 14%, var(--surface));
    color: var(--orange);
  }
</style>

<script id="dashworkUpgradesJS">
(() => {
  "use strict";

  /* --- A. Sonidos sintetizados ligeros (Web Audio API, 0 KB) --- */
  window.playDashworkTone = (type = "complete") => {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      const now = ctx.currentTime;
      if (type === "delete") {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.14);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.16);
      } else {
        osc.type = "sine";
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
        gain.gain.setValueAtTime(0.07, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.start(now);
        osc.stop(now + 0.23);
      }
    } catch (_) {}
  };

  /* --- B. Helper para mostrar notificaciones en tu #toast existente --- */
  const showQuickToast = (msg) => {
    const toast = document.getElementById("toast");
    if (!toast) return;
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(window.__dwToastTimer);
    window.__dwToastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
  };

  /* --- C. Plantillas de notas con 1 clic sobre #manualCallNote --- */
  const NOTE_TEMPLATES = [
    {
      label: "Voicemail",
      text: "• Reason of Call: Follow Up\n• Key Points / Concerns: Left voicemail introducing myself and reason for outreach.\n• Actions Taken: Sent recap email with direct contact info.\n• Next Steps: Follow up in 2 business days."
    },
    {
      label: "DM no disponible",
      text: "• Reason of Call: Account Check-in\n• Key Points / Concerns: Spoke with GK; Decision Maker not available.\n• Actions Taken: Confirmed best hours to reach DM.\n• Next Steps: Retry call at suggested time."
    },
    {
      label: "Pidió Callback",
      text: "• Reason of Call: Optimization / Promo Review\n• Key Points / Concerns: DM busy during service rush, requested callback.\n• Actions Taken: Scheduled follow-up reminder.\n• Next Steps: Call back at agreed date/time."
    },
    {
      label: "Interesado / Promo",
      text: "• Reason of Call: Growth & Promotions\n• Key Points / Concerns: DM interested in running a campaign / improving menu photos.\n• Actions Taken: Reviewed options and shared estimate.\n• Next Steps: Confirm launch details via email."
    }
  ];

  const injectNoteTemplates = () => {
    const textarea = document.getElementById("manualCallNote");
    if (!textarea || textarea.dataset.dwTemplatesAttached) return;
    textarea.dataset.dwTemplatesAttached = "1";

    const bar = document.createElement("div");
    bar.className = "dw-quick-notes";
    bar.innerHTML = `<span class="dw-quick-notes-label">Plantillas rápidas:</span>`;

    NOTE_TEMPLATES.forEach((tpl) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "dw-qbtn";
      btn.textContent = tpl.label;
      btn.addEventListener("click", () => {
        textarea.value = tpl.text;
        textarea.dispatchEvent(new Event("input", { bubbles: true }));
        textarea.dispatchEvent(new Event("change", { bubbles: true }));
        textarea.focus();
        window.playDashworkTone("complete");
        showQuickToast(`Plantilla "${tpl.label}" aplicada`);
      });
      bar.appendChild(btn);
    });

    textarea.parentNode.insertBefore(bar, textarea);
  };

  const viewHost = document.getElementById("viewHost");
  if (viewHost) {
    new MutationObserver(injectNoteTemplates).observe(viewHost, {
      childList: true,
      subtree: true
    });
    injectNoteTemplates();
  }

  /* --- D. Indicador de Respaldo Local (Backup JSON) --- */
  const BACKUP_KEY = "dashwork_last_backup_ts";
  const renderBackupStatus = () => {
    const statusEl = document.querySelector(".operative-save-status");
    if (!statusEl) return;

    let badge = document.getElementById("dwBackupBadge");
    if (!badge) {
      badge = document.createElement("div");
      badge.id = "dwBackupBadge";
      badge.className = "dw-backup-badge";
      statusEl.parentNode.insertBefore(badge, statusEl.nextSibling);
    }

    const lastTs = Number(localStorage.getItem(BACKUP_KEY) || 0);
    const daysAgo = lastTs ? Math.floor((Date.now() - lastTs) / 86400000) : 999;

    if (!lastTs || daysAgo >= 7) {
      badge.className = "dw-backup-badge dw-backup-warn";
      badge.textContent = lastTs
        ? `⚠ Backup hace ${daysAgo} días`
        : "⚠ Sin respaldo reciente";
    } else {
      badge.className = "dw-backup-badge dw-backup-ok";
      badge.textContent = daysAgo === 0 ? "✓ Backup hoy" : `✓ Backup hace ${daysAgo}d`;
    }
  };

  // Detecta cuando el usuario hace clic en exportar/respaldar backup
  document.addEventListener("click", (e) => {
    const btn = e.target.closest("button, a");
    if (!btn) return;
    const txt = (btn.textContent || "").toLowerCase();
    if (txt.includes("backup") || txt.includes("export")) {
      localStorage.setItem(BACKUP_KEY, String(Date.now()));
      renderBackupStatus();
    }
  });
  renderBackupStatus();

  /* --- E. Atajos de teclado rápidos (sin interferir al escribir) --- */
  document.addEventListener("keydown", (e) => {
    const tag = (document.activeElement?.tagName || "").toUpperCase();
    const isTyping = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || document.activeElement?.isContentEditable;
    if (isTyping || e.ctrlKey || e.metaKey || e.altKey) return;

    const key = e.key.toLowerCase();

    if (key === "n") {
      const note = document.getElementById("manualCallNote");
      if (note) {
        e.preventDefault();
        note.focus();
        note.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    } else if (key === "f") {
      const fuBtn = document.querySelector('#navList button[data-view="followups"], #novaBottomNav button[data-nav="followups"]');
      if (fuBtn) {
        e.preventDefault();
        fuBtn.click();
      }
    } else if (key === "j" || key === "k") {
      const rows = Array.from(document.querySelectorAll(".merchant-row"));
      if (!rows.length) return;
      e.preventDefault();
      const currentIdx = rows.findIndex((r) => r.classList.contains("selected"));
      const nextIdx = key === "j"
        ? Math.min(rows.length - 1, currentIdx + 1)
        : Math.max(0, currentIdx - 1);
      const target = rows[nextIdx]?.querySelector(".merchant-row-main") || rows[nextIdx];
      target?.click();
      rows[nextIdx]?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    } else if (key === "?") {
      showQuickToast("Atajos: [Ctrl+K] Buscar · [N] Nota · [F] Follow-ups · [J/K] Siguiente/Anterior");
    }
  });
})();
</script>
