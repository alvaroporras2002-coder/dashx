  function casesFor(uidValue) {
    return (Array.isArray(state.cases) ? state.cases : []).filter(item => String(item.uid) === String(uidValue));
  }

  function caseTypeLabel(value) {
    return CASE_TYPE_LABELS[value] || value || "Case";
  }

  function caseStatusTone(status) {
    const value = normalizeText(status);
    if (value === "open") return "case-tone-open";
    if (value === "pending") return "case-tone-pending";
    if (value === "escalated") return "case-tone-escalated";
    if (value === "solved") return "case-tone-solved";
    if (value === "closed") return "case-tone-closed";
    return "case-tone-waiting";
  }

  function caseStatusPill(status) {
    const safe = CASE_STATUSES.includes(status) ? status : "Open";
    return `<span class="case-status-pill ${caseStatusTone(safe)}">${esc(safe)}</span>`;
  }

  function caseTodayISO() {
    const date = new Date();
    const offset = date.getTimezoneOffset();
    return new Date(date.getTime() - offset * 60000).toISOString().slice(0, 10);
  }

  function formatCaseDate(value) {
    if (!value) return "—";
    const date = new Date(`${value}T12:00:00`);
    if (Number.isNaN(date.getTime())) return String(value);
    return new Intl.DateTimeFormat("en-CA", { year:"numeric", month:"short", day:"numeric" }).format(date);
  }

  function normalizeCaseUrl(value) {
    const raw = String(value || "").trim();
    if (!raw) return "";
    return /^https?:\/\//i.test(raw) ? raw : `https://${raw}`;
  }

  function isValidCaseHttpUrl(value) {
    try {
      const url = new URL(normalizeCaseUrl(value));
      return url.protocol === "http:" || url.protocol === "https:";
    } catch {
      return false;
    }
  }

  function formatCaseBytes(bytes) {
    const value = Math.max(0, Number(bytes || 0));
    if (!value) return "0 B";
    const units = ["B", "KB", "MB", "GB"];
    const index = Math.min(units.length - 1, Math.floor(Math.log(value) / Math.log(1024)));
    return `${(value / Math.pow(1024, index)).toFixed(index ? 1 : 0)} ${units[index]}`;
  }

  function makeCaseDisplayId() {
    const date = new Date();
    const stamp = `${date.getFullYear()}${String(date.getMonth()+1).padStart(2,"0")}${String(date.getDate()).padStart(2,"0")}`;
    const existing = (state.cases || []).filter(item => String(item.displayId || "").startsWith(`CASE-${stamp}-`)).length + 1;
    return `CASE-${stamp}-${String(existing).padStart(3,"0")}`;
  }

  function readCaseFilters() {
    return {
      q: document.getElementById("caseSearch")?.value || "",
      type: document.getElementById("caseTypeFilter")?.value || "all",
      status: document.getElementById("caseStatusFilter")?.value || "all",
      category: document.getElementById("caseCategoryFilter")?.value || "all"
    };
  }

  function caseSearchText(record) {
    return normalizeText([
      record.displayId,
      record.externalCaseNumber,
      record.status,
      caseTypeLabel(record.caseType),
      record.caseUrl,
      record.merchant?.name,
      record.merchant?.merchantId,
      record.merchant?.storeIds,
      record.merchant?.marketRegion,
      record.merchant?.accountManager,
      record.merchant?.contactName,
      record.merchant?.contactEmail,
      record.am?.category,
      record.menu?.briefDescription,
      record.menu?.menuSourceNotes,
      record.internalNotes
    ].join(" "));
  }

  function caseCardDetail(record) {
    if (record.caseType === "am") return record.am?.category || "Account issue category not set";
    if (record.caseType === "menu") {
      const menu = record.menu || {};
      return menu.briefDescription || [menu.permanence, menu.goLiveTiming].filter(Boolean).join(" · ") || "Menu update details";
    }
    return "Case link only";
  }

  function caseCardHTML(record) {
    const updated = record.updatedAt || record.createdAt;
    const category = record.caseType === "am" ? record.am?.category : record.caseType === "menu" ? "Menu update" : "Photo processing";
    return `<article class="case-record-card" data-case-card="${attr(record.id)}">
      <div class="case-record-top">
        <div>
          <div class="case-record-id">${esc(record.displayId || record.id)}</div>
          <div class="case-record-title">${esc(caseTypeLabel(record.caseType))}</div>
          <div class="case-record-sub">${esc(caseCardDetail(record))}</div>
        </div>
        ${caseStatusPill(record.status)}
      </div>
      <div class="case-record-details">
        <div class="case-record-detail"><span>Category</span><strong>${esc(category || "—")}</strong></div>
        <div class="case-record-detail"><span>Case date</span><strong>${esc(formatCaseDate(record.createdDate))}</strong></div>
        <div class="case-record-detail"><span>Case number</span><strong>${esc(record.externalCaseNumber || "—")}</strong></div>
        <div class="case-record-detail"><span>Updated</span><strong>${esc(updated ? formatDateTime(updated) : "—")}</strong></div>
      </div>
      <div class="case-record-controls">
        <div class="field"><label>Status</label><select class="case-status-select" data-case-status="${attr(record.id)}">${CASE_STATUSES.map(status => `<option value="${attr(status)}" ${record.status === status ? "selected" : ""}>${esc(status)}</option>`).join("")}</select></div>
        <div class="button-row">
          <button class="btn small ghost" type="button" data-view-case="${attr(record.id)}">View</button>
          <button class="btn small blue" type="button" data-edit-case="${attr(record.id)}">Edit</button>
          <a class="btn small green" href="${attr(normalizeCaseUrl(record.caseUrl))}" target="_blank" rel="noopener noreferrer">Link</a>
        </div>
      </div>
    </article>`;
  }

  function renderCasesTool(merchant) {
    const filters = { q:"", type:"all", status:"all", category:"all", ...(state.ui.caseFilters || {}) };
    const records = casesFor(merchant.uid).slice().sort((a,b) => String(b.updatedAt || b.createdAt || "").localeCompare(String(a.updatedAt || a.createdAt || "")));
    const q = normalizeText(filters.q);
    const filtered = records.filter(record => {
      if (q && !caseSearchText(record).includes(q)) return false;
      if (filters.type !== "all" && record.caseType !== filters.type) return false;
      if (filters.status !== "all" && record.status !== filters.status) return false;
      if (filters.category !== "all" && record.am?.category !== filters.category) return false;
      return true;
    });
    const open = records.filter(record => ["Open", "Pending"].includes(record.status)).length;
    const attention = records.filter(record => ["Escalated", "Waiting for DD Internal Team"].includes(record.status)).length;
    const complete = records.filter(record => ["Solved", "Closed"].includes(record.status)).length;
    return `<div class="case-tool-shell">
      <section class="case-tool-hero">
        <div class="case-tool-hero-head">
          <div><div class="case-tool-kicker">Merchant cases</div><h3>Track every support case</h3><p>Create, filter, view, edit and update cases for ${esc(merchant.store_name)}.</p></div>
          ${caseStatusPill(records[0]?.status || "Open")}
        </div>
        <div class="case-tool-actions">
          <button class="btn primary" type="button" data-action="newCaseRecord">New case</button>
          <button class="btn ghost" type="button" data-action="exportMerchantCasesJson" ${records.length ? "" : "disabled"}>Export JSON</button>
          <button class="btn ghost" type="button" data-action="exportMerchantCasesCsv" ${records.length ? "" : "disabled"}>Export CSV</button>
          <button class="btn ghost" type="button" data-action="importMerchantCases">Import</button>
        </div>
        <div class="case-stat-grid">
          <div class="case-stat"><span>Open</span><strong>${open}</strong></div>
          <div class="case-stat"><span>Attention</span><strong>${attention}</strong></div>
          <div class="case-stat"><span>Completed</span><strong>${complete}</strong></div>
        </div>
      </section>

      <section class="case-filter-card">
        <div class="case-filter-grid">
          <div class="field"><label>Search cases</label><input id="caseSearch" value="${attr(filters.q)}" placeholder="Case ID, link, category, notes…" /></div>
          <div class="field"><label>Type</label><select id="caseTypeFilter"><option value="all">All types</option>${Object.entries(CASE_TYPE_LABELS).map(([value,label]) => `<option value="${attr(value)}" ${filters.type === value ? "selected" : ""}>${esc(label)}</option>`).join("")}</select></div>
          <div class="field"><label>Status</label><select id="caseStatusFilter"><option value="all">All statuses</option>${CASE_STATUSES.map(status => `<option value="${attr(status)}" ${filters.status === status ? "selected" : ""}>${esc(status)}</option>`).join("")}</select></div>
          <div class="field"><label>Account Issue Category</label><select id="caseCategoryFilter"><option value="all">All categories</option>${CASE_ACCOUNT_CATEGORIES.map(category => `<option value="${attr(category)}" ${filters.category === category ? "selected" : ""}>${esc(category)}</option>`).join("")}</select></div>
        </div>
      </section>

      <div class="case-results-head"><strong>Case records</strong><span class="case-results-meta">${filtered.length} of ${records.length}</span></div>
      <div class="case-record-list">${filtered.length ? filtered.map(caseCardHTML).join("") : `<div class="empty-state" style="min-height:150px"><strong>${records.length ? "No cases match these filters" : "No cases for this merchant"}</strong><span>${records.length ? "Change the case filters." : "Create the first AM, menu update or photo processing case."}</span></div>`}</div>
    </div>`;
  }

  function caseInputValue(id) {
    return String(document.getElementById(id)?.value || "").trim();
  }

  function caseCheckedValues(name) {
    return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(input => input.value);
  }

  function caseCheckGrid(name, values, selected = []) {
    const set = new Set(Array.isArray(selected) ? selected : []);
    return `<div class="case-checkbox-grid">${values.map(value => `<label class="case-check"><input type="checkbox" name="${attr(name)}" value="${attr(value)}" ${set.has(value) ? "checked" : ""}/><span>${esc(value)}</span></label>`).join("")}</div>`;
  }

  function caseEditorMerchantSnapshot(merchant, existing) {
    const current = existing?.merchant || {};
    return {
      name: current.name || merchant.store_name || merchant.business_name || "",
      merchantId: current.merchantId || merchant.ddmx_account_id || merchant.merchant_id || merchant.business_id || "",
      storeIds: current.storeIds || merchant.store_id || "",
      marketRegion: current.marketRegion || [merchant.market_name, merchant.region_name].filter(Boolean).join(" · "),
      accountManager: current.accountManager || merchant.account_owner || state.profile.username || "",
      contactName: current.contactName || merchant.dm_name || "",
      contactEmail: current.contactEmail || splitMulti(merchant.dm_email)[0] || "",
      contactPhone: current.contactPhone || splitMulti(merchant.dm_phone)[0] || ""
    };
  }

    const record = existing || {};
    const type = record.caseType || "am";
    const status = CASE_STATUSES.includes(record.status) ? record.status : "Open";
    const snapshot = caseEditorMerchantSnapshot(merchant, record);
    const menu = record.menu || {};
    const am = record.am || {};
    caseAttachmentDraft = Array.isArray(menu.attachments) ? menu.attachments.map(file => ({ ...file })) : [];

      <section class="case-editor-section">
        <div class="case-editor-section-head"><div><h3>Case information</h3><p>Choose the workflow. The form changes automatically based on the case type.</p></div>${record.displayId ? caseStatusPill(status) : `<span class="pill blue">New record</span>`}</div>
        <div class="form-grid">
          <div class="field c4"><label class="case-required">Type Of Case</label><select id="caseEditorType">${Object.entries(CASE_TYPE_LABELS).map(([value,label]) => `<option value="${attr(value)}" ${type === value ? "selected" : ""}>${esc(label)}</option>`).join("")}</select></div>
          <div class="field c4"><label class="case-required">Status</label><select id="caseEditorStatus">${CASE_STATUSES.map(value => `<option value="${attr(value)}" ${status === value ? "selected" : ""}>${esc(value)}</option>`).join("")}</select></div>
          <div class="field c4"><label class="case-required">Case date</label><input id="caseEditorCreatedDate" type="date" value="${attr(record.createdDate || caseTodayISO())}" /></div>
          <div class="field c8"><label class="case-required">URL / Link of the case</label><input id="caseEditorCaseUrl" type="url" value="${attr(record.caseUrl || "")}" placeholder="https://…" /></div>
          <div class="field c4"><label>External Case Number</label><input id="caseEditorExternalNumber" value="${attr(record.externalCaseNumber || "")}" placeholder="Optional" /></div>
        </div>
      </section>

      <section class="case-editor-section">
        <div class="case-editor-section-head"><div><h3>Merchant information</h3><p>Prefilled from the active merchant. Edit the snapshot when the case needs different details.</p></div><span class="pill">${esc(merchant.store_id || "No Store ID")}</span></div>
        <div class="form-grid">
          <div class="field c6"><label class="case-required">Merchant Name</label><input id="caseEditorMerchantName" value="${attr(snapshot.name)}" /></div>
          <div class="field c3"><label>Merchant ID</label><input id="caseEditorMerchantId" value="${attr(snapshot.merchantId)}" /></div>
          <div class="field c3"><label>Store ID(s)</label><input id="caseEditorStoreIds" value="${attr(snapshot.storeIds)}" /></div>
          <div class="field c4"><label>Market / Region</label><input id="caseEditorMarket" value="${attr(snapshot.marketRegion)}" /></div>
          <div class="field c4"><label>Account Manager</label><input id="caseEditorAccountManager" value="${attr(snapshot.accountManager)}" /></div>
          <div class="field c4"><label>Merchant Contact</label><input id="caseEditorContactName" value="${attr(snapshot.contactName)}" /></div>
          <div class="field c6"><label>Contact Email</label><input id="caseEditorContactEmail" type="email" value="${attr(snapshot.contactEmail)}" /></div>
          <div class="field c6"><label>Contact Phone</label><input id="caseEditorContactPhone" value="${attr(snapshot.contactPhone)}" /></div>
        </div>
      </section>

      <section class="case-editor-section" id="caseEditorAmSection">
        <div class="case-editor-section-head"><div><h3>AM Case</h3><p>Select the Account Issue Category from the options captured in the original case form.</p></div></div>
        <div class="field"><label class="case-required">Account Issue Category</label><select id="caseEditorCategory"><option value="">Select a category</option>${CASE_ACCOUNT_CATEGORIES.map(category => `<option value="${attr(category)}" ${am.category === category ? "selected" : ""}>${esc(category)}</option>`).join("")}</select></div>
      </section>

      <section class="case-editor-section" id="caseEditorMenuSection">
        <div class="case-editor-section-head"><div><h3>Menu Update Case</h3><p>Operational timing, locations, update scope, menu source information and closing details.</p></div></div>
        <div class="form-grid">
          <div class="field c6"><label class="case-required">Temporary or Permanent?</label><select id="caseEditorPermanence"><option value="">Select</option><option ${menu.permanence === "Permanent" ? "selected" : ""}>Permanent</option><option ${menu.permanence === "Temporary" ? "selected" : ""}>Temporary</option></select></div>
          <div class="field c6"><label class="case-required">When Should Changes Go Live?</label><select id="caseEditorGoLiveTiming"><option value="">Select</option><option ${menu.goLiveTiming === "ASAP" ? "selected" : ""}>ASAP</option><option ${menu.goLiveTiming === "Future Date" ? "selected" : ""}>Future Date</option></select></div>
          <div class="field c4 case-conditional-row" id="caseEditorGoLiveDateField"><label class="case-required">Go Live Date</label><input id="caseEditorGoLiveDate" type="date" value="${attr(menu.goLiveDate || "")}" /></div>
          <div class="field c4 case-conditional-row" id="caseEditorDueDateField"><label class="case-required">Due Date</label><input id="caseEditorDueDate" type="date" value="${attr(menu.dueDate || "")}" /></div>
          <div class="field c4 case-conditional-row" id="caseEditorRevertDateField"><label class="case-required">Date to Revert Changes</label><input id="caseEditorRevertDate" type="date" value="${attr(menu.revertDate || "")}" /></div>
          <div class="field c6"><label class="case-required">Single/Multi Location Update?</label><select id="caseEditorLocationScope"><option value="">Select</option><option ${menu.locationScope === "Multiple Locations" ? "selected" : ""}>Multiple Locations</option><option ${menu.locationScope === "Single Location" ? "selected" : ""}>Single Location</option><option ${menu.locationScope === "All Stores" ? "selected" : ""}>All Stores</option></select></div>
          <div class="field c6 case-conditional-row" id="caseEditorLocationDetailsField"><label class="case-required">Location / Store ID details</label><input id="caseEditorLocationDetails" value="${attr(menu.locationDetails || "")}" placeholder="Store IDs or affected locations" /></div>
        </div>

        <div class="case-checkbox-block"><div class="case-checkbox-title case-required">Type of Update</div>${caseCheckGrid("caseUpdateType", CASE_MENU_UPDATE_TYPES, menu.updateTypes)}</div>
        <div class="case-checkbox-block"><div class="case-checkbox-title case-required">Update Details</div>${caseCheckGrid("caseUpdateDetail", CASE_MENU_UPDATE_DETAILS, menu.updateDetails)}</div>
        <div class="case-checkbox-block"><div class="case-checkbox-title case-required">Menu(s) Affected</div>${caseCheckGrid("caseMenuAffected", CASE_MENUS_AFFECTED, menu.menusAffected)}</div>
        <label class="case-check"><input id="caseEditorDdfb" type="checkbox" ${menu.ddfbMenu ? "checked" : ""}/><span>This is a DDFB menu</span></label>

        <div class="divider"></div>
        <div class="case-editor-section-head"><div><h3>Menu Source Updates</h3><p>Add the source links and any notes the internal team needs.</p></div></div>
        <div class="form-grid">
          <div class="field c6"><label>Menu Source URL</label><input id="caseEditorMenuUrl1" type="url" value="${attr(menu.menuSourceUrl1 || "")}" placeholder="https://…" /></div>
          <div class="field c6"><label>Menu Source URL 2</label><input id="caseEditorMenuUrl2" type="url" value="${attr(menu.menuSourceUrl2 || "")}" placeholder="https://…" /></div>
          <div class="field c12"><label>Menu Source Notes</label><textarea id="caseEditorMenuNotes" placeholder="Source instructions, credentials not included, special notes…">${esc(menu.menuSourceNotes || "")}</textarea></div>
        </div>

        <div class="divider"></div>
        <div class="case-editor-section-head"><div><h3>Closing Information</h3><p>Summarize the request and identify who should be contacted when complete.</p></div></div>
        <div class="form-grid">
          <div class="field c12"><label class="case-required">Brief description of update</label><textarea id="caseEditorBrief" placeholder="Describe the exact menu update…">${esc(menu.briefDescription || "")}</textarea></div>
          <div class="field c6"><label class="case-required">Who To Contact When Complete</label><input id="caseEditorCompletionContact" value="${attr(menu.completionContact || snapshot.contactName)}" /></div>
          <div class="field c6"><label>Completion Contact Email</label><input id="caseEditorCompletionEmail" type="email" value="${attr(menu.completionContactEmail || snapshot.contactEmail)}" /></div>
        </div>
        <div class="case-attachment-zone"><strong>Attachments</strong><span>Store file names and metadata with this local record.</span><label class="btn small blue" for="caseEditorAttachments">Select files</label><input id="caseEditorAttachments" type="file" multiple hidden /></div>
        <div class="case-attachment-list" id="caseAttachmentList"></div>
      </section>

      <section class="case-editor-section" id="caseEditorPhotoSection">
        <div class="case-editor-section-head"><div><h3>Photo Processing Case</h3><p>No additional questionnaire is required. Add the merchant information, status and case link above.</p></div></div>
        <div class="case-editor-help">The URL / Link of the case is the source of truth for this workflow.</div>
      </section>

      <section class="case-editor-section">
        <div class="field"><label>Internal notes</label><textarea id="caseEditorInternalNotes" placeholder="Private notes saved in this browser…">${esc(record.internalNotes || "")}</textarea></div>
      </section>

      <div class="case-modal-actions">
        <button class="btn ghost" type="button" data-action="cancelCaseEditor">Cancel</button>
        <button class="btn primary" type="button" data-action="saveCaseRecord">${existing ? "Save changes" : "Create case"}</button>
      </div>
    </div>`;
  }

  function updateCaseEditorVisibility() {
    const type = document.getElementById("caseEditorType")?.value || "am";
    const amSection = document.getElementById("caseEditorAmSection");
    const menuSection = document.getElementById("caseEditorMenuSection");
    const photoSection = document.getElementById("caseEditorPhotoSection");
    if (amSection) amSection.hidden = type !== "am";
    if (menuSection) menuSection.hidden = type !== "menu";
    if (photoSection) photoSection.hidden = type !== "photo";
    updateCaseDateVisibility();
    updateCaseLocationVisibility();
  }

  function updateCaseDateVisibility() {
    const type = document.getElementById("caseEditorType")?.value || "am";
    const future = type === "menu" && document.getElementById("caseEditorGoLiveTiming")?.value === "Future Date";
    const temporary = type === "menu" && document.getElementById("caseEditorPermanence")?.value === "Temporary";
    const goLiveField = document.getElementById("caseEditorGoLiveDateField");
    const dueField = document.getElementById("caseEditorDueDateField");
    const revertField = document.getElementById("caseEditorRevertDateField");
    if (goLiveField) goLiveField.hidden = !future;
    if (dueField) dueField.hidden = !future;
    if (revertField) revertField.hidden = !temporary;
  }

  function updateCaseLocationVisibility() {
    const type = document.getElementById("caseEditorType")?.value || "am";
    const scope = document.getElementById("caseEditorLocationScope")?.value || "";
    const field = document.getElementById("caseEditorLocationDetailsField");
    if (field) field.hidden = type !== "menu" || !["Single Location", "Multiple Locations"].includes(scope);
  }

  function renderCaseAttachmentDraft() {
    const host = document.getElementById("caseAttachmentList");
    if (!host) return;
    host.innerHTML = caseAttachmentDraft.length ? caseAttachmentDraft.map((file,index) => `<div class="case-attachment-item"><div><strong>${esc(file.name || "Attachment")}</strong><span>${esc(file.type || "file")} · ${esc(formatCaseBytes(file.size || 0))}</span></div><button class="btn small red" type="button" data-remove-case-attachment="${index}">Remove</button></div>`).join("") : "";
    host.querySelectorAll("[data-remove-case-attachment]").forEach(button => button.addEventListener("click", () => {
      caseAttachmentDraft.splice(Number(button.dataset.removeCaseAttachment), 1);
      renderCaseAttachmentDraft();
    }));
  }

  function bindCaseEditor() {
    document.getElementById("caseEditorType")?.addEventListener("change", updateCaseEditorVisibility);
    document.getElementById("caseEditorPermanence")?.addEventListener("change", updateCaseDateVisibility);
    document.getElementById("caseEditorGoLiveTiming")?.addEventListener("change", updateCaseDateVisibility);
    document.getElementById("caseEditorLocationScope")?.addEventListener("change", updateCaseLocationVisibility);
    document.getElementById("caseEditorAttachments")?.addEventListener("change", event => {
      const files = [...(event.target.files || [])].map(file => ({ name:file.name, size:file.size, type:file.type || "file", lastModified:file.lastModified || 0 }));
      caseAttachmentDraft.push(...files);
      event.target.value = "";
      renderCaseAttachmentDraft();
    });
    updateCaseEditorVisibility();
    renderCaseAttachmentDraft();
  }

  function openCaseEditor(caseId = "") {
    const merchant = selectedMerchant();
    if (!merchant) return toast("Select a merchant first");
    const existing = caseId ? (state.cases || []).find(item => String(item.id) === String(caseId)) : null;
    if (caseId && !existing) return toast("Case not found");
    openModal(existing ? `Edit ${existing.displayId || "case"}` : "New merchant case", `${merchant.store_name} · ${existing ? caseTypeLabel(existing.caseType) : "Choose a case type"}`, caseEditorHTML(merchant, existing));
    document.getElementById("modal").classList.add("case-modal-wide");
    bindCaseEditor();
    setTimeout(() => document.getElementById("caseEditorType")?.focus(), 40);
  }

  function caseEditorError(id, message) {
    const field = document.getElementById(id);
    if (field) {
      field.focus();
      field.scrollIntoView({ block:"center", behavior:"smooth" });
    }
    toast(message);
    return false;
  }

  function saveCaseRecordFromEditor() {
    const merchant = selectedMerchant();
    if (!merchant) return toast("Select a merchant first");
    const editor = document.querySelector("[data-case-editor-id]");
    const existingId = editor?.dataset.caseEditorId || "";
    const existing = existingId ? (state.cases || []).find(item => String(item.id) === String(existingId)) : null;
    const type = caseInputValue("caseEditorType");
    const status = caseInputValue("caseEditorStatus");
    const createdDate = caseInputValue("caseEditorCreatedDate");
    const caseUrl = normalizeCaseUrl(caseInputValue("caseEditorCaseUrl"));
    const merchantName = caseInputValue("caseEditorMerchantName");
    const contactEmail = caseInputValue("caseEditorContactEmail");
    const contactEmailInput = document.getElementById("caseEditorContactEmail");
    if (!CASE_TYPE_LABELS[type]) return caseEditorError("caseEditorType", "Select a valid case type");
    if (!CASE_STATUSES.includes(status)) return caseEditorError("caseEditorStatus", "Select a valid status");
    if (!createdDate) return caseEditorError("caseEditorCreatedDate", "Select the case date");
    if (!caseUrl || !isValidCaseHttpUrl(caseUrl)) return caseEditorError("caseEditorCaseUrl", "Enter a valid case URL");
    if (!merchantName) return caseEditorError("caseEditorMerchantName", "Enter the merchant name");
    if (contactEmail && contactEmailInput && !contactEmailInput.checkValidity()) return caseEditorError("caseEditorContactEmail", "Enter a valid merchant contact email");

    let am = null;
    let menu = null;
    if (type === "am") {
      const category = caseInputValue("caseEditorCategory");
      if (!CASE_ACCOUNT_CATEGORIES.includes(category)) return caseEditorError("caseEditorCategory", "Select an Account Issue Category");
      am = { category };
    }

    if (type === "menu") {
      const permanence = caseInputValue("caseEditorPermanence");
      const goLiveTiming = caseInputValue("caseEditorGoLiveTiming");
      const goLiveDate = caseInputValue("caseEditorGoLiveDate");
      const dueDate = caseInputValue("caseEditorDueDate");
      const revertDate = caseInputValue("caseEditorRevertDate");
      const locationScope = caseInputValue("caseEditorLocationScope");
      const locationDetails = caseInputValue("caseEditorLocationDetails");
      const updateTypes = caseCheckedValues("caseUpdateType");
      const updateDetails = caseCheckedValues("caseUpdateDetail");
      const menusAffected = caseCheckedValues("caseMenuAffected");
      const menuUrl1 = normalizeCaseUrl(caseInputValue("caseEditorMenuUrl1"));
      const menuUrl2 = normalizeCaseUrl(caseInputValue("caseEditorMenuUrl2"));
      const briefDescription = caseInputValue("caseEditorBrief");
      const completionContact = caseInputValue("caseEditorCompletionContact");
      const completionEmail = caseInputValue("caseEditorCompletionEmail");
      const completionEmailInput = document.getElementById("caseEditorCompletionEmail");
      if (!["Permanent", "Temporary"].includes(permanence)) return caseEditorError("caseEditorPermanence", "Select Temporary or Permanent");
      if (!["ASAP", "Future Date"].includes(goLiveTiming)) return caseEditorError("caseEditorGoLiveTiming", "Select when changes should go live");
      if (goLiveTiming === "Future Date" && !goLiveDate) return caseEditorError("caseEditorGoLiveDate", "Select the go-live date");
      if (goLiveTiming === "Future Date" && !dueDate) return caseEditorError("caseEditorDueDate", "Select the due date");
      if (permanence === "Temporary" && !revertDate) return caseEditorError("caseEditorRevertDate", "Select the date to revert changes");
      if (!locationScope) return caseEditorError("caseEditorLocationScope", "Select the location scope");
      if (["Single Location", "Multiple Locations"].includes(locationScope) && !locationDetails) return caseEditorError("caseEditorLocationDetails", "Enter the affected location or Store ID details");
      if (!updateTypes.length) return caseEditorError("caseEditorBrief", "Select at least one Type of Update");
      if (!updateDetails.length) return caseEditorError("caseEditorBrief", "Select at least one Update Detail");
      if (!menusAffected.length) return caseEditorError("caseEditorBrief", "Select at least one affected menu");
      if (menuUrl1 && !isValidCaseHttpUrl(menuUrl1)) return caseEditorError("caseEditorMenuUrl1", "Enter a valid Menu Source URL");
      if (menuUrl2 && !isValidCaseHttpUrl(menuUrl2)) return caseEditorError("caseEditorMenuUrl2", "Enter a valid Menu Source URL 2");
      if (!briefDescription) return caseEditorError("caseEditorBrief", "Enter a brief description of the update");
      if (!completionContact) return caseEditorError("caseEditorCompletionContact", "Enter who should be contacted when complete");
      if (completionEmail && completionEmailInput && !completionEmailInput.checkValidity()) return caseEditorError("caseEditorCompletionEmail", "Enter a valid completion contact email");
      menu = {
        permanence,
        goLiveTiming,
        goLiveDate: goLiveTiming === "Future Date" ? goLiveDate : "",
        dueDate: goLiveTiming === "Future Date" ? dueDate : "",
        revertDate: permanence === "Temporary" ? revertDate : "",
        locationScope,
        locationDetails: locationScope === "All Stores" ? "" : locationDetails,
        updateTypes,
        updateDetails,
        menusAffected,
        ddfbMenu: !!document.getElementById("caseEditorDdfb")?.checked,
        menuSourceUrl1: menuUrl1,
        menuSourceUrl2: menuUrl2,
        menuSourceNotes: caseInputValue("caseEditorMenuNotes"),
        briefDescription,
        completionContact,
        completionContactEmail: completionEmail,
        attachments: caseAttachmentDraft.map(file => ({ name:file.name, size:Number(file.size || 0), type:file.type || "file", lastModified:Number(file.lastModified || 0) }))
      };
    }

    const now = new Date().toISOString();
    const history = Array.isArray(existing?.statusHistory) ? existing.statusHistory.map(item => ({ ...item })) : [];
    if (!existing || existing.status !== status) history.unshift({ status, at:now });
    const record = {
      id: existing?.id || uid("case"),
      displayId: existing?.displayId || makeCaseDisplayId(),
      uid: existing?.uid || merchant.uid,
      caseType: type,
      status,
      statusHistory: history.slice(0, 40),
      createdDate,
      caseUrl,
      externalCaseNumber: caseInputValue("caseEditorExternalNumber"),
      merchant: {
        name: merchantName,
        merchantId: caseInputValue("caseEditorMerchantId"),
        storeIds: caseInputValue("caseEditorStoreIds"),
        marketRegion: caseInputValue("caseEditorMarket"),
        accountManager: caseInputValue("caseEditorAccountManager"),
        contactName: caseInputValue("caseEditorContactName"),
        contactEmail,
        contactPhone: caseInputValue("caseEditorContactPhone")
      },
      am,
      menu,
      internalNotes: caseInputValue("caseEditorInternalNotes"),
      createdAt: existing?.createdAt || now,
      updatedAt: now
    };
    if (existing) state.cases = state.cases.map(item => item.id === existing.id ? record : item);
    else state.cases.unshift(record);
    state.ui.workHubTab = "cases";
    scheduleSave();
    closeModal();
    renderApp();
    toast(existing ? "Case updated" : "Case created");
  }

  function setCaseRecordStatus(caseId, status) {
    const record = (state.cases || []).find(item => String(item.id) === String(caseId));
    if (!record || !CASE_STATUSES.includes(status) || record.status === status) return;
    const now = new Date().toISOString();
    record.status = status;
    record.updatedAt = now;
    record.statusHistory = [{ status, at:now }, ...(Array.isArray(record.statusHistory) ? record.statusHistory : [])].slice(0, 40);
    scheduleSave();
    renderApp({ animate:false });
    toast(`Case status changed to ${status}`);
  }

  function caseDetailList(values) {
    const items = Array.isArray(values) ? values.filter(Boolean) : [];
    return items.length ? `<ul>${items.map(value => `<li>${esc(value)}</li>`).join("")}</ul>` : "";
  }

  function caseDetailLink(value) {
    const url = normalizeCaseUrl(value);
    return url && isValidCaseHttpUrl(url) ? `<a href="${attr(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>` : "";
  }

  function caseDetailMultiline(value) {
    return esc(value || "").replace(/\n/g, "<br>");
  }

    const cards = [];

    const add = (label, value, full = false, raw = false) => {
      if (value === undefined || value === null || value === "" || (Array.isArray(value) && !value.length)) return;
      cards.push(`<div class="case-detail-card ${full ? "full" : ""}"><div class="case-detail-label">${esc(label)}</div><div class="case-detail-value">${raw ? value : esc(String(value))}</div></div>`);
    };
    section("Case information");
    add("Case ID", record.displayId || record.id);
    add("Type Of Case", caseTypeLabel(record.caseType));
    add("Status", record.status);
    add("Case date", formatCaseDate(record.createdDate));
    add("External Case Number", record.externalCaseNumber);
    add("URL / Case link", caseDetailLink(record.caseUrl), true, true);
    section("Merchant information");
    add("Merchant Name", record.merchant?.name);
    add("Merchant ID", record.merchant?.merchantId);
    add("Store ID(s)", record.merchant?.storeIds);
    add("Market / Region", record.merchant?.marketRegion);
    add("Account Manager", record.merchant?.accountManager);
    add("Merchant Contact", record.merchant?.contactName);
    add("Contact Email", record.merchant?.contactEmail);
    add("Contact Phone", record.merchant?.contactPhone);
    if (record.caseType === "am") {
      section("AM Case Details");
      add("Account Issue Category", record.am?.category, true);
    }
    if (record.caseType === "menu") {
      const menu = record.menu || {};
      section("Operational Updates");
      add("Temporary or Permanent", menu.permanence);
      add("When Should Changes Go Live?", menu.goLiveTiming);
      add("Go Live Date", menu.goLiveDate ? formatCaseDate(menu.goLiveDate) : "");
      add("Due Date", menu.dueDate ? formatCaseDate(menu.dueDate) : "");
      add("Date to Revert", menu.revertDate ? formatCaseDate(menu.revertDate) : "");
      add("Location Scope", menu.locationScope);
      add("Location / Store details", menu.locationDetails);
      section("Update Details");
      add("Type of Update", caseDetailList(menu.updateTypes), true, true);
      add("Update Details", caseDetailList(menu.updateDetails), true, true);
      add("Menu(s) Affected", caseDetailList(menu.menusAffected), true, true);
      add("This is a DDFB menu", menu.ddfbMenu ? "Yes" : "No");
      section("Menu Source Updates");
      add("Menu Source URL", caseDetailLink(menu.menuSourceUrl1), true, true);
      add("Menu Source URL 2", caseDetailLink(menu.menuSourceUrl2), true, true);
      add("Menu Source Notes", caseDetailMultiline(menu.menuSourceNotes), true, true);
      section("Closing Information");
      add("Brief description of update", caseDetailMultiline(menu.briefDescription), true, true);
      add("Who To Contact When Complete", menu.completionContact);
      add("Completion Contact Email", menu.completionContactEmail);
      if (Array.isArray(menu.attachments) && menu.attachments.length) add("Attachments", caseDetailList(menu.attachments.map(file => `${file.name} (${formatCaseBytes(file.size || 0)})`)), true, true);
    }
    if (record.caseType === "photo") {
      section("Photo Processing Case");
      add("Workflow", "No additional questions required; the case URL is the source of truth.", true);
    }
    if (record.internalNotes) {
      section("Internal Notes");
      add("Notes", caseDetailMultiline(record.internalNotes), true, true);
    }
    if (Array.isArray(record.statusHistory) && record.statusHistory.length) {
      section("Status history");

      add("Recent status changes", history, true, true);
    }
    add("Last updated", formatDateTime(record.updatedAt || record.createdAt), true);

    return String(value || "merchant").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "merchant";

  function normalizeImportedCase(record, merchant) {
    if (!record || typeof record !== "object") return null;
    const type = CASE_TYPE_LABELS[record.caseType] ? record.caseType : "photo";
    const status = CASE_STATUSES.includes(record.status) ? record.status : "Open";
    const caseUrl = normalizeCaseUrl(record.caseUrl || record.url || "");
    if (!caseUrl || !isValidCaseHttpUrl(caseUrl)) return null;
    const now = new Date().toISOString();
    return {
      id: record.id || uid("case"),
      displayId: record.displayId || makeCaseDisplayId(),
      uid: merchant.uid,
      caseType: type,
      status,
      statusHistory: Array.isArray(record.statusHistory) ? record.statusHistory : [{ status, at:record.updatedAt || now }],
      createdDate: record.createdDate || caseTodayISO(),
      caseUrl,
      externalCaseNumber: String(record.externalCaseNumber || ""),
      merchant: { ...caseEditorMerchantSnapshot(merchant, record), ...(record.merchant || {}) },
      am: type === "am" ? { category: CASE_ACCOUNT_CATEGORIES.includes(record.am?.category) ? record.am.category : "Account settings" } : null,
      menu: type === "menu" && record.menu && typeof record.menu === "object" ? { ...record.menu, attachments:Array.isArray(record.menu.attachments) ? record.menu.attachments : [] } : null,
      internalNotes: String(record.internalNotes || ""),
      createdAt: record.createdAt || now,
      updatedAt: record.updatedAt || now
    };
  }

  async function importMerchantCasesFile(file) {
    const merchant = selectedMerchant();
    if (!merchant) return toast("Select a merchant first");
    try {
      const parsed = JSON.parse(await file.text());
      const source = Array.isArray(parsed) ? parsed : Array.isArray(parsed.cases) ? parsed.cases : [];
      if (!source.length) throw new Error("No cases found in this JSON file");
      const imported = source.map(record => normalizeImportedCase(record, merchant)).filter(Boolean);
      if (!imported.length) throw new Error("No valid cases with HTTP/HTTPS links were found");
      const map = new Map((state.cases || []).map(record => [String(record.id), record]));
      imported.forEach(record => map.set(String(record.id), record));
      state.cases = [...map.values()];
      state.ui.workHubTab = "cases";
      scheduleSave();
      renderApp();
      toast(`${imported.length} case${imported.length === 1 ? "" : "s"} imported`);
    } catch (error) {
      toast(error.message || "Cases could not be imported");
    }
  }

  function cad(value) {

  function formatOne(value) {
    const n = Number(value);

  function adSpendValues(weeklyBudget, costPerOrder) {
    const weekly = Math.max(0, Number(weeklyBudget || 0));
    const cpo = Math.max(.01, Number(costPerOrder || 0));
    const daily = weekly / 7;
    const cap = daily * 2;
    const monthly = daily * 30.4;
    return { weekly, cpo, daily, cap, monthly, dailyOrders: Math.max(0, Math.round(daily / cpo)), capOrders: Math.max(0, Math.round(cap / cpo)) };
  }

  function normalizePromoTypeLabel(type) {
    const raw = String(type || "").trim();
    return PROMO_TYPE_ALIASES[raw] || raw || "Smart campaign";
  }

  function promoNum(value, fallback = 0) {
    const n = Number(value);
    return Number.isFinite(n) ? n : fallback;
  }

  function promoDefaultValues(type, st = {}) {
    const gmv = promoNum(st.gmvHint, 0);
    return {
      budget: promoNum(st.promoCalcBudget, gmv ? Math.max(35, Math.round(gmv / 125)) : 70),
      avgOrder: promoNum(st.promoCalcAvgOrder, gmv ? clamp(Math.round(gmv / 360), 12, 45) : 18),
      outcomeCost: promoNum(st.promoCalcOutcomeCost, 5),
      discountPct: promoNum(st.promoCalcDiscountPct, 20),
      cap: promoNum(st.promoCalcCap, 10),
      hours: promoNum(st.promoCalcHours, 4),
      coopPct: promoNum(st.promoCalcCoopPct, 30),
      targetRoas: promoNum(st.promoCalcTargetRoas, type === "Smart campaign" ? 5.9 : type === "Sponsored listings" ? 5.6 : 4.4),
      redemptions: promoNum(st.promoCalcRedemptions, 25),
      creditAmount: promoNum(st.promoCalcCreditAmount, 100),
      cpc: promoNum(st.promoCalcCpc, 5)
    };
  }

  function promoCalcModel(type, st = {}, merchant = null) {
    const t = normalizePromoTypeLabel(type);
    const v = promoDefaultValues(t, st);
    const avgOrder = Math.max(1, v.avgOrder);
    const budget = Math.max(0, v.budget);
    let unitCost = Math.max(0.01, v.outcomeCost || 1);
    let targetRoas = Math.max(1.1, v.targetRoas || 4.5);
    let redemptions = Math.max(0, v.redemptions || 0);
    let estSales = budget * targetRoas;
    let merchantSpend = budget;
    let partnerShare = 0;
    let benefitText = "Projected uplift";
    let note = "This calculator uses the campaign budget as the base and estimates sales from the expected response rate.";
    let unitLabel = "Cost per outcome";
    let secondary = "Monthly spend";

    if (t === "Smart campaign") {
      unitCost = Math.max(1, v.cpc || 5.5);
      redemptions = Math.max(0, Math.round(budget / unitCost));
      estSales = Math.max(budget * targetRoas, budget * 2.5);
      note = `Smart campaigns blend personalization and optimization. At ${cad(unitCost)} per response, the budget estimates about ${redemptions} actions and ${cad(estSales)} in sales.`;
      benefitText = "Estimated actions";
      unitLabel = "Cost per action";
    } else if (t === "Advertise to all customers") {
      unitCost = Math.max(1, v.cpc || 4.5);
      redemptions = Math.max(0, Math.round(budget / unitCost));
      estSales = Math.max(budget * (targetRoas + 0.4), budget * 3);
      note = `Broad targeting usually trades efficiency for volume. With an assumed ${cad(unitCost)} response cost, this budget yields around ${redemptions} visits and strong reach.`;
      benefitText = "Estimated visits";
      unitLabel = "Cost per visit";
    } else if (t === "Advertise to new customers") {
      unitCost = Math.max(1, v.cpc || 4.25);
      redemptions = Math.max(0, Math.round(budget / unitCost));
      estSales = Math.max(budget * (targetRoas + 0.7), budget * 3.3);
      note = `New-customer targeting prioritizes first orders. This model expects a slightly higher return on spend than broad targeting.`;
      benefitText = "Estimated first orders";
      unitLabel = "Cost per new customer";
    } else if (t === "Buy 1, get 1 free") {
      unitCost = Math.max(0.5, v.outcomeCost || 5);
      redemptions = Math.max(0, Math.round(budget / unitCost));
      estSales = Math.max(redemptions * avgOrder, budget * 2.2);
      targetRoas = estSales / Math.max(1, budget);
      note = `BOGO spend is driven by the free item's cost. If the free item averages ${cad(unitCost)}, this budget supports about ${redemptions} redemptions.`;
      benefitText = "Estimated redemptions";
      unitLabel = "Free item cost";
    } else if (t === "Pay customer's delivery fee") {
      unitCost = Math.max(0.5, v.outcomeCost || 5);
      redemptions = Math.max(0, Math.round(budget / unitCost));
      estSales = Math.max(redemptions * avgOrder * 1.03, budget * 2.5);
      targetRoas = estSales / Math.max(1, budget);
      note = `Covering delivery fees can improve conversion without changing item price. This model assumes a fee of ${cad(unitCost)} per order.`;
      benefitText = "Fee-covered orders";
      unitLabel = "Delivery fee";
    } else if (t === "Happy Hour discount") {
      unitCost = Math.max(0.5, avgOrder * (v.discountPct / 100));
      redemptions = Math.max(0, Math.round(budget / Math.max(unitCost, 0.01)));
      estSales = Math.max(redemptions * avgOrder, budget * 2.1);
      targetRoas = estSales / Math.max(1, budget);
      note = `Happy hour uses the discount value as the spend driver. With ${v.discountPct}% off for ${v.hours} hours, this budget supports about ${redemptions} discounted orders.`;
      benefitText = "Discounted orders";
      unitLabel = "Discount cost / order";
    } else if (t === "Offer free or discounted items") {
      unitCost = Math.max(0.5, v.outcomeCost || 5);
      redemptions = Math.max(0, v.redemptions || Math.round(budget / unitCost));
      estSales = Math.max(redemptions * avgOrder * 1.12, budget * 2.3);
      targetRoas = estSales / Math.max(1, budget);
      note = `Free or discounted item promos work best when the free item cost is controlled. This model assumes ${redemptions} redemptions at ${cad(unitCost)} each.`;
      benefitText = "Eligible redemptions";
      unitLabel = "Item cost";
    } else if (t === "Discount for customers") {
      unitCost = Math.max(0.5, Math.min(avgOrder * (v.discountPct / 100), v.cap > 0 ? v.cap : avgOrder));
      redemptions = Math.max(0, Math.round(budget / Math.max(unitCost, 0.01)));
      estSales = Math.max(redemptions * avgOrder, budget * 2.4);
      targetRoas = estSales / Math.max(1, budget);
      note = `A percentage discount with a cap protects margin. The assumed cost per order is ${cad(unitCost)} based on ${v.discountPct}% off with a ${cad(v.cap)} cap.`;
      benefitText = "Discounted orders";
      unitLabel = "Cost per order";
    } else if (t === "Sponsored listings") {
      unitCost = Math.max(0.25, v.cpc || 5);
      redemptions = Math.max(0, Math.round(budget / unitCost));
      estSales = Math.max(budget * targetRoas, budget * 2.8);
      note = `Sponsored listings translate weekly budget into visibility. At ${cad(unitCost)} per action, you get about ${redemptions} clicks and a visible daily pace.`;
      benefitText = "Estimated clicks";
      unitLabel = "Cost per click";
      secondary = "2x cap";
    } else if (t === "Co-op campaign") {
      partnerShare = budget * (v.coopPct / 100);
      merchantSpend = Math.max(0, budget - partnerShare);
      estSales = Math.max(budget * targetRoas, merchantSpend * (targetRoas + 0.8));
      redemptions = Math.max(0, Math.round(estSales / avgOrder));
      note = `Co-op support shares the spend. This model assumes ${v.coopPct}% partner funding, so merchant spend is ${cad(merchantSpend)} on a ${cad(budget)} campaign.`;
      benefitText = "Partner-funded share";
      unitLabel = "Co-op share";
    } else if (t === "Marketing credit") {
      merchantSpend = Math.max(0, budget - v.creditAmount);
      estSales = Math.max(v.creditAmount * targetRoas, budget * 2.2);
      redemptions = Math.max(0, Math.round(estSales / avgOrder));
      note = `Marketing credit offset reduces the merchant’s cash spend. The model treats the credit as spend relief and estimates return against the credited amount.`;
      benefitText = "Credit value";
      unitLabel = "Credit amount";
    } else {
      unitCost = Math.max(0.5, v.outcomeCost || 5);
      redemptions = Math.max(0, Math.round(budget / unitCost));
      estSales = Math.max(budget * targetRoas, budget * 2.2);
      note = `Generic promo model for custom promotions. Use the budget and your expected response cost to estimate the likely return.`;
      benefitText = "Estimated outcomes";
      unitLabel = "Cost per outcome";
    }

    const estOrders = redemptions || Math.max(0, Math.round(estSales / avgOrder));
    const monthly = budget * 4.34;
    const daily = budget / 7;
    const roas = estSales / Math.max(1, merchantSpend || budget);
    const net = estSales - merchantSpend;
    return {
      type: t,
      budget,
      avgOrder,
      unitCost,
      targetRoas,
      estOrders,
      estSales,
      merchantSpend,
      partnerShare,
      roas,
      monthly,
      daily,
      net,
      note,
      benefitText,
      unitLabel,
      secondary,
      discountPct: v.discountPct,
      cap: v.cap,
      hours: v.hours,
      coopPct: v.coopPct,
      redemptions,
      creditAmount: v.creditAmount,
      cpc: v.cpc,
      merchantLabel: merchant?.store_name || "Merchant"
    };
  }

  function merchantInsightSnapshot(merchant) {
    const uidValue = merchant?.uid;
    const calls = callsFor(uidValue).sort((a, b) => String(b.completedAt).localeCompare(String(a.completedAt)));
    const photos = photosFor(uidValue).sort((a, b) => String(b.timestamp).localeCompare(String(a.timestamp)));
    const sales = salesFor(uidValue).sort((a, b) => String(b.timestamp).localeCompare(String(a.timestamp)));
    const credits = creditsFor(uidValue).sort((a, b) => String(b.timestamp).localeCompare(String(a.timestamp)));
    const followups = followupsFor(uidValue).sort((a, b) => String((b.updatedAt || b.createdAt) || "").localeCompare(String((a.updatedAt || a.createdAt) || "")));
    const cases = casesFor(uidValue).sort((a, b) => String(b.updatedAt || b.createdAt || "").localeCompare(String(a.updatedAt || a.createdAt || "")));
    const timeline = [
      ...calls.map(x => ({ icon: "☎", title: x.disposition || x.state, detail: `Real ${mmss(x.durationSec)} · Credited ${mmss(x.creditedSec)}${x.note ? ` · ${x.note}` : ""}`, timestamp: x.completedAt })),
      ...photos.map(x => ({ icon: "▧", title: `${x.photosAdded} photos added`, detail: `${x.status} · Coverage ${pct(x.coverageAfter)}${x.note ? ` · ${x.note}` : ""}`, timestamp: x.timestamp })),
      ...followups.map(x => ({ icon: "◫", title: `Follow-up ${x.status}`, detail: `${x.reason} · ${x.date} ${x.time || ""}`, timestamp: x.updatedAt || x.createdAt })),
      ...sales.map(x => ({ icon: "◎", title: `Sales: ${x.type}`, detail: `${x.status} · ${x.campaign || "No campaign"}`, timestamp: x.timestamp })),
      ...credits.map(x => ({ icon: "$", title: `Credit ${money2(x.amount)}`, detail: `${x.type} · ${x.status}`, timestamp: x.timestamp })),
      ...cases.map(x => ({ icon: "#", title: `${caseTypeLabel(x.caseType)} · ${x.status}`, detail: `${x.displayId || x.externalCaseNumber || "Case"}${x.am?.category ? ` · ${x.am.category}` : ""}`, timestamp: x.updatedAt || x.createdAt }))
    ].sort((a, b) => String(b.timestamp || "").localeCompare(String(a.timestamp || "")));
    const latestPhoto = photos[0] || null;
    const photoCoverage = latestPhoto && latestPhoto.coverageAfter != null
      ? clamp(Number(latestPhoto.coverageAfter), 0, 100)
      : clamp(Number(merchant?.photo_coverage ?? 0), 0, 100);
    const touchpointCount = calls.length + followups.length;
    return { calls, photos, sales, credits, followups, cases, timeline, latestPhoto, photoCoverage, touchpointCount };
  }

  function syncMerchantInsightsFromTimeline(uidValue) {
    const merchant = getMerchant(uidValue);
    if (!merchant) return { changed: false, syncedAt: null };
    const snapshot = merchantInsightSnapshot(merchant);
    const patch = {};
    if (snapshot.latestPhoto && snapshot.latestPhoto.coverageAfter != null) {
      const coverage = clamp(Number(snapshot.latestPhoto.coverageAfter), 0, 100);
      if (Number(merchant.photo_coverage ?? 0) !== coverage) patch.photo_coverage = coverage;
    }
    if (Number(merchant.touchpoint_count || 0) !== snapshot.touchpointCount) patch.touchpoint_count = snapshot.touchpointCount;
    const changed = Object.keys(patch).length > 0;
    if (changed) {
      Object.assign(merchant, patch);
    }
    const syncedAt = new Date().toISOString();
    state.merchantStates[String(uidValue)] = { ...merchantState(uidValue), insightsSyncedAt: syncedAt, insightsSyncedFrom: snapshot.timeline[0]?.timestamp || "" };
    scheduleSave();
    return { changed, syncedAt, snapshot };
  }
